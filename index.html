<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Pages</title>
<style>
  :root{ --bg:#faf9f7; --text:#1f2320; --muted:#5c6560; --border:#dfe3df; --card-bg:#ffffff; --link:#1a5d3a; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1b1e1c; --text:#eceeec; --muted:#a9b0ab; --border:#3a3f3b; --card-bg:#222521; --link:#7bd1a4; }
  }
  body{ background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; margin:0; padding:48px 20px; }
  .cards-container { margin-top: 40px;}
  .cards-container>h1,.cards-container>h3{ text-align:center; margin-bottom:8px; }
  p.sub{ text-align:center; color:var(--muted); margin-top:0; margin-bottom:40px; }
  .cards{ display:flex; flex-wrap:wrap; gap:20px; justify-content:center; max-width:720px; margin:0 auto; }
  a.card{ display:block; width:280px; padding:24px; border:1px solid var(--border); border-radius:12px; background:var(--card-bg); text-decoration:none; color:var(--text); }
  a.card:hover{ border-color:var(--link); }
  a.card h2{ margin:0 0 6px; color:var(--link); font-size:1.2rem; }
  a.card p{ margin:0; color:var(--muted); font-size:0.9rem; }
</style>
</head>
<body>
<div class="cards-container">
<h1>Family Pages</h1>
<p class="sub">Pick something to view.</p>
<div class="cards">
  <a class="card" href="/adirondacks/">
    <h2>Adirondacks long weekend</h2>
    <p>Interactive route + stops map</p>
  </a>
  <a class="card" href="/oregon/">
    <h2>Oregon road trip</h2>
    <p>Interactive route + stops map</p>
  </a>
  <br/>
  <br/>
  <br/> 
</div>
</div>
<div class="cards-container">
<h3>Older versions</h1>
<!-- <p class="sub">before adding images to the trip views.</p> -->
<div class="cards">
  <a class="card" href="/adirondacks_v1/">
    <h2>Adirondacks long weekend - V1 no photos</h2>
    <p>Interactive route + stops map</p>
  </a>
  <a class="card" href="/oregon_v1/">
    <h2>Oregon road trip - V1 no photos</h2>
    <p>Interactive route + stops map</p>
  </a>
</div>
</div>
</body>
</html>
