<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Oregon road trip</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; font-family:'Inter', system-ui, sans-serif; }
  html, body { height:100%; width:100%; overflow:hidden; background:#0f172a; color:#f8fafc;
               -webkit-text-size-adjust:100%; }
  #map { position:absolute; inset:0; height:100%; width:100%; background:#0f172a; }

  /* ---------- Floating control card ---------- */
  .panel{
    position:absolute; z-index:1000;
    top:max(14px, env(safe-area-inset-top)); left:14px;
    width:min(400px, calc(100vw - 28px));
    background:rgba(15,23,42,.94); backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.15); border-radius:14px;
    box-shadow:0 14px 32px -5px rgba(0,0,0,.65);
    display:flex; flex-direction:column;
    max-height:calc(100dvh - 28px);
    overflow:hidden;
  }
  .panel-head{
    display:flex; align-items:center; gap:10px; cursor:pointer;
    padding:14px 16px; user-select:none; flex:none;
  }
  .panel-head:hover .chev{ color:#e2e8f0; }
  .head-text{ flex:1; min-width:0; }
  .title{ font-size:1.05rem; font-weight:800; color:#38bdf8; line-height:1.25; }
  .subtitle{ font-size:.74rem; color:#94a3b8; margin-top:2px; line-height:1.35; }
  /* Wrap freely when open; stay on one line only when the card is shut. */
  .panel.collapsed .subtitle{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* A lone gray arrow character reads as decoration, not a control - this is
     a visible pill button so a shut panel doesn't look like a dead end. */
  .chev{ flex:none; display:flex; align-items:center; gap:5px;
         color:#7dd3fc; font-size:.66rem; font-weight:700; letter-spacing:.03em;
         text-transform:uppercase;
         background:rgba(56,189,248,.16); border:1px solid rgba(56,189,248,.45);
         border-radius:999px; padding:6px 11px 6px 13px;
         transition:background .15s ease, border-color .15s ease; }
  .panel-head:hover .chev{ background:rgba(56,189,248,.26); border-color:rgba(56,189,248,.7); }
  .chev-arrow{ display:inline-block; font-size:.8rem; transition:transform .22s ease; }
  .panel.collapsed .chev-arrow{ transform:rotate(-90deg); }
  @keyframes chevPulse{
    0%, 100% { box-shadow:0 0 0 0 rgba(56,189,248,.55); }
    50%      { box-shadow:0 0 0 7px rgba(56,189,248,0); }
  }
  .chev.attn{ animation:chevPulse 1.2s ease-out 3; }
  .panel-body{
    padding:0 16px 16px; overflow-y:auto; overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
  }
  .panel.collapsed .panel-body{ display:none; }

  /* Collapsed summary chips, so a shut panel still tells you something */
  .mini{ display:none; gap:6px; padding:0 16px 12px; flex-wrap:wrap; }
  .panel.collapsed .mini{ display:flex; }
  .mini span{ font-size:.68rem; font-weight:600; color:#cbd5e1;
              background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.1);
              border-radius:999px; padding:3px 9px; }

  /* ---------- Stats ---------- */
  .stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px;
          border-top:1px solid rgba(255,255,255,.08);
          border-bottom:1px solid rgba(255,255,255,.08);
          padding:10px 0; margin-bottom:12px; }
  .stat{ text-align:center; min-width:0; }
  .stat-val{ font-size:1.05rem; font-weight:700; color:#f1f5f9; line-height:1.15; }
  .stat-lbl{ font-size:.6rem; color:#64748b; text-transform:uppercase;
             letter-spacing:.05em; margin-top:2px; }

  /* ---------- Legend ---------- */
  .legend{ display:flex; flex-wrap:wrap; gap:9px; padding:8px 10px;
           background:rgba(255,255,255,.05); border-radius:8px;
           margin-bottom:12px; font-size:.7rem; color:#cbd5e1; }
  .legend-item{ display:flex; align-items:center; gap:6px; }
  .dot{ width:10px; height:10px; border-radius:50%; flex:none; }
  .dash{ width:16px; height:0; border-top:2.5px dashed #34d399; flex:none; }

  .section-label{ font-size:.68rem; color:#94a3b8; font-weight:600;
                  text-transform:uppercase; letter-spacing:.05em; margin:0 0 6px; }

  /* ---------- Buttons ---------- */
  .btn-row{ display:flex; flex-wrap:wrap; gap:5px; margin-bottom:12px; }
  .btn{ background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1);
        color:#cbd5e1; padding:5px 9px; border-radius:7px; font-size:.7rem;
        cursor:pointer; transition:all .15s ease; font-weight:500;
        display:inline-flex; align-items:center; gap:5px; }
  .btn:hover{ background:rgba(255,255,255,.12); color:#f1f5f9; }
  .btn.active{ background:#0284c7; border-color:#38bdf8; color:#fff; font-weight:600; }
  .btn .swatch{ width:8px; height:8px; border-radius:2px; flex:none; }
  .btn .km{ opacity:.65; font-size:.64rem; }

  .toggle-note{ font-size:.66rem; color:#64748b; line-height:1.45; margin-top:-6px;
                margin-bottom:12px; }

  /* ---------- Map pins ---------- */
  .pin{ border-radius:20px; padding:3px 9px; font-size:.7rem; font-weight:700;
        white-space:nowrap; display:flex; align-items:center; gap:5px; cursor:pointer; }
  /* Long names must not run off a narrow screen; the full text is in the popup. */
  .pin .pin-name{ overflow:hidden; text-overflow:ellipsis; max-width:30vw;
                  display:inline-flex; align-items:center; gap:4px; }
  /* Same flat vector glyph as the compact badge, just shrunk - keeps the icon
     consistent across the zoom threshold instead of swapping to emoji. */
  .pin-name svg{ width:13px; height:13px; flex:none; }
  .pin-night{ background:#1e3a8a; border:2px solid #60a5fa; color:#eff6ff;
              box-shadow:0 4px 14px rgba(59,130,246,.4); }
  .pin-hike{ background:#022c22; border:2px solid #10b981; color:#ecfdf5;
             box-shadow:0 4px 14px rgba(16,185,129,.4); }
  .pin-long{ background:#334155; border:2px solid #94a3b8; color:#f1f5f9;
             box-shadow:0 4px 10px rgba(100,116,139,.35); }
  .badge{ padding:1px 6px; border-radius:9px; font-size:.62rem; font-weight:700; }
  .badge-night{ background:#1d4ed8; color:#dbeafe; }
  .badge-hike{ background:#047857; color:#d1fae5; }
  .badge-long{ background:#475569; color:#e2e8f0; }

  /* Zoom-dependent compact marker: icon only, no text, shown when zoomed out
     past ICON_ZOOM_THRESHOLD so it stays legible at trip-overview scale
     instead of shrinking into unreadable text. Flat single-color vector
     shapes rather than emoji - an emoji is a tiny detailed illustration and
     degrades to mush well before it's small enough to need this treatment. */
  .pin-compact{ width:40px; height:40px; border-radius:50%; display:flex;
                align-items:center; justify-content:center; cursor:pointer; }
  .pin-compact svg{ width:27px; height:27px; display:block; }
  .pin-compact.night{ background:#2563eb; border:3px solid #bfdbfe;
                       box-shadow:0 4px 14px rgba(37,99,235,.6); }
  .pin-compact.hike{ background:#059669; border:3px solid #bbf7d0;
                      box-shadow:0 4px 14px rgba(16,185,129,.6); }
  .pin-compact.long{ background:#475569; border:3px solid #cbd5e1;
                      box-shadow:0 4px 14px rgba(71,85,105,.55); }

  /* ---------- Popups ---------- */
  .leaflet-popup-content-wrapper{ background:#1e293b; color:#f8fafc; border-radius:10px;
      box-shadow:0 12px 24px rgba(0,0,0,.5); border:1px solid rgba(255,255,255,.12); }
  .leaflet-popup-content{ margin:12px 14px; font-size:.78rem; line-height:1.5; }
  .leaflet-popup-tip{ background:#1e293b; }
  .leaflet-popup-close-button{ color:#94a3b8 !important; }
  .pop-title{ font-weight:800; font-size:.92rem; margin-bottom:4px; }
  .pop-night{ color:#60a5fa; } .pop-hike{ color:#34d399; }
  .pop-long{ color:#94a3b8; }  .pop-plain{ color:#38bdf8; }
  .pop-badge{ display:inline-block; padding:2px 7px; border-radius:5px; font-size:.66rem;
              font-weight:700; margin-bottom:7px; }
  .pop-sub{ color:#94a3b8; font-size:.72rem; margin-bottom:6px; }
  .pop-row{ font-size:.74rem; color:#cbd5e1; }
  .pop-desc{ font-size:.73rem; color:#cbd5e1; border-top:1px solid rgba(255,255,255,.08);
             padding-top:7px; margin-top:7px; }
  .pop-link{ color:#38bdf8; text-decoration:none; font-weight:600;
             display:inline-block; margin-top:5px; }
  .pop-warn{ color:#fca5a5; font-size:.68rem; margin-top:5px; }
  .prov{ color:#475569; font-size:.64rem; margin-top:6px; font-style:italic; }

  .leaflet-control-attribution{ background:rgba(15,23,42,.82) !important; color:#64748b !important;
      font-size:.62rem !important; }
  .leaflet-control-attribution a{ color:#94a3b8 !important; }

  /* ---------- Mobile ---------- */
  @media (max-width:767px){
    .panel{ left:10px; width:calc(100vw - 20px); top:max(10px, env(safe-area-inset-top)); }
    .panel-head{ padding:11px 13px; }
    .title{ font-size:.95rem; }
    .panel-body{ padding:0 13px 13px; }
    .mini{ padding:0 13px 10px; }
    .stat-val{ font-size:.95rem; }
    .btn{ padding:6px 10px; font-size:.72rem; }   /* larger touch targets */
    .pin{ font-size:.66rem; padding:2px 7px; }
    .pin .pin-name{ max-width:44vw; }
  }
</style>
</head>
<body>

<div class="panel" id="panel">
  <div class="panel-head" id="panelHead" role="button" tabindex="0"
       aria-expanded="true" aria-controls="panelBody">
    <div class="head-text">
      <div class="title" id="tripTitle"></div>
      <div class="subtitle" id="tripSubtitle"></div>
    </div>
    <div class="chev" id="chev">
      <span id="chevLabel">Details</span><span class="chev-arrow">▾</span>
    </div>
  </div>

  <div class="mini" id="miniStats"></div>

  <div class="panel-body" id="panelBody">
    <div class="stats" id="statsGrid"></div>
    <div class="legend" id="legend"></div>

    <div class="section-label">Filter by day</div>
    <div class="btn-row" id="dayFilter"></div>

    <div class="section-label">Likely hikes</div>
    <div class="btn-row" id="hikeToggle"></div>
    <div class="toggle-note" id="hikeNote"></div>

    <div class="section-label">Basemap</div>
    <div class="btn-row" id="baseToggle"></div>
  </div>
</div>

<div id="map"></div>

  `<a class="pin-link pop-link" target="_blank" rel="noopener"
      href="https://www.google.com/maps?q=${lat},${lng}">📍 Open in Google Maps ↗</a>`;

const nameOf = o => o.label || o.db_name || o.place_name || 'Unnamed stop';
const dayColor = d => (TRIP.days.find(x => x.date === d) || {}).color || '#38bdf8';

/* ------------------------------------------------------------------- map */
const map = L.map('map', { zoomControl:false, preferCanvas:true }).setView([43, -74], 7);
L.control.zoom({ position:'bottomright' }).addTo(map);
L.control.scale({ position:'bottomleft', imperial:IMPERIAL, metric:!IMPERIAL }).addTo(map);

/* Basemaps must work from a file:// page with no Referer, because that is how
   a shared copy gets opened out of an email attachment. CARTO's Voyager tiles
   (used by the design this page follows) fail that test - without an API key
   they come back stamped "API KEY REQUIRED", at 1x as well as @2x - so the
   look is reproduced with key-free providers instead. */
const BASEMAPS = {
  Map: L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:'&copy; OpenStreetMap contributors', maxZoom:19 }),
  Muted: L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
    attribution:'Tiles &copy; Esri, HERE, Garmin, &copy; OpenStreetMap contributors',
    maxZoom:16 }),
  Terrain: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
    attribution:'&copy; OpenStreetMap contributors, SRTM | &copy; OpenTopoMap (CC-BY-SA)',
    maxZoom:17 }),
  Satellite: L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution:'Imagery &copy; Esri, Maxar, Earthstar Geographics', maxZoom:19 })
};
let activeBase = BASEMAPS.Map.addTo(map);

const routeLayer   = L.layerGroup().addTo(map);
const walkLayer    = L.layerGroup().addTo(map);
const markerLayer  = L.layerGroup().addTo(map);

let currentDay  = 'all';
let hikeRule    = 'smart';       // 'smart' | 'naive'

/* --------------------------------------------------------------- rendering */
function visibleDays(){
  return currentDay === 'all' ? TRIP.days : TRIP.days.filter(d => d.date === currentDay);
}
function isHike(stop){
  return hikeRule === 'smart' ? !!stop.hike_smart : !!stop.hike_naive;
}

function drawRoute(){
  routeLayer.clearLayers();
  const bounds = [];
  visibleDays().forEach(day => {
    day.segments.forEach(seg => {
      const latlngs = seg.map(p => [p[0], p[1]]);
      // Dark casing underneath keeps bright day colours legible on any basemap.
      L.polyline(latlngs, { color:'#0f172a', weight:7, opacity:.35,
                            lineJoin:'round', lineCap:'round' }).addTo(routeLayer);
      L.polyline(latlngs, { color:day.color, weight:4, opacity:.95,
                            lineJoin:'round', lineCap:'round' })
        .addTo(routeLayer)
        .bindPopup(`<div class="pop-title pop-plain">${esc(day.label)}</div>
                    <div class="pop-row">${fmtDist(day.distance_km)} ${distUnit} travelled</div>`);
      latlngs.forEach(p => bounds.push(p));
    });
  });
  return bounds;
}

function drawFlights(){
  // Air legs get a dashed great-circle arc so a flight never looks like a road.
  (TRIP.flights || []).forEach(f => {
    if (currentDay !== 'all' && f.local_date !== currentDay) return;
    const arc = greatCircle([f.from_lat, f.from_lng], [f.to_lat, f.to_lng]);
    L.polyline(arc, { color:'#38bdf8', weight:2.5, opacity:.9, dashArray:'8,7' })
      .addTo(routeLayer)
      .bindPopup(`<div class="pop-title pop-plain">✈️ ${esc(f.from_name)} → ${esc(f.to_name)}</div>
                  <div class="pop-row">${esc(f.start_label)} → ${esc(f.end_label)}</div>
                  <div class="pop-row">${fmtDist(f.km)} ${distUnit}</div>`);
  });
}
function greatCircle(a, b, n = 64){
  const [φ1, λ1] = [a[0]*Math.PI/180, a[1]*Math.PI/180];
  const [φ2, λ2] = [b[0]*Math.PI/180, b[1]*Math.PI/180];
  const d = 2*Math.asin(Math.sqrt(Math.sin((φ2-φ1)/2)**2 +
            Math.cos(φ1)*Math.cos(φ2)*Math.sin((λ2-λ1)/2)**2));
  if (!d) return [a, b];
  const out = [];
  for (let i = 0; i <= n; i++){
    const f = i/n, A = Math.sin((1-f)*d)/Math.sin(d), B = Math.sin(f*d)/Math.sin(d);
    const x = A*Math.cos(φ1)*Math.cos(λ1) + B*Math.cos(φ2)*Math.cos(λ2);
    const y = A*Math.cos(φ1)*Math.sin(λ1) + B*Math.cos(φ2)*Math.sin(λ2);
    const z = A*Math.sin(φ1) + B*Math.sin(φ2);
    out.push([Math.atan2(z, Math.hypot(x,y))*180/Math.PI, Math.atan2(y,x)*180/Math.PI]);
  }
  return out;
}

function drawWalks(){
  walkLayer.clearLayers();
  (TRIP.walks || []).forEach(w => {
    if (!w.is_hike) return;
    if (currentDay !== 'all' && w.local_date !== currentDay) return;
    if (!w.pts || w.pts.length < 2) return;
    L.polyline(w.pts, { color:'#0f172a', weight:8, opacity:.4 }).addTo(walkLayer);
    L.polyline(w.pts, { color:'#34d399', weight:4, opacity:1, dashArray:'7,6',
                        lineCap:'round' })
      .addTo(walkLayer)
      .bindPopup(`
        <div class="pop-title pop-hike">🥾 ${esc(nameOf(w))}</div>
        ${w.sublabel ? `<div class="pop-sub">${esc(w.sublabel)}</div>` : ''}
        <div class="pop-badge badge-hike">On foot · ${fmtDist(w.km)} ${distUnit} · ${w.minutes} min</div>
        <div class="pop-row">${esc(w.day_label)}, ${esc(w.start_label)} – ${esc(w.end_label)}</div>
        <div class="pop-desc">Recorded as a walking segment, which is why this
          reads as a hike rather than a rest stop.${gmaps(w.pts[0][0], w.pts[0][1])}</div>`);
  });
}

function nightsAt(lat, lng){
  return (TRIP.nights || []).filter(n =>
    Math.abs(n.lat - lat) < 0.005 && Math.abs(n.lng - lng) < 0.005).length;
}

function drawMarkers(){
  markerLayer.clearLayers();
  const bounds = [];

  (TRIP.stops || []).forEach(stop => {
    if (currentDay !== 'all' && stop.local_date !== currentDay) return;
    bounds.push([stop.lat, stop.lng]);

    const low   = Number(stop.confidence) < 0.5;
    const hike  = isHike(stop);
    const night = stop.is_overnight;
    const long  = !night && !hike && Number(stop.hours) >= (M.min_stop_hours || 1);

    if (night){
      const n = nightsAt(stop.lat, stop.lng) || 1;
      addPin(stop, 'pin-night', 'badge-night', '🏨', `🌙 ${n} night${n>1?'s':''}`,
             'pop-night', `${stop.hours} h`, low);
    } else if (hike){
      addPin(stop, 'pin-hike', 'badge-hike', '🥾', `${stop.hours} h`,
             'pop-hike', `${stop.hours} h stop`, low);
    } else if (long){
      addPin(stop, 'pin-long', 'badge-long', '⏱', `${stop.hours} h`,
             'pop-long', `${stop.hours} h stop`, low);
    } else {
      // Short stops stay as unobtrusive dots so the map does not turn into soup.
      L.circleMarker([stop.lat, stop.lng], {
        radius:4, color:'#0f172a', weight:1.5,
        fillColor:dayColor(stop.local_date), fillOpacity:.95
      }).addTo(markerLayer).bindPopup(popupHTML(stop, 'pop-plain', null, null, low));
    }
  });
  return bounds;
}

// Below this zoom, labeled pills collapse to icon-only badges so an overview
// of the whole trip doesn't turn into unreadable text; zooming into a single
// day or a cluster reveals full names again.
const ICON_ZOOM_THRESHOLD = 10;

// Flat single-color vector glyphs, not emoji. An emoji is a tiny detailed
// illustration - at badge size it just turns to mud (an early hiking-boot
// emoji attempt here read as "a shark"). A shape built from 1-2 strokes has
// nothing to lose at small sizes, so it stays crisp instead of degrading.
const COMPACT_ICONS = {
  night: '<svg viewBox="0 0 24 24"><path fill="#fff" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>',
  hike: '<svg viewBox="0 0 24 24"><path fill="#fff" d="M2 20h20L15 6l-3.5 6.5L9 8.5 2 20z"/></svg>',
  long: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#fff" stroke-width="2"/>' +
        '<path fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" d="M12 7v5l3.5 2"/></svg>'
};

function addPin(stop, pinCls, badgeCls, icon, badgeText, titleCls, durText, low){
  const compact = map.getZoom() < ICON_ZOOM_THRESHOLD;
  const kind = pinCls.replace('pin-', '');
  const glyph = COMPACT_ICONS[kind] || icon;
  const html = compact
    ? `<div class="pin-compact ${kind}">${glyph}</div>`
    : `<div class="pin ${pinCls}">
         <span class="pin-name">${glyph}${esc(nameOf(stop))}</span>
         <span class="badge ${badgeCls}">${esc(badgeText)}</span>
       </div>`;
  L.marker([stop.lat, stop.lng], {
    icon: L.divIcon({
      className:'', html,
      iconSize: compact ? [40, 40] : null,
      iconAnchor: compact ? [20, 20] : [0, 14]
    }),
    riseOnHover:true
  }).addTo(markerLayer).bindPopup(popupHTML(stop, titleCls, badgeCls, durText, low));
}

function popupHTML(stop, titleCls, badgeCls, durText, low){
  const warn = low
    ? `<div class="pop-warn">⚠ Low confidence: ${esc(stop.confidence_reason)}</div>` : '';
  const prov = (stop.label && stop.db_name && stop.label !== stop.db_name)
    ? `<div class="prov">Database record: ${esc(stop.db_name)}</div>` : '';
  return `
    <div class="pop-title ${titleCls}">${esc(nameOf(stop))}</div>
    ${stop.sublabel ? `<div class="pop-sub">${esc(stop.sublabel)}</div>` : ''}
    ${durText && badgeCls ? `<div class="pop-badge ${badgeCls}">${esc(durText)}</div>` : ''}
    <div class="pop-row"><b>${esc(stop.day_label)}</b> · ${esc(stop.start_label)} – ${esc(stop.end_label)}</div>
    <div class="pop-desc">${gmaps(stop.lat, stop.lng)}</div>
    ${warn}${prov}`;
}

function render(fit){
  const b1 = drawRoute();
  drawFlights();
  drawWalks();
  const b2 = drawMarkers();
  const all = b1.concat(b2);
  if (fit && all.length) fitTo(L.latLngBounds(all));
}

// Our own fitBounds fires zoomstart too, so flag it and ignore those events -
// otherwise the map would immediately think the reader had taken control.
let programmatic = false;
function fitTo(bounds){
  programmatic = true;
  map.fitBounds(bounds, fitOpts());
  setTimeout(() => { programmatic = false; }, 500);
}

function fitOpts(){
  // Asymmetric padding: the open panel covers the left edge, so the route is
  // centred in the space that is actually visible rather than behind the card.
  const small = window.innerWidth < 768;
  const panelEl = document.getElementById('panel');
  if (small) return { padding:[28, 28] };
  const open = !panelEl.classList.contains('collapsed');
  // Cap the panel-clearance pad at a share of the viewport. Uncapped, a wide
  // screen showing a tall narrow route spends most of its width on padding and
  // the trip ends up as a thin strip pinned to the right edge.
  const wanted = (open ? panelEl.offsetWidth : 0) + 40;
  const left = Math.min(wanted, map.getSize().x * 0.28);
  return { paddingTopLeft:[left, 40], paddingBottomRight:[50, 50] };
}

/* --------------------------------------------------------------- controls */
function buildChrome(){
  document.getElementById('tripTitle').textContent = M.title || 'Trip';
  document.getElementById('tripSubtitle').textContent =
    M.subtitle || `${M.start_date} – ${M.end_date}`;
  document.title = M.title || 'Trip';

  const stats = [
    [`${fmtDist(S.total_km)}`, distUnit === 'km' ? 'Kilometres' : 'Miles'],
    [S.nights_away, S.nights_away === 1 ? 'Night away' : 'Nights away'],
    [S.distinct_stay_places, S.distinct_stay_places === 1 ? 'Place stayed' : 'Places stayed'],
    [S.hikes_smart, S.hikes_smart === 1 ? 'Likely hike' : 'Likely hikes']
  ];
  document.getElementById('statsGrid').innerHTML = stats.map(([v, l]) =>
    `<div class="stat"><div class="stat-val">${esc(v)}</div>
     <div class="stat-lbl">${esc(l)}</div></div>`).join('');

  document.getElementById('miniStats').innerHTML = [
    `${fmtDist(S.total_km)} ${distUnit}`,
    `${S.nights_away} night${S.nights_away === 1 ? '' : 's'}`,
    `${S.hikes_smart} hike${S.hikes_smart === 1 ? '' : 's'}`
  ].map(t => `<span>${esc(t)}</span>`).join('');

  document.getElementById('legend').innerHTML = `
    <div class="legend-item"><div class="dot" style="background:#2563eb"></div>Overnight</div>
    <div class="legend-item"><div class="dot" style="background:#10b981"></div>Likely hike</div>
    <div class="legend-item"><div class="dot" style="background:#64748b"></div>Long stop</div>
    <div class="legend-item"><div class="dash"></div>On foot</div>`;

  // Day filter
  const df = document.getElementById('dayFilter');
  df.appendChild(mkBtn('All days', true, ev => setDay('all', ev)));
  TRIP.days.forEach(d => {
    df.appendChild(mkBtn(
      `<span class="swatch" style="background:${d.color}"></span>${esc(d.label)}
       <span class="km">${fmtDist(d.distance_km)}${distUnit}</span>`,
      false, ev => setDay(d.date, ev)));
  });

  // Hike rule toggle
  const ht = document.getElementById('hikeToggle');
  ht.appendChild(mkBtn(`Walk-confirmed (${S.hikes_smart})`, true, ev => setRule('smart', ev)));
  ht.appendChild(mkBtn(`Any stop ≥ ${M.min_stop_hours}h (${S.hikes_naive})`, false,
                       ev => setRule('naive', ev)));
  updateHikeNote();

  // Basemap
  const bt = document.getElementById('baseToggle');
  Object.keys(BASEMAPS).forEach((k, i) => {
    bt.appendChild(mkBtn(k, i === 0, ev => {
      map.removeLayer(activeBase);
      activeBase = BASEMAPS[k].addTo(map);
      activeBase.bringToBack();
      setActive(ev);
    }));
  });
}

function mkBtn(html, active, fn){
  const b = document.createElement('button');
  b.className = 'btn' + (active ? ' active' : '');
  b.type = 'button';
  b.innerHTML = html;
  b.addEventListener('click', fn);
  return b;
}
function setActive(ev){
  const btn = ev.currentTarget;
  btn.parentElement.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}
function setDay(date, ev){
  currentDay = date;
  setActive(ev);
  render(true);
}
function setRule(rule, ev){
  hikeRule = rule;
  setActive(ev);
  updateHikeNote();
  render(false);
}
function updateHikeNote(){
  document.getElementById('hikeNote').textContent = hikeRule === 'smart'
    ? 'A long stop counts as a hike only when a walking segment was recorded beside it — this rejects highway rest stops.'
    : `Every stop of ${M.min_stop_hours}h or more, overnight stays excluded. Includes rest stops where no walking was recorded.`;
}

/* --------------------------------------------------------------- panel UX */
const panel = document.getElementById('panel');
const head  = document.getElementById('panelHead');
// Once the reader opens or shuts the card themselves, stop second-guessing them
// on resize; until then the card follows the breakpoint (including rotation).
let userToggled = false;
const chev = document.getElementById('chev');
const chevLabel = document.getElementById('chevLabel');
function setCollapsed(state){
  panel.classList.toggle('collapsed', state);
  head.setAttribute('aria-expanded', String(!state));
  chevLabel.textContent = state ? 'Details' : 'Hide';
}
function autoCollapse(){
  if (!userToggled) setCollapsed(window.innerWidth < 768);
}
head.addEventListener('click', () => {
  userToggled = true;
  chev.classList.remove('attn');
  setCollapsed(!panel.classList.contains('collapsed'));
});
head.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); head.click(); }
});
// Keep map gestures from being hijacked by the panel.
L.DomEvent.disableClickPropagation(panel);
L.DomEvent.disableScrollPropagation(panel);

/* ------------------------------------------------------------------- boot */
// Track whether the reader has taken control, so a resize never yanks the map
// back from where they panned to.
let userMoved = false;
map.on('dragstart zoomstart', () => { if (!programmatic) userMoved = true; });
// Markers swap between compact and labeled form as zoom crosses
// ICON_ZOOM_THRESHOLD. Only markers are redrawn - route/walks don't change.
map.on('zoomend', () => drawMarkers());

function boot(){
  buildChrome();
  autoCollapse();            // start out of the way on phones
  map.invalidateSize();      // fit must not run on a zero-size box
  render(true);
  userMoved = false;
  // A shut panel with nothing moving reads as a dead end, so draw the eye to
  // the one control that reopens it - a few pulses, then leave it alone.
  if (panel.classList.contains('collapsed')){
    chev.classList.add('attn');
    chev.addEventListener('animationend', () => chev.classList.remove('attn'), { once:true });
  }
}

// Deliberately not requestAnimationFrame: rAF is paused in a hidden or
// background tab, so a page opened into one would sit blank until focused -
// a very real case for a file arriving as an email attachment. setTimeout
// keeps running regardless of visibility. `started` keeps it idempotent.
let started = false;
function start(){
  if (started) return;
  started = true;
  boot();
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => setTimeout(start, 0));
} else {
  setTimeout(start, 0);
}
window.addEventListener('load', start);   // safety net

let resizeTimer;
function reflow(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    autoCollapse();
    map.invalidateSize();
    if (!userMoved) render(true);          // re-fit only an untouched map
  }, 180);
}
window.addEventListener('resize', reflow);

/* A tab that is hidden at load time has a zero-size map container, and
   fitBounds on a zero-size box collapses to maximum zoom. Watching the
   container itself catches the moment it gains real dimensions - whether from
   the tab being revealed, the window resizing, or the phone being rotated -
   and re-fits then. This is what makes the page correct when it is opened
   into a background tab rather than a focused one. */
if (window.ResizeObserver){
  let lastW = 0, lastH = 0;
  new ResizeObserver(entries => {
    const { width, height } = entries[0].contentRect;
    if (!width || !height) return;
    if (Math.abs(width - lastW) < 2 && Math.abs(height - lastH) < 2) return;
    lastW = width; lastH = height;
    reflow();
  }).observe(document.getElementById('map'));
}
</script>
</body>
</html>
