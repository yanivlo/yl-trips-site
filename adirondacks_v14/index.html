<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Adirondacks Long Weekend</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<!-- Leaflet.markercluster groups pins that sit too close together into one
     bubble, recomputed at every zoom. Only MarkerCluster.css is loaded (it
     positions the bubbles and drives the fan-out animation) - NOT
     MarkerCluster.Default.css, which is the plugin's stock blue-blob look.
     Every bubble here is built by pinClusterIcon() instead. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; font-family:'Inter', system-ui, sans-serif; }
  html, body { height:100%; width:100%; overflow:hidden; background:#0f172a; color:#f8fafc;
               -webkit-text-size-adjust:100%; }
  /* The map yields the right edge to the photo column on desktop. Set to 0
     by JS when a trip has no photos, so a photo-less map still fills the
     window exactly as it did before photos existed. */
  :root{ --photo-panel-width: 0px; }
  #map { position:absolute; top:0; bottom:0; left:0; right:var(--photo-panel-width);
         height:100%; background:#0f172a; }

  /* ---------- Floating control card ---------- */
  .panel{
    position:absolute; z-index:1000;
    top:max(14px, env(safe-area-inset-top)); left:14px;
    width:min(400px, calc(100vw - 28px));
    background:rgba(15,23,42,.94); backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.15); border-radius:14px;
    box-shadow:0 14px 32px -5px rgba(0,0,0,.65);
    display:flex; flex-direction:column;
    max-height:calc(100dvh - 28px);
    overflow:hidden;
  }
  .panel-head{
    display:flex; align-items:center; gap:10px; cursor:pointer;
    padding:14px 16px; user-select:none; flex:none;
  }
  .panel-head:hover .chev{ color:#e2e8f0; }
  .head-text{ flex:1; min-width:0; }
  .title{ font-size:1.05rem; font-weight:800; color:#38bdf8; line-height:1.25; }
  .subtitle{ font-size:.74rem; color:#94a3b8; margin-top:2px; line-height:1.35; }
  /* Wrap freely when open; stay on one line only when the card is shut. */
  .panel.collapsed .subtitle{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* A lone gray arrow character reads as decoration, not a control - this is
     a visible pill button so a shut panel doesn't look like a dead end. */
  .chev{ flex:none; display:flex; align-items:center; gap:5px;
         color:#7dd3fc; font-size:.66rem; font-weight:700; letter-spacing:.03em;
         text-transform:uppercase;
         background:rgba(56,189,248,.16); border:1px solid rgba(56,189,248,.45);
         border-radius:999px; padding:6px 11px 6px 13px;
         transition:background .15s ease, border-color .15s ease; }
  .panel-head:hover .chev{ background:rgba(56,189,248,.26); border-color:rgba(56,189,248,.7); }
  .chev-arrow{ display:inline-block; font-size:.8rem; transition:transform .22s ease; }
  .panel.collapsed .chev-arrow{ transform:rotate(-90deg); }
  @keyframes chevPulse{
    0%, 100% { box-shadow:0 0 0 0 rgba(56,189,248,.55); }
    50%      { box-shadow:0 0 0 7px rgba(56,189,248,0); }
  }
  .chev.attn{ animation:chevPulse 1.2s ease-out 3; }
  .panel-body{
    padding:0 16px 16px; overflow-y:auto; overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
  }
  .panel.collapsed .panel-body{ display:none; }

  /* Collapsed summary chips, so a shut panel still tells you something */
  .mini{ display:none; gap:6px; padding:0 16px 12px; flex-wrap:wrap; }
  .panel.collapsed .mini{ display:flex; }
  .mini span{ font-size:.68rem; font-weight:600; color:#cbd5e1;
              background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.1);
              border-radius:999px; padding:3px 9px; }

  /* ---------- Stats ---------- */
  .stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px;
          border-top:1px solid rgba(255,255,255,.08);
          border-bottom:1px solid rgba(255,255,255,.08);
          padding:10px 0; margin-bottom:12px; }
  .stat{ text-align:center; min-width:0; }
  .stat-val{ font-size:1.05rem; font-weight:700; color:#f1f5f9; line-height:1.15; }
  .stat-lbl{ font-size:.6rem; color:#64748b; text-transform:uppercase;
             letter-spacing:.05em; margin-top:2px; }

  /* ---------- Legend ---------- */
  .legend{ display:flex; flex-wrap:wrap; gap:9px; padding:8px 10px;
           background:rgba(255,255,255,.05); border-radius:8px;
           margin-bottom:12px; font-size:.7rem; color:#cbd5e1; }
  .legend-item{ display:flex; align-items:center; gap:6px; }
  .dot{ width:10px; height:10px; border-radius:50%; flex:none; }
  /* A miniature of the real pin, not a coloured dot: the map identifies a
     place by its GLYPH now, so a legend that showed only colour left the
     reader to guess which shape went with which word - and colour alone
     fails anyone who can't separate the hues. Same rotated-square teardrop
     as the map, shrunk, with the glyph held upright over it. */
  .legend-pin{ position:relative; width:19px; height:19px; flex:none;
               display:inline-block; vertical-align:-5px; }
  .legend-pin i{ position:absolute; inset:0; border-radius:50% 50% 50% 0;
                 transform:rotate(-45deg); box-sizing:border-box; }
  .legend-pin svg{ position:absolute; inset:0; margin:auto;
                   width:11px; height:11px; display:block; }
  .legend-pin.night i{ background:#2563eb; border:2px solid #bfdbfe; }
  .legend-pin.hike  i{ background:#059669; border:2px solid #bbf7d0; }
  .legend-pin.long  i{ background:#475569; border:2px solid #cbd5e1; }
  .legend-pin.photo i{ background:#9d174d; border:2px solid #f9a8d4; }
  /* The photo chip appears in the legend as itself, at map size - there is
     only one photo mark to explain now, so it gets one row. */
  .legend .photo-chip{ flex:none; }
  /* In a hover card the chip carries no count, just the camera. */
  .photo-chip.tip-chip{ padding:0 4px; vertical-align:-5px; }

  /* ---------- Hover card ---------- */
  /* A Leaflet tooltip rather than the browser's own `title`, so it can carry
     the same little pin the legend and map use instead of describing it in
     words. One line, always: the place, then how many photos, then what a
     click will do. */
  .leaflet-tooltip.pin-tip{ background:#0f172a; color:#e2e8f0;
                            border:1px solid rgba(255,255,255,.16);
                            border-radius:8px; padding:5px 9px;
                            font-size:.72rem; font-weight:600; white-space:nowrap;
                            box-shadow:0 5px 18px rgba(2,6,23,.6); }
  .leaflet-tooltip.pin-tip::before{ border-top-color:#0f172a; }
  .pin-tip .tip-photos{ color:#f9a8d4; }
  .pin-tip .tip-more,
  .pin-tip .tip-hint{ opacity:.6; font-weight:500; }
  .dash{ width:16px; height:0; border-top:2.5px dashed #000000; flex:none; }
  .dash-inferred{ border-top-color:#94a3b8; }

  .section-label{ font-size:.68rem; color:#94a3b8; font-weight:600;
                  text-transform:uppercase; letter-spacing:.05em; margin:0 0 6px; }

  /* ---------- Buttons ---------- */
  .btn-row{ display:flex; flex-wrap:wrap; gap:5px; margin-bottom:12px; }
  .btn{ background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1);
        color:#cbd5e1; padding:5px 9px; border-radius:7px; font-size:.7rem;
        cursor:pointer; transition:all .15s ease; font-weight:500;
        display:inline-flex; align-items:center; gap:5px; }
  .btn:hover{ background:rgba(255,255,255,.12); color:#f1f5f9; }
  .btn.active{ background:#0284c7; border-color:#38bdf8; color:#fff; font-weight:600; }
  .btn .swatch{ width:10px; height:10px; border-radius:3px; flex:none; }
  /* Same size as the day label beside it - no font-size of its own, so it
     inherits the button's. The distance is half of what a day chip says, not
     a footnote to it. Still dimmed, so the day label stays the thing you
     read first. */
  .btn .km{ opacity:.65; }

  /* A switch, not a row of buttons: the segments are butted together with a
     single shared border so they read as one control with a side selected.
     Used for the two settings that have a small fixed set of answers - the
     distance unit and the basemap. */
  .segmented{ gap:0; flex-wrap:nowrap; }
  .segmented .btn{ border-radius:0; padding:4px 12px; border-left:none;
                   white-space:nowrap; }
  .segmented .btn:first-child{ border-left:1px solid rgba(255,255,255,.1);
                               border-top-left-radius:7px;
                               border-bottom-left-radius:7px; }
  .segmented .btn:last-child{ border-top-right-radius:7px;
                              border-bottom-right-radius:7px; }

  /* One line at the top of the card for the two settings that govern the
     whole of it: whether photos are on the map, and what every distance is
     counted in. Sharing a line keeps the card short and puts the unit above
     the big numbers it changes. */
  .top-row{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .top-row .btn-row{ margin-bottom:0; }
  .top-row .unit-row{ margin-left:auto; }

  .toggle-note{ font-size:.66rem; color:#64748b; line-height:1.45; margin-top:-6px;
                margin-bottom:12px; }

  /* ---------- Map pins ---------- */
  .pin{ border-radius:20px; padding:3px 9px; font-size:.7rem; font-weight:700;
        white-space:nowrap; display:flex; align-items:center; gap:5px; cursor:pointer; }
  /* Long names must not run off a narrow screen; the full text is in the popup. */
  .pin .pin-name{ overflow:hidden; text-overflow:ellipsis; max-width:30vw;
                  display:inline-flex; align-items:center; gap:4px; }
  /* Same flat vector glyph as the compact badge, just shrunk - keeps the icon
     consistent across the zoom threshold instead of swapping to emoji. */
  .pin-name svg{ width:13px; height:13px; flex:none; }
  .pin-night{ background:#1e3a8a; border:2px solid #60a5fa; color:#eff6ff;
              box-shadow:0 4px 14px rgba(59,130,246,.4); }
  .pin-hike{ background:#022c22; border:2px solid #10b981; color:#ecfdf5;
             box-shadow:0 4px 14px rgba(16,185,129,.4); }
  .pin-long{ background:#334155; border:2px solid #94a3b8; color:#f1f5f9;
             box-shadow:0 4px 10px rgba(100,116,139,.35); }
  .badge{ padding:1px 6px; border-radius:9px; font-size:.62rem; font-weight:700; }
  .badge-night{ background:#1d4ed8; color:#dbeafe; }
  .badge-hike{ background:#047857; color:#d1fae5; }
  .badge-long{ background:#475569; color:#e2e8f0; }

  /* Zoom-dependent compact marker: icon only, no text, shown when zoomed out
     past ICON_ZOOM_THRESHOLD so it stays legible at trip-overview scale
     instead of shrinking into unreadable text. Flat single-color vector
     shapes rather than emoji - an emoji is a tiny detailed illustration and
     degrades to mush well before it's small enough to need this treatment.

     A "map pin" teardrop, not a plain circle, and each kind leans a
     different direction (night down-left, hike straight down, long
     down-right - see JS's COMPACT_ANCHOR for the exact tip position each
     produces). Two reasons: a photo-cluster pin is also a circle, so a
     same-shape stop pin at the same coordinate used to be visually and
     spatially indistinguishable from it - the teardrop's body sits beside/
     above the point instead of centered on it, while the photo pin stays
     centered, so the two no longer occupy the same clickable area. Leaning
     each kind a different way does the same, partially, for two DIFFERENT
     stop kinds landing on one exact coordinate (rarer, and only partially
     solved: all three still lean within 45 degrees either side of straight
     down to stay recognizable as pins, so their bodies share the same
     general "above the point" side).

     Built from a rotated rounded square (a well-known CSS-only pin shape -
     border-radius 50% on three corners, square on the fourth, then
     rotated) rather than a real teardrop SVG path, so the shape needs no
     new asset and the existing per-kind glyphs/colors carry over
     unchanged. The icon overlay is a SEPARATE, unrotated element centered
     on the square's own center, so the glyph itself always stays upright
     regardless of which way the teardrop leans. */
  .pin-compact-wrap{ position:relative; width:60px; height:60px; cursor:pointer; }
  .pin-compact{ position:absolute; left:11px; top:11px; width:38px; height:38px;
                border-radius:50% 50% 50% 0; box-sizing:border-box; }
  /* Border thinned from 4px to 3px and the coloured glow replaced with a
     plain drop shadow. The glow was the real source of visual noise: in a
     crowded area a dozen of them merged into one pink-and-blue smear that
     read as far busier than the pin count alone. A neutral shadow still
     lifts the pin off the map without tinting its surroundings. */
  .pin-compact.night{ background:#2563eb; border:3px solid #bfdbfe;
                       box-shadow:0 2px 5px rgba(15,23,42,.4);
                       transform:rotate(-15deg); }
  .pin-compact.hike{ background:#059669; border:3px solid #bbf7d0;
                      box-shadow:0 2px 5px rgba(15,23,42,.4);
                      transform:rotate(-45deg); }
  .pin-compact.long{ background:#475569; border:3px solid #cbd5e1;
                      box-shadow:0 2px 5px rgba(15,23,42,.4);
                      transform:rotate(-75deg); }
  /* Selected photo mark - the one whose photos the column is showing. */
  .pin-photo-mark.selected .photo-chip{ background:#9d174d; border-color:#fff;
                       box-shadow:0 0 0 3px rgba(244,114,182,.4),
                                  0 3px 10px rgba(15,23,42,.5); }
  /* The pin whose photos the column is currently showing. */
  .pin-compact.photo.selected{ background:#be185d; border-color:#fff;
                       box-shadow:0 0 0 3px rgba(244,114,182,.4),
                                  0 3px 10px rgba(15,23,42,.5); }
  .pin-compact-icon{ position:absolute; left:0; top:0; width:60px; height:60px;
                      display:flex; align-items:center; justify-content:center; }
  /* Deliberately NOT scaled with the teardrop: the glyph is the thing that
     says what kind of place this is, so it keeps its full size while the
     surrounding shape grew. */
  .pin-compact-icon svg{ width:26px; height:26px; display:block; }

  /* THE photo mark. One chip - camera plus a count - is the only thing on the
     whole map that ever means "photos", and it is the same element whether it
     is riding on a place pin or standing on its own.

     It used to be two different things: a bare number badge on a place pin,
     and a camera-glyph teardrop where there was no place. That taught the
     reader two encodings for one idea, and the camera pin said "photos" twice
     over - once with its glyph and again with the badge it also carried. */
  .photo-chip{ display:inline-flex; align-items:center; gap:3px; height:20px;
               padding:0 6px 0 4px; border-radius:10px; box-sizing:border-box;
               background:#be185d; border:2px solid #fce7f3; color:#fff;
               font-size:10px; font-weight:800; line-height:1;
               box-shadow:0 1px 4px rgba(15,23,42,.45); }
  .photo-chip svg{ width:11px; height:11px; display:block; }
  /* Riding on a place pin's shoulder. */
  .pin-compact-wrap .photo-chip{ position:absolute; top:0; right:-5px; }

  /* Standing alone, where photos exist but no stop was ever recorded. The
     stem and foot are what keep it a MAP MARK rather than a floating label -
     the foot is the spot, and it is what Leaflet anchors to. */
  .pin-photo-mark{ position:relative; width:64px; height:46px; cursor:pointer; }
  .pin-photo-mark .photo-chip{ position:absolute; left:50%; top:0;
                               transform:translateX(-50%); }
  .pin-photo-mark .stem{ position:absolute; left:50%; top:19px; width:2px; height:16px;
                         background:#be185d; transform:translateX(-50%); }
  .pin-photo-mark .foot{ position:absolute; left:50%; top:34px; width:8px; height:8px;
                         border-radius:50%; background:#be185d; border:2px solid #fce7f3;
                         box-sizing:border-box; transform:translateX(-50%); }

  /* ---- The shape language ----------------------------------------------
     EVERY pin is a teardrop. Nothing on the map is a circle, so there is one
     shape to learn and grouping never changes it.

     GLYPH says what the place is:
       house    slept here        mountain  walked here
       star     stopped a while   camera    only photos, nothing recorded

     MAGENTA BADGE is the only number anywhere on the map, and it always
     counts photos. Never two numbers on one pin.

     When pins merge, they merge SILENTLY - the survivor is whichever glyph
     ranks highest (see PIN_MERGE_PRIORITY), and no count is shown for the
     places folded in. Two hotels becoming one house pin is not information
     worth a number; the reader zooms in to separate them. Photos rank last
     and always disappear into a real place when one is near enough, which
     is why a house pin so often carries a photo count. */

  /* ---------- Photo column ---------- */
  /* Desktop: a permanent right-hand column beside the map. Mobile: the same
     markup promoted to a full-screen overlay (see the media query below). */
  .photo-panel{
    position:absolute; top:0; right:0; bottom:0; width:var(--photo-panel-width);
    z-index:1200; background:#0b1220; border-left:1px solid rgba(255,255,255,.12);
    display:flex; flex-direction:column; overflow:hidden;
  }
  .photo-panel[hidden]{ display:none; }

  /* Desktop-only drag handle, positioned from the viewport's right edge (not
     nested inside .photo-panel, which clips overflow - it would cut off
     everything this handle draws past the panel's own left border). Sits
     with its right edge 8px inside the panel and its left edge 24px out over
     the map, so the hit box fully contains the visible knob below - the
     whole knob is grabbable, not just a hairline border. Hidden together with
     the panel via the adjacent-sibling rule in the mobile query and below. */
  .panel-resize-handle{
    position:absolute; top:0; bottom:0;
    right:calc(var(--photo-panel-width) - 8px); width:32px; z-index:1300;
    cursor:col-resize; background:transparent;
  }
  #photoPanel[hidden] ~ .panel-resize-handle{ display:none; }
  /* The knob itself: a half-oval tab, flat where it meets the panel border
     (right edge, no radius) and rounded into a bulge on the map side (left
     edge, fully rounded) - like a tab growing out of the panel rather than a
     capsule floating over it. Solid (not translucent), visible at rest. */
  .resize-knob{
    position:absolute; top:50%; right:8px; transform:translateY(-50%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:7px;
    width:18px; height:60px;
    border-top-left-radius:999px; border-bottom-left-radius:999px;
    border-top-right-radius:0; border-bottom-right-radius:0;
    background:#0b1220; border:1px solid rgba(255,255,255,.12); border-right:none;
    box-shadow:0 3px 14px rgba(0,0,0,.55);
    pointer-events:none;
  }
  /* Same color as the border, not a standalone accent - the dots are a
     texture on the knob's own outline, not a separate colored feature. */
  .resize-knob span{ width:4px; height:4px; border-radius:50%;
                      background:rgba(255,255,255,.12); flex:none; }
  .panel-resize-handle:hover .resize-knob, .panel-resize-handle.dragging .resize-knob{
    background:#0284c7; border-color:#7dd3fc;
    box-shadow:0 3px 16px rgba(2,132,199,.65), 0 0 0 4px rgba(125,211,252,.25);
  }
  .panel-resize-handle:hover .resize-knob span, .panel-resize-handle.dragging .resize-knob span{
    background:#7dd3fc;
  }

  /* Mobile-only; the desktop column shows position via the "3 / 11" counter
     and the highlighted thumbnail instead. */
  .progress-track{ display:none; }
  .mobile-only{ display:none !important; }
  @media (max-width:767px), (max-height:500px){ .mobile-only{ display:flex !important; } }

  /* Takes whatever the lower block (place name + thumbnails) leaves behind.
     flex-basis 0, not auto: with auto the viewer asks for the photo's own
     full height - hundreds of pixels more than the panel has - and the two
     blocks then shrink against each other in proportion, which squeezed the
     thumbnails below their content height even when the panel had room to
     spare. With a zero basis the viewer claims nothing of its own and simply
     grows into the leftover, so the split is decided by the block below.

     This line and the flex-shrink:0 on .photo-panel-lower are one fix, not
     two: reverting either alone changes nothing, and reverting both brings
     the bug straight back (measured - 157px of a 277px strip shown, in a
     panel where the block was at 31% of its own 50% ceiling). Change them
     together or not at all. viz/test_trip_map_page.py measures this. */
  .viewer{ position:relative; flex:1 1 0; min-height:0; background:#060b14;
           display:flex; align-items:center; justify-content:center; overflow:hidden; }
  /* Default to contain (letterboxed, nothing cropped) - updateImageFit() in
     the script below switches this to cover (full bleed) only when the photo
     and the viewer box are nearly the same shape, so no photo ever loses more
     than a sliver of itself to the crop. */
  .viewer img{ width:100%; height:100%; object-fit:contain; display:block; }
  .viewer-empty{ color:#475569; font-size:.78rem; padding:20px; text-align:center; }
  .viewer-count{ position:absolute; top:10px; left:12px; z-index:2;
                 background:rgba(2,6,23,.72); color:#e2e8f0; font-size:.68rem;
                 font-weight:700; padding:3px 9px; border-radius:20px; }
  /* A scrim, not just a text-shadow: the caption sits on whatever the photo
     happens to be, and shadowed grey on a bright busy image is unreadable. */
  .viewer-caption{ position:absolute; bottom:0; left:0; right:0; z-index:2;
                   padding:18px 12px 8px;
                   background:linear-gradient(transparent, rgba(2,6,23,.85));
                   font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
                   font-size:.66rem; color:#cbd5e1;
                   overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .viewer-nav{ position:absolute; top:10px; right:12px; z-index:2; display:flex; gap:8px; }
  .viewer-nav button, .place-nav button{
    background:rgba(2,6,23,.72); color:#e2e8f0; border:1px solid rgba(255,255,255,.16);
    border-radius:8px; width:38px; height:38px; cursor:pointer; font-size:1.1rem;
    display:flex; align-items:center; justify-content:center; }
  .viewer-nav button:hover, .place-nav button:hover{ background:#1e293b; }
  .viewer-nav button:disabled, .place-nav button:disabled{ opacity:.3; cursor:default; }

  /* One-time overlay teaching the swipe gestures, shown over the photo the
     first time the mobile viewer opens (see maybeShowGestureHint). Sits above
     the caption/nav (z-index 2) so it fully covers the photo while shown. */
  .gesture-hint{ position:absolute; inset:0; z-index:3; display:flex;
                 align-items:center; justify-content:center; text-align:center;
                 padding:24px; background:rgba(2,6,23,.78);
                 color:#f1f5f9; font-size:.8rem; line-height:1.7; }
  .gesture-hint[hidden]{ display:none; }

  /* Sizes to its own content (place name + however many thumbnail rows fit)
     rather than claiming a fixed share of the panel, so the viewer above
     gets whatever's left over - but caps at half the panel's height for a
     place with a lot of photos, so the thumbnail strip alone never crowds
     the photo out. Shrinking is off, so the only thing that can hold this
     block below the height its rows need is that 50% ceiling - never the
     photo above competing for the same pixels. Paired with the flex-basis:0
     on .viewer above - see the note there before changing either. */
  .photo-panel-lower{ display:flex; flex-direction:column; flex:0 0 auto;
                       max-height:50%; min-height:0; overflow:hidden; }
  .place-head{ flex:none; padding:12px 14px 10px; border-bottom:1px solid rgba(255,255,255,.08); }
  .place-head-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .place-name{ font-size:1.25rem; font-weight:800; color:#f8fafc;
               overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .place-sub{ font-size:.85rem; color:#94a3b8; margin-top:4px; }
  .place-nav{ display:flex; gap:6px; flex:none; }

  /* align-content:start matters here: this grid's implicit rows default to
     'auto' sizing, and a plain grid container taller than its content
     stretches 'auto' rows equally to fill that height (align-content:normal
     computes to stretch for a grid) - without this, each row of thumbnails
     ends up padded with a lot of extra vertical space instead of packing
     tightly against the row above it. */
  .thumb-grid{ flex:1; min-height:0; overflow-y:auto; padding:10px 14px 16px;
               display:grid; grid-template-columns:repeat(auto-fill, minmax(76px, 1fr));
               align-content:start; gap:6px; }
  .thumb-grid img{ width:100%; aspect-ratio:1; object-fit:cover; border-radius:6px;
                   border:2px solid transparent; cursor:pointer; display:block;
                   background:#111c30; }
  .thumb-grid img.current{ border-color:#f472b6; }

  /* "5 of 5 places in view" - the column follows the map, so this says how
     much of the trip the current viewport is actually offering. */
  .in-view-chip{ position:absolute; left:14px; bottom:14px; z-index:1000;
                 background:rgba(15,23,42,.9); border:1px solid rgba(255,255,255,.14);
                 color:#94a3b8; font-size:.68rem; padding:6px 11px; border-radius:20px; }
  .in-view-chip[hidden]{ display:none; }

  /* ---------- Popups ---------- */
  .leaflet-popup-content-wrapper{ background:#1e293b; color:#f8fafc; border-radius:10px;
      box-shadow:0 12px 24px rgba(0,0,0,.5); border:1px solid rgba(255,255,255,.12); }
  .leaflet-popup-content{ margin:12px 14px; font-size:.78rem; line-height:1.5; }
  .leaflet-popup-tip{ background:#1e293b; }
  .leaflet-popup-close-button{ color:#94a3b8 !important; }
  .pop-title{ font-weight:800; font-size:.92rem; margin-bottom:4px; }
  .pop-night{ color:#60a5fa; } .pop-hike{ color:#34d399; }
  .pop-long{ color:#94a3b8; }  .pop-plain{ color:#38bdf8; }
  .pop-photo{ color:#f472b6; }
  .pop-badge{ display:inline-block; padding:2px 7px; border-radius:5px; font-size:.66rem;
              font-weight:700; margin-bottom:7px; }
  .pop-sub{ color:#94a3b8; font-size:.72rem; margin-bottom:6px; }
  .pop-row{ font-size:.74rem; color:#cbd5e1; }
  .pop-desc{ font-size:.73rem; color:#cbd5e1; border-top:1px solid rgba(255,255,255,.08);
             padding-top:7px; margin-top:7px; }
  .pop-link{ color:#38bdf8; text-decoration:none; font-weight:600;
             display:inline-block; margin-top:5px; }
  .pop-warn{ color:#fca5a5; font-size:.68rem; margin-top:5px; }
  .prov{ color:#475569; font-size:.64rem; margin-top:6px; font-style:italic; }

  .leaflet-control-attribution{ background:rgba(15,23,42,.82) !important; color:#64748b !important;
      font-size:.62rem !important; }
  .leaflet-control-attribution a{ color:#94a3b8 !important; }

  /* ---------- Road-reconstruction notice ---------- */
  /* Shown only when viz/snap_route_gaps.py couldn't reach OSRM (or found no
     route) for at least one recording gap, so it fell back to the straight
     line between the gap's two endpoints - the exact behaviour this banner
     exists to make visible rather than silently indistinguishable from a
     genuine road-routed dashed segment. */
  .gap-banner{
    display:none; position:absolute; z-index:1000;
    bottom:max(14px, env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    max-width:min(560px, calc(100vw - 28px));
    background:rgba(120,53,15,.92); backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(251,191,36,.5); border-radius:10px;
    padding:9px 14px; font-size:.74rem; line-height:1.4; color:#fef3c7;
    box-shadow:0 10px 24px -6px rgba(0,0,0,.55); text-align:center;
  }
  .gap-banner.show{ display:block; }
  .gap-banner b{ color:#fde68a; }

  /* ---------- Mobile ---------- */
  /* Height as well as width: a phone turned landscape is ~812x375, which is
     "wide" by any width-only test but has nowhere near the vertical room for
     a side-by-side column. Rotating to see a landscape photo bigger is the
     whole point of the full-screen viewer, so it has to survive the turn. */
  @media (max-width:767px), (max-height:500px){
    /* The map keeps the whole window; the photo column stops being a column
       and becomes a full-screen overlay opened by tapping a pin. */
    #map{ right:0; }
    .panel-resize-handle{ display:none; }
    .photo-panel{
      width:100%; border-left:none; z-index:1400;
      /* dvh, not vh: on iOS Safari `vh` is the tallest-possible viewport, so
         a 100vh overlay hides its own bottom controls behind the address bar
         until the reader scrolls. dvh tracks the bar as it shows and hides. */
      height:100dvh;
      padding-top:env(safe-area-inset-top);
      padding-bottom:env(safe-area-inset-bottom);
    }
    /* No .viewer override here: the base rule already gives it everything
       the fixed chrome leaves behind, portrait or landscape, which is what
       makes rotating the phone worth doing. It used to repeat that rule with
       flex-basis:auto, which is the very thing that made the photo and the
       thumbnails fight each other for height. */

    /* No max-height of its own here any more. It used to be capped at 22vh,
       which on a tall phone is about two rows - so a place with a dozen
       photos scrolled even though the panel had plenty of unused height.
       The strip now grows to fit its rows and is limited only by the 50%
       ceiling on the block around it, so on a tall screen it usually needs
       no scrolling at all. */
    .thumb-grid{ grid-template-columns:repeat(auto-fill, minmax(64px, 1fr)); }
    .in-view-chip{ display:none; }

    /* Maximized: hide everything but the photo itself (and its overlaid nav/
       caption), so the flex:1 viewer above takes the whole panel height. */
    .photo-panel.maximized .place-head,
    .photo-panel.maximized .thumb-grid,
    .photo-panel.maximized .progress-track{ display:none; }

    /* Story-style segmented progress: one bar per photo in this place, so
       position within the batch is readable without counting thumbnails. */
    .progress-track{ display:flex; gap:3px; padding:8px 12px 4px; }
    .progress-seg{ flex:1; height:3px; border-radius:2px; background:rgba(255,255,255,.22); }
    .progress-seg.done{ background:#f472b6; }

    .panel{ left:10px; width:calc(100vw - 20px); top:max(10px, env(safe-area-inset-top)); }
    .panel-head{ padding:11px 13px; }
    .title{ font-size:.95rem; }
    .panel-body{ padding:0 13px 13px; }
    .mini{ padding:0 13px 10px; }
    .stat-val{ font-size:.95rem; }
    .btn{ padding:6px 10px; font-size:.72rem; }   /* larger touch targets */
    .segmented .btn{ padding:6px 10px; }          /* ...the segments too */
    .pin{ font-size:.66rem; padding:2px 7px; }
    .pin .pin-name{ max-width:44vw; }
    .gap-banner{ font-size:.7rem; padding:8px 12px; }
  }

  /* A phone held sideways has only ~375px of height in total. Letting the
     place name and thumbnails take half of that would leave the photo a
     slit - and seeing the photo bigger is the entire reason for turning the
     phone. So the lower block gets a smaller share when there is little
     height to share, and the thumbnails scroll instead. The 50% above still
     applies everywhere with real vertical room. */
  @media (max-height:500px){
    .photo-panel-lower{ max-height:38%; }
  }
</style>
</head>

<div class="panel" id="panel">
  <div class="panel-head" id="panelHead" role="button" tabindex="0"
       aria-expanded="true" aria-controls="panelBody">
    <div class="head-text">
      <div class="title" id="tripTitle"></div>
      <div class="subtitle" id="tripSubtitle"></div>
    </div>
    <div class="chev" id="chev">
      <span id="chevLabel">Details</span><span class="chev-arrow">▾</span>
    </div>
  </div>

  <div class="mini" id="miniStats"></div>

  <div class="panel-body" id="panelBody">
    <!-- First thing in the card: the two settings that govern all of it. The
         unit sits above the big numbers it changes, so it is settable without
         hunting for it, and sharing this line with the photo switch keeps two
         labelled sections out of the card entirely. -->
    <div class="top-row">
      <div class="btn-row" id="photoToggle"></div>
      <div class="btn-row segmented unit-row" id="unitToggle"></div>
    </div>

    <div class="stats" id="statsGrid"></div>
    <div class="legend" id="legend"></div>

    <div class="section-label">Filter by day</div>
    <div class="btn-row" id="dayFilter"></div>

    <div class="section-label">Likely hikes</div>
    <div class="btn-row segmented" id="hikeToggle"></div>
    <div class="toggle-note" id="hikeNote"></div>

    <div class="section-label">Basemap</div>
    <div class="btn-row segmented" id="baseToggle"></div>
  </div>
</div>

<div id="map"></div>

<div class="in-view-chip" id="inViewChip" hidden></div>

<!-- Present only when the trip was built with --photo-dir; JS leaves it
     hidden and the map full-width otherwise, so a photo-less map is exactly
     the single self-contained file it was before photos existed. -->
<aside class="photo-panel" id="photoPanel" hidden>
  <div class="progress-track" id="progressTrack"></div>

  <div class="viewer" id="viewer">
    <div class="viewer-count" id="viewerCount"></div>
    <div class="viewer-nav">
      <button id="prevPhoto" type="button" title="Previous photo (left arrow)">‹</button>
      <button id="nextPhoto" type="button" title="Next photo (right arrow)">›</button>
      <button id="maximizeToggle" type="button" class="mobile-only" title="Maximize photo">⤢</button>
      <button id="closeViewer" type="button" title="Close photo panel">✕</button>
    </div>
    <img id="viewerImage" alt="">
    <div class="viewer-caption" id="viewerCaption"></div>
    <div class="gesture-hint" id="gestureHint" hidden>
      <div>⟵ ⟶&nbsp; swipe sideways for the next photo<br>
           ⇧&nbsp;swipe up for the next place<br>
           Tap the photo to maximize it<br>
           <span style="opacity:.7">(tap anywhere to dismiss)</span></div>
    </div>
  </div>

  <div class="photo-panel-lower">
    <div class="place-head">
      <div class="place-head-row">
        <div class="place-name" id="placeName"></div>
        <div class="place-nav">
          <button id="prevPlace" type="button" title="Previous place">↑</button>
          <button id="nextPlace" type="button" title="Next place">↓</button>
        </div>
      </div>
      <div class="place-sub" id="placeSub"></div>
    </div>

    <div class="thumb-grid" id="thumbGrid"></div>
  </div>
</aside>

<!-- A sibling of the panel, not a child - the panel has overflow:hidden (it
     clips long captions/thumbnails), which would clip this handle wherever it
     protrudes past the panel's own left edge. Hidden together with the panel
     via the adjacent-sibling rule below instead of relying on markup nesting. -->
<div class="panel-resize-handle" id="panelResizeHandle" title="Drag to resize, double-click to maximize">
  <div class="resize-knob" aria-hidden="true">
    <span></span><span></span><span></span>
  </div>
</div>

<div class="gap-banner" id="gapBanner"></div>
