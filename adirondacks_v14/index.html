/* ------------------------------------------------------------------ utils */
const M = TRIP.meta || {};
const S = TRIP.stats || {};
// Changed at runtime by the "Distance units" buttons, so these are let, not
// const. The starting value is whatever the page was built with: extract_trip.py
// takes --units and defaults it to km, so a trip built normally opens in km.
// Every distance on the page goes through dist()/distUnit, which is what makes
// one variable enough to switch the whole page over.
let IMPERIAL = M.units === 'mi';
let distUnit = IMPERIAL ? 'mi' : 'km';
const dist = km => IMPERIAL ? (km * 0.621371) : km;
const fmtDist = km => {
  const v = dist(km);
  return (v >= 100 ? Math.round(v) : v.toFixed(1)).toLocaleString();
};
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gmaps = (lat, lng) =>
  `<a class="pin-link pop-link" target="_blank" rel="noopener"
      href="https://www.google.com/maps?q=${lat},${lng}">📍 Open in Google Maps ↗</a>`;

const nameOf = o => o.label || o.db_name || o.place_name || 'Unnamed stop';
const dayColor = d => (TRIP.days.find(x => x.date === d) || {}).color || '#38bdf8';

/* ------------------------------------------------------------------- map */
const map = L.map('map', { zoomControl:false, preferCanvas:true }).setView([43, -74], 7);

// Draw order for map pins, LOWEST first: a pin type listed later always
// covers one listed earlier at the same coordinate, regardless of latitude.
// Before panes existed, Leaflet's default was "whichever marker is further
// south wins" (its z-index is literally the marker's screen y), which
// silently flipped between rebuilds whenever a photo cluster's centroid
// moved. Reorder this array to change the priority; nothing else reads it.
const PIN_DRAW_ORDER = ['photo', 'long', 'hike', 'night'];
// Leaflet's own markerPane is z-index 600 and popupPane 700, so these sit
// strictly between the two - every pin still draws under an open popup.
PIN_DRAW_ORDER.forEach((kind, index) => {
  map.createPane(`pins-${kind}`).style.zIndex = 601 + index;
});

L.control.zoom({ position:'bottomright' }).addTo(map);
// Kept in a variable because L.control.scale fixes its units at construction:
// switching to miles means removing this control and adding a new one, not
// changing an option on it.
let scaleControl = L.control.scale(
  { position:'bottomleft', imperial:IMPERIAL, metric:!IMPERIAL }).addTo(map);

/* Basemaps must work from a file:// page with no Referer, because that is how
   a shared copy gets opened out of an email attachment. CARTO's Voyager tiles
   (used by the design this page follows) fail that test - without an API key
   they come back stamped "API KEY REQUIRED", at 1x as well as @2x - so the
   look is reproduced with key-free providers instead. */
const BASEMAPS = {
  Map: L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:'&copy; OpenStreetMap contributors', maxZoom:19 }),
  Muted: L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
    attribution:'Tiles &copy; Esri, HERE, Garmin, &copy; OpenStreetMap contributors',
    maxZoom:16 }),
  Terrain: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
    attribution:'&copy; OpenStreetMap contributors, SRTM | &copy; OpenTopoMap (CC-BY-SA)',
    maxZoom:17 }),
  Satellite: L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution:'Imagery &copy; Esri, Maxar, Earthstar Geographics', maxZoom:19 })
};
let activeBase = BASEMAPS.Map.addTo(map);

const routeLayer   = L.layerGroup().addTo(map);
const walkLayer    = L.layerGroup().addTo(map);
// Short-stop dots only. They are circleMarkers (vector shapes), which
// Leaflet.markercluster does not group - it handles markers alone. That is
// fine: they are small, low-contrast, and were never the crowding problem.
const markerLayer  = L.layerGroup().addTo(map);

// How close two pins must get, ON SCREEN, before they collapse into one
// bubble. Pixels, not metres, which is the whole point: crowding is a
// screen-space problem, so the fixed 300m clustering done at build time by
// viz/attach_photos.py cannot address it. At whole-trip scale that 300m is
// about a THIRD OF ONE PIXEL - measured - so it never merged anything the
// reader could see. This number does, and it is re-evaluated at every zoom.
const PIN_CLUSTER_RADIUS_PIXELS = 64;
// Zoom at which grouping stops entirely and every pin is drawn on its own.
// Chosen well past the point where pins stop colliding (at "one town" scale
// 54 of 84 pins still overlapped; by a few streets it is 28) so that zooming
// in always ends at real pins rather than a bubble that will not open.
const PIN_CLUSTER_OFF_AT_ZOOM = 14;

// Which glyph survives when pins merge, most important first. A night beats
// a hike beats a long stop, and photos always lose: a camera pin only ever
// appears where there is no recorded place to attach it to. That last rule
// is what stops the map showing a photo pin sitting beside the hotel whose
// photos it holds - they become one house pin wearing a photo count.
const PIN_MERGE_PRIORITY = ['night', 'hike', 'long', 'photo'];

// Everything shares ONE group. Two groups would each tidy themselves and
// then collide with each other, which is the whole bug being fixed.
const pinLayer = L.markerClusterGroup({
  maxClusterRadius: PIN_CLUSTER_RADIUS_PIXELS,
  disableClusteringAtZoom: PIN_CLUSTER_OFF_AT_ZOOM,
  iconCreateFunction: pinClusterIcon,
  showCoverageOnHover: false,   // the stock hover polygon fights the route lines
  spiderfyOnMaxZoom: true,      // pins on one exact spot fan out instead of hiding
  // Off. A click on a merged pin used to throw the whole map away and zoom -
  // see the clusterclick handler below for what happens instead.
  zoomToBoundsOnClick: false
}).addTo(map);

/* Clicking a merged pin fans its pins out where they are, at the zoom the
   reader chose, so the next click can land on the one they actually wanted -
   a photo group opens the photo column, a place opens its card. Zooming to do
   the same job moved the map out from under them to answer "what is under
   here", which is the jarring part; the zoom control is still there for
   anyone who wants a closer look, it is just no longer forced on them.

   Idempotent, so it is safe alongside the plugin's own spiderfy at max zoom:
   spiderfy() returns immediately if this cluster is already fanned out. */
pinLayer.on('clusterclick', event => event.layer.spiderfy());

// Rebuilt wholesale by drawMarkers()/drawPhotoClusters(). Kept apart because
// those two run independently - the day filter redraws stops, the photo
// toggle and panel selection redraw photos - and neither may wipe the other.
let stopPinMarkers = [];
let photoPinMarkers = [];

function refreshPinLayer(){
  pinLayer.clearLayers();
  // addLayers (plural) is the plugin's bulk path: it clusters once for the
  // whole batch instead of re-clustering on every single insertion.
  pinLayer.addLayers(stopPinMarkers.concat(photoPinMarkers));
}

/* The markup for one teardrop, shared by every pin on the map: a lone stop,
   a lone photo group, and a merged pin all use this, so they cannot drift
   apart visually. `photoCount` of 0 means no badge at all. */
// The one photo mark, used in both places it can appear.
function photoChipHTML(count){
  return `<span class="photo-chip">${COMPACT_ICONS.photo}${count}</span>`;
}

function teardropHTML(kind, photoCount, extraClass){
  return `<div class="pin-compact-wrap">
            <div class="pin-compact ${kind}${extraClass ? ' ' + extraClass : ''}"></div>
            <div class="pin-compact-icon">${COMPACT_ICONS[kind]}</div>
            ${photoCount ? photoChipHTML(photoCount) : ''}
          </div>`;
}

function teardropIcon(kind, photoCount, extraClass){
  const box = (PIN_GEOMETRY[kind] || PIN_GEOMETRY.long).box;
  return L.divIcon({
    className:'', html: teardropHTML(kind, photoCount, extraClass),
    iconSize:[box, box], iconAnchor:COMPACT_ANCHOR[kind]
  });
}

/* Photos with no recorded place to ride on: the same chip, on a stem, with a
   foot marking the spot. Deliberately lighter than any place pin - at trip
   scale "someone photographed something here" is true almost everywhere and
   earns less ink than "we slept here". */
const PHOTO_MARK_BOX = [64, 46];
const PHOTO_MARK_ANCHOR = [32, 38];   // the foot's centre

function photoMarkIcon(count, extraClass){
  return L.divIcon({
    className:'',
    html:`<div class="pin-photo-mark${extraClass ? ' ' + extraClass : ''}">
            ${photoChipHTML(count)}<div class="stem"></div><div class="foot"></div>
          </div>`,
    iconSize:PHOTO_MARK_BOX, iconAnchor:PHOTO_MARK_ANCHOR
  });
}

/* Tooltips sit above the pin's TIP, which is where Leaflet anchors them, so
   they need lifting clear of the body that stands above it - by nearly the
   whole icon box for a full-size pin, less for a small one. */
function tooltipOptions(kind){
  // The photo mark is shorter than a teardrop, so its card needs less lift.
  const height = kind === 'photo' ? PHOTO_MARK_ANCHOR[1]
                                  : (PIN_GEOMETRY[kind] || PIN_GEOMETRY.long).box - 12;
  return { direction:'top', className:'pin-tip', opacity:1, offset:[0, -height] };
}

// Full state names eat most of a one-line hover card ("Newport, Oregon
// (Stay)"), so they are abbreviated. US-only on purpose - this project's
// data is US - and anything not on the list passes through untouched rather
// than being mangled by a cleverer rule.
const STATE_ABBREVIATIONS = Object.fromEntries(
  ('Alabama:AL,Alaska:AK,Arizona:AZ,Arkansas:AR,California:CA,Colorado:CO,' +
   'Connecticut:CT,Delaware:DE,Florida:FL,Georgia:GA,Hawaii:HI,Idaho:ID,' +
   'Illinois:IL,Indiana:IN,Iowa:IA,Kansas:KS,Kentucky:KY,Louisiana:LA,' +
   'Maine:ME,Maryland:MD,Massachusetts:MA,Michigan:MI,Minnesota:MN,' +
   'Mississippi:MS,Missouri:MO,Montana:MT,Nebraska:NE,Nevada:NV,' +
   'New Hampshire:NH,New Jersey:NJ,New Mexico:NM,New York:NY,' +
   'North Carolina:NC,North Dakota:ND,Ohio:OH,Oklahoma:OK,Oregon:OR,' +
   'Pennsylvania:PA,Rhode Island:RI,South Carolina:SC,South Dakota:SD,' +
   'Tennessee:TN,Texas:TX,Utah:UT,Vermont:VT,Virginia:VA,Washington:WA,' +
   'West Virginia:WV,Wisconsin:WI,Wyoming:WY,District of Columbia:DC'
  ).split(',').map(pair => pair.split(':')));

const TOOLTIP_NAME_MAX_CHARS = 34;

/* "Newport, Oregon, United States (Stay)" -> "Newport, OR (Stay)".
   Keeps the first two comma-separated parts, abbreviates a part that is
   exactly a state name, and preserves a trailing "(Stay)"/"(Hike)" marker,
   which says what KIND of visit this was and is the last thing worth
   dropping. */
function shortPlaceName(name){
  const raw = String(name || '').trim();
  const suffix = raw.match(/\s*(\([^)]*\))\s*$/);
  const body = suffix ? raw.slice(0, suffix.index) : raw;
  const parts = body.split(',').map(part => part.trim()).filter(Boolean)
    .map(part => STATE_ABBREVIATIONS[part] || part);
  let short = parts.slice(0, 2).join(', ');
  if (short.length > TOOLTIP_NAME_MAX_CHARS) {
    short = short.slice(0, TOOLTIP_NAME_MAX_CHARS - 1).trimEnd() + '…';
  }
  return short + (suffix ? ' ' + suffix[1] : '');
}

// The same little pin the legend uses, so the card names the kind with the
// symbol the reader already met rather than repeating it in words.
function tooltipPin(kind){
  // Photos are shown as the chip, because that is what they look like on the
  // map now - there is no photo teardrop to echo.
  if (kind === 'photo') return `<span class="photo-chip tip-chip">${COMPACT_ICONS.photo}</span>`;
  return `<span class="legend-pin ${kind}"><i></i>${COMPACT_ICONS[kind]}</span>`;
}

/* One line: what this is, how many photos, and what clicking does. */
function pinTooltipHTML(kind, name, extraPlaces, photoCount, hint){
  const photoWord = `${photoCount} photo${photoCount === 1 ? '' : 's'}`;
  const bits = [tooltipPin(kind)];
  bits.push(name ? esc(shortPlaceName(name)) : photoWord);
  if (extraPlaces > 0) bits.push(`<span class="tip-more">+${extraPlaces} more</span>`);
  const tail = [];
  // Skipped when the name IS the photo count, so it is never said twice.
  if (photoCount && name) tail.push(`<span class="tip-photos">${photoWord}</span>`);
  if (hint) tail.push(`<span class="tip-hint">${esc(hint)}</span>`);
  return bits.join(' ') + (tail.length ? ' · ' + tail.join(' · ') : '');
}

/* What several merged pins look like: still one teardrop, wearing the glyph
   of whichever kind ranked highest, plus the photo count if any photos went
   into it. No count for the merged PLACES - see the shape-language note in
   the CSS for why silently is the right way to merge them. */
function pinClusterIcon(cluster){
  const byKind = {};
  let photoCount = 0, placeCount = 0;
  cluster.getAllChildMarkers().forEach(marker => {
    const kind = (marker.options.pane || '').replace('pins-', '');
    (byKind[kind] = byKind[kind] || []).push(marker);
    photoCount += marker.photoCount || 0;
    if (kind !== 'photo') placeCount++;
  });
  const winner = PIN_MERGE_PRIORITY.find(kind => byKind[kind]) || 'long';
  // The card names the leading place rather than counting anonymously:
  // "Newport, OR (Stay) +1 more" says more than "2 places".
  const lead = byKind[winner][0];
  cluster.pinTooltip = pinTooltipHTML(
    winner, lead.placeName || '', Math.max(0, placeCount - 1), photoCount,
    'click to separate');
  cluster.pinKind = winner;
  // Photos-only merges get the standing chip; anything with a real place
  // keeps that place's teardrop and wears the chip on its shoulder.
  return winner === 'photo'
    ? photoMarkIcon(photoCount)
    : teardropIcon(winner, photoCount);
}

/* Cluster icons are made and destroyed by the plugin as the reader zooms, so
   their tooltips are bound on first hover rather than up front. */
pinLayer.on('clustermouseover', event => {
  const cluster = event.layer;
  if (!cluster.getTooltip()) {
    cluster.bindTooltip(cluster.pinTooltip || '', tooltipOptions(cluster.pinKind));
  }
  cluster.openTooltip();
});

let currentDay     = 'all';
// 'naive' (every stop of at least min_stop_hours) | 'smart' (only those with a
// walking segment recorded beside them). The page opens on the wider rule and
// offers the stricter one, so nothing is hidden before the reader asks for it.
let hikeRule       = 'naive';
let photosVisible  = true;
// Whether the desktop column is currently expanded. Separate from
// photosVisible (pins are drawn as soon as photosVisible is true) - the
// column itself starts collapsed until the reader opens it, same as the
// mobile overlay starts closed until a pin is tapped.
let desktopPanelOpen = false;

/* --------------------------------------------------------------- rendering */
function visibleDays(){
  return currentDay === 'all' ? TRIP.days : TRIP.days.filter(d => d.date === currentDay);
}
function isHike(stop){
  return hikeRule === 'smart' ? !!stop.hike_smart : !!stop.hike_naive;
}

function drawRoute(){
  routeLayer.clearLayers();
  const bounds = [];
  visibleDays().forEach(day => {
    day.segments.forEach(seg => {
      const latlngs = seg.map(p => [p[0], p[1]]);
      // Dark casing underneath keeps bright day colours legible on any basemap.
      L.polyline(latlngs, { color:'#0f172a', weight:7, opacity:.35,
                            lineJoin:'round', lineCap:'round' }).addTo(routeLayer);
      L.polyline(latlngs, { color:day.color, weight:4, opacity:.95,
                            lineJoin:'round', lineCap:'round' })
        .addTo(routeLayer)
        .bindPopup(`<div class="pop-title pop-plain">${esc(day.label)}</div>
                    <div class="pop-row">${fmtDist(day.distance_km)} ${distUnit} travelled</div>`);
      latlngs.forEach(p => bounds.push(p));
    });

    // Recorded track with no car or bus journey behind it: a ski lift, a
    // subway ride, a walk round a viewpoint. Drawn as the same black track as
    // a hike, because the one thing it must not look like is a drive - the
    // day-coloured road line would put a road up a mountainside.
    (day.not_driven_segments || []).forEach(seg => {
      const latlngs = seg.map(p => [p[0], p[1]]);
      L.polyline(latlngs, { color:'#0f172a', weight:8, opacity:.4 }).addTo(routeLayer);
      L.polyline(latlngs, { color:'#000000', weight:4, opacity:1, dashArray:'8,4,2,4',
                            lineCap:'round' })
        .addTo(routeLayer)
        .bindPopup(`<div class="pop-title pop-plain">${esc(day.label)}</div>
                    <div class="pop-row">No drive was recorded here</div>
                    <div class="pop-desc">Movement the phone recorded while no car
                      or bus journey was logged — on foot, on a lift, on the water
                      or underground. The line is where you were, not a road.</div>`);
      latlngs.forEach(p => bounds.push(p));
    });

    // Stretches the phone never recorded, rebuilt over the real road network
    // (viz/snap_route_gaps.py). Dashed, and thinner than the recorded track,
    // so a reconstructed road is never mistaken for a GPS trace.
    (day.inferred_segments || []).forEach(seg => {
      const latlngs = seg.points.map(p => [p[0], p[1]]);
      L.polyline(latlngs, { color:'#0f172a', weight:6, opacity:.3,
                            lineJoin:'round', lineCap:'round' }).addTo(routeLayer);
      L.polyline(latlngs, { color:day.color, weight:3, opacity:.9, dashArray:'6,7',
                            lineJoin:'round', lineCap:'round' })
        .addTo(routeLayer)
        .bindPopup(`<div class="pop-title pop-plain">${esc(day.label)}</div>
                    <div class="pop-row">No GPS recorded here</div>
                    <div class="pop-row">${seg.is_routed
                      ? `${fmtDist(seg.road_km)} ${distUnit} along roads (reconstructed)`
                      : `${fmtDist(seg.straight_km)} ${distUnit} straight line - no route found`}</div>`);
      latlngs.forEach(p => bounds.push(p));
    });
  });
  return bounds;
}

function drawFlights(){
  // Air legs get a dashed great-circle arc so a flight never looks like a road.
  (TRIP.flights || []).forEach(f => {
    if (currentDay !== 'all' && f.local_date !== currentDay) return;
    const arc = greatCircle([f.from_lat, f.from_lng], [f.to_lat, f.to_lng]);
    L.polyline(arc, { color:'#38bdf8', weight:2.5, opacity:.9, dashArray:'8,7' })
      .addTo(routeLayer)
      .bindPopup(`<div class="pop-title pop-plain">✈️ ${esc(f.from_name)} → ${esc(f.to_name)}</div>
                  <div class="pop-row">${esc(f.start_label)} → ${esc(f.end_label)}</div>
                  <div class="pop-row">${fmtDist(f.km)} ${distUnit}</div>`);
  });
}
function greatCircle(a, b, n = 64){
  const [φ1, λ1] = [a[0]*Math.PI/180, a[1]*Math.PI/180];
  const [φ2, λ2] = [b[0]*Math.PI/180, b[1]*Math.PI/180];
  const d = 2*Math.asin(Math.sqrt(Math.sin((φ2-φ1)/2)**2 +
            Math.cos(φ1)*Math.cos(φ2)*Math.sin((λ2-λ1)/2)**2));
  if (!d) return [a, b];
  const out = [];
  for (let i = 0; i <= n; i++){
    const f = i/n, A = Math.sin((1-f)*d)/Math.sin(d), B = Math.sin(f*d)/Math.sin(d);
    const x = A*Math.cos(φ1)*Math.cos(λ1) + B*Math.cos(φ2)*Math.cos(λ2);
    const y = A*Math.cos(φ1)*Math.sin(λ1) + B*Math.cos(φ2)*Math.sin(λ2);
    const z = A*Math.sin(φ1) + B*Math.sin(φ2);
    out.push([Math.atan2(z, Math.hypot(x,y))*180/Math.PI, Math.atan2(y,x)*180/Math.PI]);
  }
  return out;
}

function drawWalks(){
  walkLayer.clearLayers();
  (TRIP.walks || []).forEach(w => {
    if (!w.is_hike) return;
    if (currentDay !== 'all' && w.local_date !== currentDay) return;
    if (!w.pts || w.pts.length < 2) return;
    L.polyline(w.pts, { color:'#0f172a', weight:8, opacity:.4 }).addTo(walkLayer);
    L.polyline(w.pts, { color:'#000000', weight:4, opacity:1, dashArray:'8,4,2,4',
                        lineCap:'round' })
      .addTo(walkLayer)
      .bindPopup(`
        <div class="pop-title pop-hike">🥾 ${esc(nameOf(w))}</div>
        ${w.sublabel ? `<div class="pop-sub">${esc(w.sublabel)}</div>` : ''}
        <div class="pop-badge badge-hike">On foot · ${fmtDist(w.km)} ${distUnit} · ${w.minutes} min</div>
        <div class="pop-row">${esc(w.day_label)}, ${esc(w.start_label)} – ${esc(w.end_label)}</div>
        <div class="pop-desc">Recorded as a walking segment, which is why this
          reads as a hike rather than a rest stop.${gmaps(w.pts[0][0], w.pts[0][1])}</div>`);
  });
}

function nightsAt(lat, lng){
  return (TRIP.nights || []).filter(n =>
    Math.abs(n.lat - lat) < 0.005 && Math.abs(n.lng - lng) < 0.005).length;
}

function drawMarkers(){
  markerLayer.clearLayers();
  stopPinMarkers = [];
  const bounds = [];

  (TRIP.stops || []).forEach(stop => {
    if (currentDay !== 'all' && stop.local_date !== currentDay) return;
    bounds.push([stop.lat, stop.lng]);

    const low   = Number(stop.confidence) < 0.5;
    const hike  = isHike(stop);
    const night = stop.is_overnight;
    const long  = !night && !hike && Number(stop.hours) >= (M.min_stop_hours || 1);

    if (night){
      const n = nightsAt(stop.lat, stop.lng) || 1;
      addPin(stop, 'pin-night', 'badge-night', '🏨', `🌙 ${n} night${n>1?'s':''}`,
             'pop-night', `${stop.hours} h`, low);
    } else if (hike){
      addPin(stop, 'pin-hike', 'badge-hike', '🥾', `${stop.hours} h`,
             'pop-hike', `${stop.hours} h stop`, low);
    } else if (long){
      addPin(stop, 'pin-long', 'badge-long', '⏱', `${stop.hours} h`,
             'pop-long', `${stop.hours} h stop`, low);
    } else {
      // Short stops stay as unobtrusive dots so the map does not turn into soup.
      L.circleMarker([stop.lat, stop.lng], {
        radius:4, color:'#0f172a', weight:1.5,
        fillColor:dayColor(stop.local_date), fillOpacity:.95
      }).addTo(markerLayer).bindPopup(popupHTML(stop, 'pop-plain', null, null, low));
    }
  });
  refreshPinLayer();
  return bounds;
}

// Below this zoom, labeled pills collapse to icon-only badges so an overview
// of the whole trip doesn't turn into unreadable text; zooming into a single
// day or a cluster reveals full names again.
//
// Raised from 10: the pills are wide, and a row of them appearing while the
// map still covers a whole region put back the crowding the icons had just
// solved. Names now wait until the view is down to roughly a single town.
const ICON_ZOOM_THRESHOLD = 13;

// Flat single-color vector glyphs, not emoji. An emoji is a tiny detailed
// illustration - at badge size it just turns to mud (an early hiking-boot
// emoji attempt here read as "a shark"). A shape built from 1-2 strokes has
// nothing to lose at small sizes, so it stays crisp instead of degrading.
const COMPACT_ICONS = {
  night: '<svg viewBox="0 0 24 24"><path fill="#fff" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>',
  hike: '<svg viewBox="0 0 24 24"><path fill="#fff" d="M2 20h20L15 6l-3.5 6.5L9 8.5 2 20z"/></svg>',
  // A star, not the clock this used to be. The clock said "time passed
  // here", which is true of every pin on the map; a star says "worth
  // stopping at", which is what a long stop actually marks.
  long: '<svg viewBox="0 0 24 24"><path fill="#fff" d="M12 2.6l2.9 5.9 6.5.95-4.7 4.58 1.11 6.47L12 17.44 6.19 20.5l1.11-6.47-4.7-4.58 6.5-.95z"/></svg>',
  // Photos with no recorded place to attach them to. A camera pin only
  // survives where nothing else was near enough to swallow it.
  photo: '<svg viewBox="0 0 24 24"><path fill="#fff" d="M9 3l-1.5 2H4a2 2 0 00-2 2v11a2 2 0 002 2h16a2 2 0 002-2V7a2 2 0 00-2-2h-3.5L15 3H9zm3 5.2a4.8 4.8 0 110 9.6 4.8 4.8 0 010-9.6z"/></svg>'
};

// Where each compact teardrop's tip actually sits within its 60x60 icon box
// (see the CSS ".pin-compact" comment for why they lean different ways).
// Computed from each kind's rotation angle, not eyeballed: the square's own
// center sits at (30,30), the tip is its one unrounded corner at distance
// 38/sqrt(2) =~ 26.9px from that center, and rotate(-45deg) is the known-
// good "points straight down" case (a common CSS map-pin recipe) - the other
// two just rotate 30deg further each way from that. Get this wrong and every
// compact pin points at the wrong spot on the map, not just at a slight tilt.
// Recomputed when the teardrop grew from 34px to 38px - these numbers do not
// survive a size change untouched.
const COMPACT_ANCHOR = { night:[17, 53], hike:[30, 57], long:[43, 53] };

/* Icon box size and whether the pin uses the shrunk styling, per kind. The
   photo pin's 44px box and [22,42] tip come from the same arithmetic as the
   others, just with the smaller square: centre (22,22), tip 28/sqrt(2) =~
   19.8px below it at a -45deg lean. Change a size in the CSS and these have
   to change with it, or every photo pin points at the wrong spot. */
const PIN_GEOMETRY = {
  night: { box:60 },
  hike:  { box:60 },
  long:  { box:60 }
};

function addPin(stop, pinCls, badgeCls, icon, badgeText, titleCls, durText, low){
  const compact = map.getZoom() < ICON_ZOOM_THRESHOLD;
  const kind = pinCls.replace('pin-', '');
  const glyph = COMPACT_ICONS[kind] || icon;
  const html = compact
    ? teardropHTML(kind, 0)
    : `<div class="pin ${pinCls}">
         <span class="pin-name">${glyph}${esc(nameOf(stop))}</span>
         <span class="badge ${badgeCls}">${esc(badgeText)}</span>
       </div>`;
  const marker = L.marker([stop.lat, stop.lng], {
    icon: L.divIcon({
      className:'', html,
      iconSize: compact ? [PIN_GEOMETRY[kind].box, PIN_GEOMETRY[kind].box] : null,
      iconAnchor: compact ? COMPACT_ANCHOR[kind] : [0, 14]
    }),
    riseOnHover:true,
    // Doubles as this pin's kind, read back by pinClusterIcon() to decide
    // which glyph wins when pins merge. Also still sets draw-order priority
    // (see PIN_DRAW_ORDER) for pins drawn on their own.
    pane: `pins-${kind}`
  }).bindPopup(popupHTML(stop, titleCls, badgeCls, durText, low));
  marker.photoCount = 0;   // a stop carries no photos of its own; merging adds them
  marker.placeName = nameOf(stop);   // read back when this pin leads a merge
  // Only while the pin is an icon. Once it is a labelled pill the name is
  // already on screen and a card repeating it is just in the way.
  if (compact) {
    marker.bindTooltip(pinTooltipHTML(kind, marker.placeName, 0, 0, ''),
                       tooltipOptions(kind));
  }
  stopPinMarkers.push(marker);
}

function popupHTML(stop, titleCls, badgeCls, durText, low){
  const warn = low
    ? `<div class="pop-warn">⚠ Low confidence: ${esc(stop.confidence_reason)}</div>` : '';
  const prov = (stop.label && stop.db_name && stop.label !== stop.db_name)
    ? `<div class="prov">Database record: ${esc(stop.db_name)}</div>` : '';
  return `
    <div class="pop-title ${titleCls}">${esc(nameOf(stop))}</div>
    ${stop.sublabel ? `<div class="pop-sub">${esc(stop.sublabel)}</div>` : ''}
    ${durText && badgeCls ? `<div class="pop-badge ${badgeCls}">${esc(durText)}</div>` : ''}
    <div class="pop-row"><b>${esc(stop.day_label)}</b> · ${esc(stop.start_label)} – ${esc(stop.end_label)}</div>
    <div class="pop-desc">${gmaps(stop.lat, stop.lng)}</div>
    ${warn}${prov}`;
}

/* ------------------------------------------------------------ photo column */
/* Clicking a photo pin does NOT open a Leaflet popup: the photos live in the
   right-hand column instead, which is what lets one place's photos be browsed
   at a readable size and stepped through with the keyboard. Photo pins are
   also not filtered by currentDay (unlike drawMarkers()) - one cluster's
   members can span more than one day of the trip (the same lodge at check-in
   and at checkout), so there is no single day to filter it by. */
const PHOTO_CLUSTERS = TRIP.photo_clusters || [];
const HAS_PHOTOS = PHOTO_CLUSTERS.length > 0;
let selectedClusterIndex = 0;
let selectedPhotoIndex = 0;
let visibleClusterIndexes = PHOTO_CLUSTERS.map((_, i) => i);

// Must agree with the mobile media query above, height clause included - a
// landscape phone is wide but short, and gets the full-screen viewer too.
const isMobile = () => window.innerWidth < 768 || window.innerHeight < 500;

function metersBetween(aLat, aLng, bLat, bLng){
  const r = 6371008.8, rad = Math.PI / 180;
  const p1 = aLat * rad, p2 = bLat * rad;
  const dp = (bLat - aLat) * rad, dl = (bLng - aLng) * rad;
  const h = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 2 * r * Math.asin(Math.sqrt(h));
}

// A photo cluster has no name of its own, so it borrows the nearest stop's -
// which by then is the Nominatim-enriched one ("Castle Rock Trail"), not the
// generic database label. 800m: past that the nearest stop is somewhere else
// entirely and naming the photos after it would be a lie.
const PHOTO_PLACE_NAME_RADIUS_METERS = 800;
function clusterPlaceName(cluster){
  let best = null, bestDistance = Infinity;
  (TRIP.stops || []).forEach(stop => {
    const d = metersBetween(cluster.latitude, cluster.longitude, stop.lat, stop.lng);
    if (d < bestDistance){ best = stop; bestDistance = d; }
  });
  return (best && bestDistance <= PHOTO_PLACE_NAME_RADIUS_METERS)
    ? nameOf(best) : 'Photos';
}

function drawPhotoClusters(){
  photoPinMarkers = [];
  if (!photosVisible){ refreshPinLayer(); return []; }
  const bounds = [];
  PHOTO_CLUSTERS.forEach((cluster, index) => {
    bounds.push([cluster.latitude, cluster.longitude]);
    const isSelected = HAS_PHOTOS && index === selectedClusterIndex;
    const marker = L.marker([cluster.latitude, cluster.longitude], {
      icon: photoMarkIcon(cluster.photo_count, isSelected ? 'selected' : ''),
      riseOnHover:true,
      pane:'pins-photo' // Draw-order priority (see PIN_DRAW_ORDER).
    }).on('click', () => selectCluster(index, 0, { openPanel:true }))
      .bindTooltip(pinTooltipHTML('photo', '', 0, cluster.photo_count, 'click to browse'),
                   tooltipOptions('photo'));
    // Read back by pinClusterIcon(): a merged pin reports how many PHOTOS it
    // holds, not how many pins, so it needs each pin's own tally.
    marker.photoCount = cluster.photo_count;
    photoPinMarkers.push(marker);
  });
  refreshPinLayer();
  return bounds;
}

function selectCluster(clusterIndex, photoIndex, options){
  const opts = options || {};
  selectedClusterIndex = Math.max(0, Math.min(clusterIndex, PHOTO_CLUSTERS.length - 1));
  selectedPhotoIndex = photoIndex || 0;
  // Tapping a pin opens the panel on both mobile (full-screen overlay) and
  // desktop (expands the collapsed column) - openPhotoPanel() itself branches
  // on isMobile() to do the right thing for each.
  if (opts.openPanel) openPhotoPanel();
  if (opts.follow) followSelectedCluster();
  drawPhotoClusters();          // repaint so the selected pin highlight moves
  renderPhotoPanel();
}

// "the map follows": keep the pin being browsed on screen, but never change
// zoom - the reader chose that, and yanking it is disorienting.
function followSelectedCluster(){
  const cluster = PHOTO_CLUSTERS[selectedClusterIndex];
  if (!cluster) return;
  const point = L.latLng(cluster.latitude, cluster.longitude);
  if (!map.getBounds().pad(-0.12).contains(point)) map.panTo(point, { animate:true });
}

// Full bleed (object-fit:cover) is worth having only when the photo and the
// viewer box are nearly the same shape, because cover fills the box by
// cutting the photo down on whichever axis is too long.
//
// The test used to be "both landscape, or both portrait", which is far too
// coarse. A 2:3 portrait photo in a viewer that measures 559x624 counts as
// two portraits and passes - and then loses a quarter of its height off the
// top and bottom. Comparing the two aspect ratios directly is exact: the
// smaller divided by the larger IS the share of the photo that survives
// cover, so the rule becomes "go full bleed only if almost all of it does".
//
// Two thresholds rather than one because the reader drags the panel's edge
// and the viewer's shape changes continuously while they do. A single
// cut-off makes the photo snap between letterboxed and full bleed on every
// small movement near it. Instead, full bleed starts once 90% of the photo
// would survive and holds until it would drop below 84% - so the picture
// settles instead of flickering mid-drag.
const COVER_START_VISIBLE_SHARE = 0.90;
const COVER_KEEP_VISIBLE_SHARE  = 0.84;

function updateImageFit(){
  const img = document.getElementById('viewerImage');
  if (!img.naturalWidth || !img.naturalHeight) return;
  const rect = document.getElementById('viewer').getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  const imageAspect = img.naturalWidth / img.naturalHeight;
  const viewerAspect = rect.width / rect.height;
  const visibleShare = Math.min(imageAspect, viewerAspect)
                     / Math.max(imageAspect, viewerAspect);
  const alreadyFullBleed = img.style.objectFit === 'cover';
  const threshold = alreadyFullBleed
    ? COVER_KEEP_VISIBLE_SHARE
    : COVER_START_VISIBLE_SHARE;
  img.style.objectFit = visibleShare >= threshold ? 'cover' : 'contain';
}

function renderPhotoPanel(){
  if (!HAS_PHOTOS) return;
  const cluster = PHOTO_CLUSTERS[selectedClusterIndex];
  const photos = cluster.photos;
  selectedPhotoIndex = Math.max(0, Math.min(selectedPhotoIndex, photos.length - 1));
  const photo = photos[selectedPhotoIndex];

  const image = document.getElementById('viewerImage');
  image.src = photo.display_url || photo.thumbnail_url || '';
  image.alt = photo.file_name;
  // Clear the fit first so the new photo is judged from scratch: the two
  // thresholds in updateImageFit() read the current value to decide whether
  // full bleed is already running, and a fresh photo should have to meet the
  // strict one rather than inherit the previous photo's slack.
  image.style.objectFit = '';
  image.onload = updateImageFit;
  updateImageFit();   // in case this exact image is already cached/loaded
  document.getElementById('viewerCount').textContent =
    `${selectedPhotoIndex + 1} / ${photos.length}`;
  document.getElementById('viewerCaption').textContent =
    `${photo.file_name} · ${photo.local_timestamp}`;

  document.getElementById('placeName').textContent = clusterPlaceName(cluster);
  const firstTime = photos[0].local_timestamp;
  const lastTime = photos[photos.length - 1].local_timestamp;
  const span = photos.length > 1 ? `${firstTime} – ${lastTime}` : firstTime;
  document.getElementById('placeSub').textContent =
    `${span} · ${photos.length} photo${photos.length > 1 ? 's' : ''}`;

  const track = document.getElementById('progressTrack');
  track.innerHTML = photos
    .map((_, i) => `<div class="progress-seg${i <= selectedPhotoIndex ? ' done' : ''}"></div>`)
    .join('');

  const grid = document.getElementById('thumbGrid');
  grid.innerHTML = photos.map((p, i) =>
    `<img src="${p.thumbnail_url || ''}" loading="lazy" data-photo-index="${i}"
          class="${i === selectedPhotoIndex ? 'current' : ''}"
          alt="${esc(p.file_name)}" title="${esc(p.file_name)} · ${esc(p.local_timestamp)}">`
  ).join('');

  // Nothing wraps any more, so an arrow is dead only at the end it points at:
  // the photo arrows at the very first and very last photo of the trip, the
  // place arrows at the first and last place.
  const order = browseOrder();
  const here = order.indexOf(selectedClusterIndex);
  const isFirstPlace = here <= 0;
  const isLastPlace = here === order.length - 1;
  document.getElementById('prevPlace').disabled = isFirstPlace;
  document.getElementById('nextPlace').disabled = isLastPlace;
  document.getElementById('prevPhoto').disabled =
    isFirstPlace && selectedPhotoIndex === 0;
  document.getElementById('nextPhoto').disabled =
    isLastPlace && selectedPhotoIndex === photos.length - 1;
  preloadNeighbourImages(photos);
}

// Fetch the next/previous full-size image before it's asked for, so stepping
// with the arrow keys doesn't flash an empty frame on each press.
function preloadNeighbourImages(photos){
  [selectedPhotoIndex - 1, selectedPhotoIndex + 1].forEach(i => {
    const neighbour = photos[i];
    if (neighbour && neighbour.display_url) new Image().src = neighbour.display_url;
  });
}

/* Every place, earliest photo first, so stepping forward walks the trip in
   the order it happened. Photo groups arrive grouped by LOCATION, and the
   order they arrive in is not time order at all.

   Two places CAN overlap in time - the same lodge photographed at check-in
   and again at checkout, with a viewpoint in between. A place is still kept
   whole and placed by its first photo, so one of the lodge's two visits ends
   up out of order. Interleaving them photo by photo would fix that and cost
   far more: the reader would be thrown between two places and back for every
   picture. Whole places, first photo wins. */
const CHRONOLOGICAL_CLUSTERS = PHOTO_CLUSTERS
  .map((cluster, index) => ({
    index,
    // Photos inside a place are already earliest-first (attach_photos.py sorts
    // them), so the first one dates the place. Missing times sort first and
    // keep their original order rather than shuffling.
    time: ((cluster.photos || [])[0] || {}).timestamp_utc || ''
  }))
  .sort((a, b) => (a.time < b.time ? -1 : a.time > b.time ? 1 : a.index - b.index))
  .map(entry => entry.index);

/* The places the arrows walk through, in time order.

   On desktop the map sits beside the panel, so the arrows offer what the
   reader can actually see - pan somewhere else and the list changes with it.
   On a phone the viewer covers the map completely, so that scoping would be
   invisible; worse, with a single place on screen "next" led straight back
   into the place already open, which is the wrap this fixes. The fallback
   below catches the same trap on desktop. */
function browseOrder(){
  if (isMobile()) return CHRONOLOGICAL_CLUSTERS;
  const inView = new Set(visibleClusterIndexes);
  const scoped = CHRONOLOGICAL_CLUSTERS.filter(index => inView.has(index));
  return (scoped.length > 1 && scoped.includes(selectedClusterIndex))
    ? scoped : CHRONOLOGICAL_CLUSTERS;
}

// Stepping past either end of a place carries on into the next place in time
// order, so the whole trip's photos are reachable with one key held down.
// The two ends of the trip are ends: nothing wraps back round to the start.
function stepPhoto(delta){
  if (!HAS_PHOTOS) return;
  const photos = PHOTO_CLUSTERS[selectedClusterIndex].photos;
  const next = selectedPhotoIndex + delta;
  if (next >= 0 && next < photos.length){
    selectCluster(selectedClusterIndex, next, {});
    return;
  }
  stepPlace(delta, delta > 0 ? 'first' : 'last');
}

function stepPlace(delta, landOn){
  if (!HAS_PHOTOS) return;
  const order = browseOrder();
  const next = order.indexOf(selectedClusterIndex) + delta;
  if (next < 0 || next >= order.length) return;
  const target = order[next];
  const photoCount = PHOTO_CLUSTERS[target].photos.length;
  selectCluster(target, landOn === 'last' ? photoCount - 1 : 0, { follow:true });
}

// The column offers what the map is currently showing, so panning somewhere
// else changes which places the place-arrows walk through.
function updateVisibleClusters(){
  if (!HAS_PHOTOS) return;
  const bounds = map.getBounds();
  visibleClusterIndexes = PHOTO_CLUSTERS
    .map((cluster, index) => ({ cluster, index }))
    .filter(entry => bounds.contains(
      L.latLng(entry.cluster.latitude, entry.cluster.longitude)))
    .map(entry => entry.index);
  if (visibleClusterIndexes.length === 0) visibleClusterIndexes = PHOTO_CLUSTERS.map((_, i) => i);

  const chip = document.getElementById('inViewChip');
  chip.hidden = !photosVisible || isMobile() || !desktopPanelOpen;
  chip.textContent =
    `${visibleClusterIndexes.length} of ${PHOTO_CLUSTERS.length} photo places in view`;
  renderPhotoPanel();
}

function openPhotoPanel(){
  document.getElementById('photoPanel').hidden = false;
  if (isMobile()){
    maybeShowGestureHint();
  } else {
    desktopPanelOpen = true;
    layoutPhotoPanel();
    updateVisibleClusters();   // the in-view chip only shows once the panel is open
  }
}
// On mobile this just hides the full-screen overlay. On desktop there's no
// overlay to hide - it collapses the column back to zero width instead,
// same end state as unchecking "Show photos", but leaves photosVisible (and
// the pins on the map) alone so a pin click reopens it.
function closePhotoPanel(){
  if (isMobile()){
    document.getElementById('photoPanel').hidden = true;
  } else {
    desktopPanelOpen = false;
    layoutPhotoPanel();
    updateVisibleClusters();   // recompute the in-view chip's hidden state now, not on next pan
  }
  setMaximized(false);
}

// Mobile-only: hides the place header and thumbnail strip so the photo fills
// the whole panel (see the .photo-panel.maximized rule in the mobile media
// query). Toggled by the ⤢ button and by tapping the photo itself.
function setMaximized(maximized){
  document.getElementById('photoPanel').classList.toggle('maximized', maximized);
  const btn = document.getElementById('maximizeToggle');
  btn.textContent = maximized ? '⤡' : '⤢';
  btn.title = maximized ? 'Restore photo view' : 'Maximize photo';
}
function toggleMaximize(){
  setMaximized(!document.getElementById('photoPanel').classList.contains('maximized'));
}

// Shown once ever, the first time a reader opens the mobile photo viewer, so
// the swipe/tap gestures aren't undiscoverable. Marked "seen" the moment it's
// shown rather than only once dismissed, so it never comes back even if the
// reader ignores it. Wrapped in try/catch: some browsers (Safari private
// mode, a page opened straight from disk) throw on localStorage access
// instead of just returning null - if so, this fails open and shows the hint
// rather than silently never showing it.
const GESTURE_HINT_KEY = 'lochis-photo-gesture-hint-seen';
function maybeShowGestureHint(){
  if (!isMobile()) return;
  let seen = false;
  try { seen = !!localStorage.getItem(GESTURE_HINT_KEY); } catch (e) { /* show it */ }
  if (seen) return;
  document.getElementById('gestureHint').hidden = false;
  try { localStorage.setItem(GESTURE_HINT_KEY, '1'); } catch (e) { /* best-effort only */ }
}
function dismissGestureHint(){
  document.getElementById('gestureHint').hidden = true;
}

// On desktop the column is collapsed until the reader opens it (a pin click
// or the "Show photos" toggle - see openPhotoPanel()), same as mobile starts
// closed until a pin is tapped. Once open, the map is narrowed to sit beside
// it; while closed, the map keeps the whole window, same as when there are no
// photos at all.
function layoutPhotoPanel(){
  const panel = document.getElementById('photoPanel');
  if (!HAS_PHOTOS || !photosVisible){
    document.documentElement.style.setProperty('--photo-panel-width', '0px');
    panel.hidden = true;
    document.getElementById('inViewChip').hidden = true;
    map.invalidateSize();
    return;
  }
  if (isMobile()){
    document.documentElement.style.setProperty('--photo-panel-width', '0px');
  } else if (!desktopPanelOpen){
    document.documentElement.style.setProperty('--photo-panel-width', '0px');
    panel.hidden = true;
    map.invalidateSize();
    return;
  } else {
    // Once the reader has dragged the handle, that width sticks (re-clamped
    // to the current window each time) instead of reverting to the default.
    const width = customPhotoPanelWidthPx != null
      ? `${clampPhotoPanelWidth(customPhotoPanelWidthPx)}px`
      : 'min(42%, 560px)';
    document.documentElement.style.setProperty('--photo-panel-width', width);
    panel.hidden = false;
  }
  map.invalidateSize();
  updateImageFit();   // the viewer's own aspect ratio just changed with the width
}

// Drag-to-resize the photo panel (desktop only - on mobile it's a full-screen
// overlay with nothing beside it to resize against).
const PHOTO_PANEL_MIN_WIDTH_PX = 280;
const PHOTO_PANEL_MAX_WIDTH_RATIO = 0.75;  // never swallow more than 3/4 of the window
const MAP_MIN_VISIBLE_WIDTH_PX = 240;      // the map always keeps at least this much room
let customPhotoPanelWidthPx = null;        // null = use the default responsive width
let preMaximizeWidthPx = null;             // width to restore to when un-maximizing

function clampPhotoPanelWidth(px){
  const max = Math.min(
    window.innerWidth * PHOTO_PANEL_MAX_WIDTH_RATIO,
    window.innerWidth - MAP_MIN_VISIBLE_WIDTH_PX
  );
  return Math.max(PHOTO_PANEL_MIN_WIDTH_PX, Math.min(px, max));
}

// Double-click the handle toggles between the current width and the max -
// dragging still works normally afterwards, since both just set the same
// customPhotoPanelWidthPx variable that layoutPhotoPanel() reads.
function isPanelMaximized(){
  const current = document.getElementById('photoPanel').getBoundingClientRect().width;
  return current >= clampPhotoPanelWidth(Infinity) - 1;
}
function toggleMaximizePanel(){
  if (isPanelMaximized()){
    customPhotoPanelWidthPx = preMaximizeWidthPx;
    preMaximizeWidthPx = null;
  } else {
    preMaximizeWidthPx = customPhotoPanelWidthPx != null
      ? customPhotoPanelWidthPx
      : document.getElementById('photoPanel').getBoundingClientRect().width;
    customPhotoPanelWidthPx = clampPhotoPanelWidth(Infinity);
  }
  layoutPhotoPanel();
}

function wirePanelResize(){
  if (!HAS_PHOTOS) return;
  const handle = document.getElementById('panelResizeHandle');
  let dragging = false, startX = 0, startWidth = 0, pendingFrame = null;

  handle.addEventListener('mousedown', event => {
    if (isMobile()) return;
    dragging = true;
    startX = event.clientX;
    startWidth = document.getElementById('photoPanel').getBoundingClientRect().width;
    handle.classList.add('dragging');
    document.body.style.userSelect = 'none';
    document.body.style.cursor = 'col-resize';
    event.preventDefault();
  });

  window.addEventListener('mousemove', event => {
    if (!dragging) return;
    const deltaX = startX - event.clientX;   // dragging left grows the panel
    customPhotoPanelWidthPx = clampPhotoPanelWidth(startWidth + deltaX);
    document.documentElement.style.setProperty(
      '--photo-panel-width', `${customPhotoPanelWidthPx}px`);
    // invalidateSize forces a Leaflet layout pass - batch it to one per frame
    // instead of once per mousemove, which fires far more often than that.
    if (pendingFrame) return;
    pendingFrame = requestAnimationFrame(() => {
      map.invalidateSize();
      updateImageFit();   // the viewer's aspect ratio changes as it's dragged
      pendingFrame = null;
    });
  });

  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    document.body.style.userSelect = '';
    document.body.style.cursor = '';
  });

  handle.addEventListener('dblclick', event => {
    if (isMobile()) return;
    event.preventDefault();
    toggleMaximizePanel();
  });
}

function wirePhotoPanel(){
  if (!HAS_PHOTOS) return;

  document.getElementById('prevPhoto').addEventListener('click', () => stepPhoto(-1));
  document.getElementById('nextPhoto').addEventListener('click', () => stepPhoto(1));
  document.getElementById('prevPlace').addEventListener('click', () => stepPlace(-1));
  document.getElementById('nextPlace').addEventListener('click', () => stepPlace(1));
  document.getElementById('closeViewer').addEventListener('click', closePhotoPanel);
  document.getElementById('maximizeToggle').addEventListener('click', toggleMaximize);
  document.getElementById('viewerImage').addEventListener('click', () => {
    if (isMobile()) toggleMaximize();
  });
  document.getElementById('gestureHint').addEventListener('click', dismissGestureHint);

  document.getElementById('thumbGrid').addEventListener('click', event => {
    const index = event.target.dataset && event.target.dataset.photoIndex;
    if (index !== undefined) selectCluster(selectedClusterIndex, Number(index), {});
  });

  document.addEventListener('keydown', event => {
    if (document.getElementById('photoPanel').hidden) return;
    if (event.key === 'ArrowLeft'){ event.preventDefault(); stepPhoto(-1); }
    else if (event.key === 'ArrowRight'){ event.preventDefault(); stepPhoto(1); }
    else if (event.key === 'Escape') closePhotoPanel();
  });

  // Swipe: sideways steps photos, up moves to the next place - the two
  // gestures the phone layout offers instead of the desktop arrows.
  const viewer = document.getElementById('viewer');
  let touchStartX = 0, touchStartY = 0;
  const SWIPE_THRESHOLD_PIXELS = 45;
  viewer.addEventListener('touchstart', event => {
    touchStartX = event.changedTouches[0].clientX;
    touchStartY = event.changedTouches[0].clientY;
  }, { passive:true });
  viewer.addEventListener('touchend', event => {
    dismissGestureHint();
    const deltaX = event.changedTouches[0].clientX - touchStartX;
    const deltaY = event.changedTouches[0].clientY - touchStartY;
    if (Math.abs(deltaX) > Math.abs(deltaY)){
      if (Math.abs(deltaX) > SWIPE_THRESHOLD_PIXELS) stepPhoto(deltaX < 0 ? 1 : -1);
    } else if (deltaY < -SWIPE_THRESHOLD_PIXELS){
      stepPlace(1);
    }
  }, { passive:true });

  map.on('moveend', updateVisibleClusters);
  L.DomEvent.disableClickPropagation(document.getElementById('photoPanel'));
  L.DomEvent.disableScrollPropagation(document.getElementById('photoPanel'));
}

function render(fit){
  const b1 = drawRoute();
  drawFlights();
  drawWalks();
  const b2 = drawMarkers();
  const b3 = drawPhotoClusters();
  const all = b1.concat(b2).concat(b3);
  if (fit && all.length) fitTo(L.latLngBounds(all));
}

// Our own fitBounds fires zoomstart too, so flag it and ignore those events -
// otherwise the map would immediately think the reader had taken control.
let programmatic = false;
function fitTo(bounds){
  programmatic = true;
  map.fitBounds(bounds, fitOpts());
  setTimeout(() => { programmatic = false; }, 500);
}

function fitOpts(){
  // Asymmetric padding: the open panel covers the left edge, so the route is
  // centred in the space that is actually visible rather than behind the card.
  const small = window.innerWidth < 768;
  const panelEl = document.getElementById('panel');
  if (small) return { padding:[28, 28] };
  const open = !panelEl.classList.contains('collapsed');
  // Cap the panel-clearance pad at a share of the viewport. Uncapped, a wide
  // screen showing a tall narrow route spends most of its width on padding and
  // the trip ends up as a thin strip pinned to the right edge.
  const wanted = (open ? panelEl.offsetWidth : 0) + 40;
  const left = Math.min(wanted, map.getSize().x * 0.28);
  return { paddingTopLeft:[left, 40], paddingBottomRight:[50, 50] };
}

/* --------------------------------------------------------------- controls */
function buildChrome(){
  document.getElementById('tripTitle').textContent = M.title || 'Trip';
  document.getElementById('tripSubtitle').textContent =
    M.subtitle || `${M.start_date} – ${M.end_date}`;
  document.title = M.title || 'Trip';

  renderStatReadouts();

  // A gap counts as "unrouted" when viz/snap_route_gaps.py couldn't reach
  // OSRM (or it found no route) and fell back to the straight line between
  // the gap's two endpoints. That segment renders identically to a real
  // road route otherwise (same dashed style), so without this banner
  // there'd be no way to notice from the map alone that reconstruction
  // silently didn't happen for some stretches.
  const unroutedGaps = (TRIP.days || []).reduce((n, d) =>
    n + (d.inferred_segments || []).filter(seg => !seg.is_routed).length, 0);
  const gapBanner = document.getElementById('gapBanner');
  if (unroutedGaps > 0){
    gapBanner.innerHTML =
      `<b>${unroutedGaps} unrecorded stretch${unroutedGaps === 1 ? '' : 'es'}</b> ` +
      `could not be matched to ${unroutedGaps === 1 ? 'a road' : 'roads'} — shown as ` +
      `${unroutedGaps === 1 ? 'a straight line' : 'straight lines'} instead.`;
    gapBanner.classList.add('show');
  }

  // Every entry is the actual pin the reader will meet on the map, at a
  // smaller size, so there is nothing to translate between the two.
  const legendPin = kind => `<div class="legend-pin ${kind}"><i></i>${COMPACT_ICONS[kind]}</div>`;
  document.getElementById('legend').innerHTML = `
    <div class="legend-item">${legendPin('night')}Overnight</div>
    <div class="legend-item">${legendPin('hike')}Likely hike</div>
    <div class="legend-item">${legendPin('long')}Long stop</div>` +
    (HAS_PHOTOS ? `
    <div class="legend-item">${photoChipHTML(12)}Photos here</div>` : '') + `
    <div class="legend-item"><div class="dash"></div>On foot · no drive</div>
    <div class="legend-item"><div class="dash dash-inferred"></div>No GPS · road estimate</div>`;

  // Day filter
  const df = document.getElementById('dayFilter');
  df.appendChild(mkBtn('All days', true, ev => setDay('all', ev)));
  TRIP.days.forEach(d => {
    df.appendChild(mkBtn(
      `<span class="swatch" style="background:${d.color}"></span>${esc(d.label)}
       <span class="km">${fmtDist(d.distance_km)}${distUnit}</span>`,
      false, ev => setDay(d.date, ev)));
  });

  // Hike rule switch. "or more" rather than "≥ 1h": the maths symbol put a
  // number straight after a duration, and "≥ 1h (15)" was being read as one
  // hour and fifteen minutes.
  const ht = document.getElementById('hikeToggle');
  ht.appendChild(mkBtn(`Any stop of ${M.min_stop_hours}h or more (${S.hikes_naive})`,
                       hikeRule === 'naive', ev => setRule('naive', ev)));
  ht.appendChild(mkBtn(`Walk-confirmed (${S.hikes_smart})`,
                       hikeRule === 'smart', ev => setRule('smart', ev)));
  updateHikeNote();

  // Photos - hide the switch when this trip has none, rather than showing a
  // toggle that controls nothing. Turning photos off also gives back the
  // full-width map, i.e. the plain trip map this page has always been.
  const pt = document.getElementById('photoToggle');
  const photoCount = PHOTO_CLUSTERS.reduce((sum, c) => sum + c.photo_count, 0);
  if (photoCount){
    const photoBtn = mkBtn(`Show photos (${photoCount})`, true, () => {
      photosVisible = !photosVisible;
      // Mirrors photosVisible: turning photos on also opens the (otherwise
      // collapsed) desktop column, turning them off closes it along with the
      // pins - one toggle, no separate "now also expand the column" step.
      desktopPanelOpen = photosVisible;
      photoBtn.classList.toggle('active', photosVisible);
      layoutPhotoPanel();
      render(false);
      updateVisibleClusters();
    });
    pt.appendChild(photoBtn);
  } else {
    pt.style.display = 'none';
  }

  // Distance units. Abbreviated, because the switch sits directly above the
  // stat that spells the unit out in full.
  const ut = document.getElementById('unitToggle');
  ut.appendChild(mkBtn('km', !IMPERIAL, ev => setUnits(false, ev)));
  ut.appendChild(mkBtn('mi', IMPERIAL, ev => setUnits(true, ev)));

  // Basemap
  const bt = document.getElementById('baseToggle');
  Object.keys(BASEMAPS).forEach((k, i) => {
    bt.appendChild(mkBtn(k, i === 0, ev => {
      map.removeLayer(activeBase);
      activeBase = BASEMAPS[k].addTo(map);
      activeBase.bringToBack();
      setActive(ev);
    }));
  });
}

// How many hikes the page is currently claiming. Reads the live rule rather
// than one fixed statistic: the two rules count different things, so a card
// that always showed one of them would contradict the pins on the map as soon
// as the reader picked the other.
function hikeCount(){
  return hikeRule === 'smart' ? S.hikes_smart : S.hikes_naive;
}

// The two blocks of numbers at the top of the card: the four big stats and the
// one-line summary shown when the card is shut. Both are pure output - no
// buttons, no state - so switching units just rebuilds them from scratch.
function renderStatReadouts(){
  const stats = [
    [`${fmtDist(S.total_km)}`, distUnit === 'km' ? 'Kilometres' : 'Miles'],
    [S.nights_away, S.nights_away === 1 ? 'Night away' : 'Nights away'],
    [S.distinct_stay_places, S.distinct_stay_places === 1 ? 'Place stayed' : 'Places stayed'],
    [hikeCount(), hikeCount() === 1 ? 'Likely hike' : 'Likely hikes']
  ];
  document.getElementById('statsGrid').innerHTML = stats.map(([v, l]) =>
    `<div class="stat"><div class="stat-val">${esc(v)}</div>
     <div class="stat-lbl">${esc(l)}</div></div>`).join('');

  document.getElementById('miniStats').innerHTML = [
    `${fmtDist(S.total_km)} ${distUnit}`,
    `${S.nights_away} night${S.nights_away === 1 ? '' : 's'}`,
    `${hikeCount()} hike${hikeCount() === 1 ? '' : 's'}`
  ].map(t => `<span>${esc(t)}</span>`).join('');
}

// Switch the whole page between kilometres and miles. Nothing is recomputed
// from the data: every distance on the page is stored in km and converted for
// display by dist(), so this flips one variable and redraws whatever shows a
// distance.
function setUnits(imperial, ev){
  if (ev) setActive(ev);
  if (imperial === IMPERIAL) return;
  IMPERIAL = imperial;
  distUnit = IMPERIAL ? 'mi' : 'km';

  renderStatReadouts();

  // The day chips are left in place rather than rebuilt, so the day the
  // reader has selected stays selected. One .km span per day, in the same
  // order as TRIP.days - the "All days" chip has no distance and so no span.
  document.querySelectorAll('#dayFilter .km').forEach((span, i) => {
    const day = TRIP.days[i];
    if (day) span.textContent = `${fmtDist(day.distance_km)}${distUnit}`;
  });

  map.removeControl(scaleControl);
  scaleControl = L.control.scale(
    { position:'bottomleft', imperial:IMPERIAL, metric:!IMPERIAL }).addTo(map);

  // Last, because it is the one step that touches every layer on the map:
  // anything that threw here would otherwise leave the readouts above already
  // switched and the scale bar still in the old units. Distances also appear
  // inside popups (day routes, road-reconstructed gaps, flights, walks) and
  // those strings are built while drawing, so a redraw is what refreshes
  // them. false means "don't move the map".
  render(false);
}

function mkBtn(html, active, fn){
  const b = document.createElement('button');
  b.className = 'btn' + (active ? ' active' : '');
  b.type = 'button';
  b.innerHTML = html;
  b.addEventListener('click', fn);
  return b;
}
function setActive(ev){
  const btn = ev.currentTarget;
  btn.parentElement.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}
function setDay(date, ev){
  currentDay = date;
  setActive(ev);
  render(true);
}
function setRule(rule, ev){
  hikeRule = rule;
  setActive(ev);
  updateHikeNote();
  renderStatReadouts();   // the "Likely hikes" figure is this rule's count
  render(false);
}
function updateHikeNote(){
  document.getElementById('hikeNote').textContent = hikeRule === 'smart'
    ? 'A long stop counts as a hike only when a walking segment was recorded beside it — this rejects highway rest stops.'
    : `Every stop of ${M.min_stop_hours}h or more, overnight stays excluded. Includes rest stops where no walking was recorded.`;
}

/* --------------------------------------------------------------- panel UX */
const panel = document.getElementById('panel');
const head  = document.getElementById('panelHead');
// Once the reader opens or shuts the card themselves, stop second-guessing them
// on resize; until then the card follows the breakpoint (including rotation).
let userToggled = false;
const chev = document.getElementById('chev');
const chevLabel = document.getElementById('chevLabel');
function setCollapsed(state){
  panel.classList.toggle('collapsed', state);
  head.setAttribute('aria-expanded', String(!state));
  chevLabel.textContent = state ? 'Details' : 'Hide';
}
function autoCollapse(){
  if (!userToggled) setCollapsed(isMobile());
}
head.addEventListener('click', () => {
  userToggled = true;
  chev.classList.remove('attn');
  setCollapsed(!panel.classList.contains('collapsed'));
});
head.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); head.click(); }
});
// Keep map gestures from being hijacked by the panel.
L.DomEvent.disableClickPropagation(panel);
L.DomEvent.disableScrollPropagation(panel);

/* ------------------------------------------------------------------- boot */
// Track whether the reader has taken control, so a resize never yanks the map
// back from where they panned to.
let userMoved = false;
map.on('dragstart zoomstart', () => { if (!programmatic) userMoved = true; });
// Markers swap between compact and labeled form as zoom crosses
// ICON_ZOOM_THRESHOLD. Only markers are redrawn - route/walks don't change.
//
// Gated on the form ACTUALLY changing, not on every zoomend: rebuilding the
// markers empties and refills the cluster group, which makes the plugin throw
// away the grouping it just animated into place. Between two zooms on the
// same side of the threshold there is nothing to redraw anyway - the plugin
// re-groups by itself.
let lastCompactForm = null;
map.on('zoomend', () => {
  const compact = map.getZoom() < ICON_ZOOM_THRESHOLD;
  if (compact === lastCompactForm) return;
  lastCompactForm = compact;
  drawMarkers();
});

function boot(){
  buildChrome();
  autoCollapse();            // start out of the way on phones
  // Photo column before the first fit: it narrows the map, and fitting to a
  // box that's about to shrink leaves the route pushed under the column.
  wirePhotoPanel();
  wirePanelResize();
  layoutPhotoPanel();
  map.invalidateSize();      // fit must not run on a zero-size box
  render(true);
  if (HAS_PHOTOS){
    updateVisibleClusters();
    // The trip's first photos, not whichever place happens to be first in the
    // data - the panel opens where the arrows would walk from.
    selectCluster(CHRONOLOGICAL_CLUSTERS[0], 0, {});
  }
  userMoved = false;
  // A shut panel with nothing moving reads as a dead end, so draw the eye to
  // the one control that reopens it - a few pulses, then leave it alone.
  if (panel.classList.contains('collapsed')){
    chev.classList.add('attn');
    chev.addEventListener('animationend', () => chev.classList.remove('attn'), { once:true });
  }
}

// Deliberately not requestAnimationFrame: rAF is paused in a hidden or
// background tab, so a page opened into one would sit blank until focused -
// a very real case for a file arriving as an email attachment. setTimeout
// keeps running regardless of visibility. `started` keeps it idempotent.
let started = false;
function start(){
  if (started) return;
  started = true;
  boot();
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => setTimeout(start, 0));
} else {
  setTimeout(start, 0);
}
window.addEventListener('load', start);   // safety net

let resizeTimer;
function reflow(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    autoCollapse();
    // Rotating a phone, or dragging a window across the 768px breakpoint,
    // switches the photo column between overlay and side-by-side.
    layoutPhotoPanel();
    map.invalidateSize();
    if (!userMoved) render(true);          // re-fit only an untouched map
  }, 180);
}
window.addEventListener('resize', reflow);

/* A tab that is hidden at load time has a zero-size map container, and
   fitBounds on a zero-size box collapses to maximum zoom. Watching the
   container itself catches the moment it gains real dimensions - whether from
   the tab being revealed, the window resizing, or the phone being rotated -
   and re-fits then. This is what makes the page correct when it is opened
   into a background tab rather than a focused one. */
if (window.ResizeObserver){
  let lastW = 0, lastH = 0;
  new ResizeObserver(entries => {
    const { width, height } = entries[0].contentRect;
    if (!width || !height) return;
    if (Math.abs(width - lastW) < 2 && Math.abs(height - lastH) < 2) return;
    lastW = width; lastH = height;
    reflow();
  }).observe(document.getElementById('map'));
}
</script>
</body>
</html>
