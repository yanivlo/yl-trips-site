<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Washington, D.C. 12/2023</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<!-- Leaflet.markercluster groups pins that sit too close together into one
     bubble, recomputed at every zoom. Only MarkerCluster.css is loaded (it
     positions the bubbles and drives the fan-out animation) - NOT
     MarkerCluster.Default.css, which is the plugin's stock blue-blob look.
     Every bubble here is built by pinClusterIcon() instead. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; font-family:'Inter', system-ui, sans-serif; }
  html, body { height:100%; width:100%; overflow:hidden; background:#0f172a; color:#f8fafc;
               -webkit-text-size-adjust:100%; }
  /* The map yields the right edge to the photo column on desktop. Set to 0
     by JS when a trip has no photos, so a photo-less map still fills the
     window exactly as it did before photos existed. */
  :root{ --photo-panel-width: 0px; }
  #map { position:absolute; top:0; bottom:0; left:0; right:var(--photo-panel-width);
         height:100%; background:#0f172a; }

  /* ---------- Floating control card ---------- */
  .panel{
    position:absolute; z-index:1000;
    top:max(14px, env(safe-area-inset-top)); left:14px;
    width:min(400px, calc(100vw - 28px));
    background:rgba(15,23,42,.94); backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.15); border-radius:14px;
    box-shadow:0 14px 32px -5px rgba(0,0,0,.65);
    display:flex; flex-direction:column;
    max-height:calc(100dvh - 28px);
    overflow:hidden;
  }
  .panel-head{
    display:flex; align-items:center; gap:10px; cursor:pointer;
    padding:14px 16px; user-select:none; flex:none;
  }
  .panel-head:hover .chev{ color:#e2e8f0; }
  .head-text{ flex:1; min-width:0; }
  .title{ font-size:1.05rem; font-weight:800; color:#38bdf8; line-height:1.25; }
  .subtitle{ font-size:.74rem; color:#94a3b8; margin-top:2px; line-height:1.35; }
  /* Wrap freely when open; stay on one line only when the card is shut. */
  .panel.collapsed .subtitle{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* A lone gray arrow character reads as decoration, not a control - this is
     a visible pill button so a shut panel doesn't look like a dead end. */
  .chev{ flex:none; display:flex; align-items:center; gap:5px;
         color:#7dd3fc; font-size:.66rem; font-weight:700; letter-spacing:.03em;
         text-transform:uppercase;
         background:rgba(56,189,248,.16); border:1px solid rgba(56,189,248,.45);
         border-radius:999px; padding:6px 11px 6px 13px;
         transition:background .15s ease, border-color .15s ease; }
  .panel-head:hover .chev{ background:rgba(56,189,248,.26); border-color:rgba(56,189,248,.7); }
  .chev-arrow{ display:inline-block; font-size:.8rem; transition:transform .22s ease; }
  .panel.collapsed .chev-arrow{ transform:rotate(-90deg); }
  @keyframes chevPulse{
    0%, 100% { box-shadow:0 0 0 0 rgba(56,189,248,.55); }
    50%      { box-shadow:0 0 0 7px rgba(56,189,248,0); }
  }
  .chev.attn{ animation:chevPulse 1.2s ease-out 3; }
  .panel-body{
    padding:0 16px 16px; overflow-y:auto; overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
  }
  .panel.collapsed .panel-body{ display:none; }

  /* Collapsed summary chips, so a shut panel still tells you something */
  .mini{ display:none; gap:6px; padding:0 16px 12px; flex-wrap:wrap; }
  .panel.collapsed .mini{ display:flex; }
  .mini span{ font-size:.68rem; font-weight:600; color:#cbd5e1;
              background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.1);
              border-radius:999px; padding:3px 9px; }

  /* ---------- Stats ---------- */
  .stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px;
          border-top:1px solid rgba(255,255,255,.08);
          border-bottom:1px solid rgba(255,255,255,.08);
          padding:10px 0; margin-bottom:12px; }
  .stat{ text-align:center; min-width:0; }
  .stat-val{ font-size:1.05rem; font-weight:700; color:#f1f5f9; line-height:1.15; }
  .stat-lbl{ font-size:.6rem; color:#64748b; text-transform:uppercase;
             letter-spacing:.05em; margin-top:2px; }

  /* ---------- Legend ---------- */
  .legend{ display:flex; flex-wrap:wrap; gap:9px; padding:8px 10px;
           background:rgba(255,255,255,.05); border-radius:8px;
           margin-bottom:12px; font-size:.7rem; color:#cbd5e1; }
  .legend-item{ display:flex; align-items:center; gap:6px; }
  .dot{ width:10px; height:10px; border-radius:50%; flex:none; }
  /* A miniature of the real pin, not a coloured dot: the map identifies a
     place by its GLYPH now, so a legend that showed only colour left the
     reader to guess which shape went with which word - and colour alone
     fails anyone who can't separate the hues. Same rotated-square teardrop
     as the map, shrunk, with the glyph held upright over it. */
  .legend-pin{ position:relative; width:19px; height:19px; flex:none;
               display:inline-block; vertical-align:-5px; }
  .legend-pin i{ position:absolute; inset:0; border-radius:50% 50% 50% 0;
                 transform:rotate(-45deg); box-sizing:border-box; }
  .legend-pin svg{ position:absolute; inset:0; margin:auto;
                   width:11px; height:11px; display:block; }
  .legend-pin.night i{ background:#2563eb; border:2px solid #bfdbfe; }
  .legend-pin.hike  i{ background:#059669; border:2px solid #bbf7d0; }
  .legend-pin.long  i{ background:#475569; border:2px solid #cbd5e1; }
  .legend-pin.photo i{ background:#9d174d; border:2px solid #f9a8d4; }
  /* The photo chip appears in the legend as itself, at map size - there is
     only one photo mark to explain now, so it gets one row. */
  .legend .photo-chip{ flex:none; }
  /* In a hover card the chip carries no count, just the camera. */
  .photo-chip.tip-chip{ padding:0 4px; vertical-align:-5px; }

  /* ---------- Hover card ---------- */
  /* A Leaflet tooltip rather than the browser's own `title`, so it can carry
     the same little pin the legend and map use instead of describing it in
     words. One line, always: the place, then how many photos, then what a
     click will do. */
  .leaflet-tooltip.pin-tip{ background:#0f172a; color:#e2e8f0;
                            border:1px solid rgba(255,255,255,.16);
                            border-radius:8px; padding:5px 9px;
                            font-size:.72rem; font-weight:600; white-space:nowrap;
                            box-shadow:0 5px 18px rgba(2,6,23,.6); }
  .leaflet-tooltip.pin-tip::before{ border-top-color:#0f172a; }
  .pin-tip .tip-photos{ color:#f9a8d4; }
  .pin-tip .tip-more,
  .pin-tip .tip-hint{ opacity:.6; font-weight:500; }
  .dash{ width:16px; height:0; border-top:2.5px dashed #000000; flex:none; }
  .dash-inferred{ border-top-color:#94a3b8; }
  .dash-photo-walk{ border-top-style:dotted; }

  .section-label{ font-size:.68rem; color:#94a3b8; font-weight:600;
                  text-transform:uppercase; letter-spacing:.05em; margin:0 0 6px; }

  /* ---------- Buttons ---------- */
  .btn-row{ display:flex; flex-wrap:wrap; gap:5px; margin-bottom:12px; }
  .btn{ background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1);
        color:#cbd5e1; padding:5px 9px; border-radius:7px; font-size:.7rem;
        cursor:pointer; transition:all .15s ease; font-weight:500;
        display:inline-flex; align-items:center; gap:5px; }
  .btn:hover{ background:rgba(255,255,255,.12); color:#f1f5f9; }
  .btn.active{ background:#0284c7; border-color:#38bdf8; color:#fff; font-weight:600; }
  .btn .swatch{ width:10px; height:10px; border-radius:3px; flex:none; }
  /* Same size as the day label beside it - no font-size of its own, so it
     inherits the button's. The distance is half of what a day chip says, not
     a footnote to it. Still dimmed, so the day label stays the thing you
     read first. */
  .btn .km{ opacity:.65; }

  /* A switch, not a row of buttons: the segments are butted together with a
     single shared border so they read as one control with a side selected.
     Used for the two settings that have a small fixed set of answers - the
     distance unit and the basemap. */
  .segmented{ gap:0; flex-wrap:nowrap; }
  .segmented .btn{ border-radius:0; padding:4px 12px; border-left:none;
                   white-space:nowrap; }
  .segmented .btn:first-child{ border-left:1px solid rgba(255,255,255,.1);
                               border-top-left-radius:7px;
                               border-bottom-left-radius:7px; }
  .segmented .btn:last-child{ border-top-right-radius:7px;
                              border-bottom-right-radius:7px; }

  /* One line at the top of the card for the two settings that govern the
     whole of it: whether photos are on the map, and what every distance is
     counted in. Sharing a line keeps the card short and puts the unit above
     the big numbers it changes. */
  .settings-row{ display:flex; align-items:center; gap:8px;
                 margin:14px 0 0; }
  .settings-row .btn-row{ margin-bottom:0; }
  .settings-row .unit-row{ margin-left:auto; }

  .toggle-note{ font-size:.66rem; color:#64748b; line-height:1.45; margin-top:-6px;
                margin-bottom:12px; }

  /* ---------- Map pins ---------- */
  .pin{ border-radius:20px; padding:3px 9px; font-size:.7rem; font-weight:700;
        white-space:nowrap; display:flex; align-items:center; gap:5px; cursor:pointer; }
  /* Long names must not run off a narrow screen; the full text is in the popup. */
  .pin .pin-name{ overflow:hidden; text-overflow:ellipsis; max-width:30vw;
                  display:inline-flex; align-items:center; gap:4px; }
  /* Same flat vector glyph as the compact badge, just shrunk - keeps the icon
     consistent across the zoom threshold instead of swapping to emoji. */
  .pin-name svg{ width:13px; height:13px; flex:none; }
  .pin-night{ background:#1e3a8a; border:2px solid #60a5fa; color:#eff6ff;
              box-shadow:0 4px 14px rgba(59,130,246,.4); }
  .pin-hike{ background:#022c22; border:2px solid #10b981; color:#ecfdf5;
             box-shadow:0 4px 14px rgba(16,185,129,.4); }
  .pin-long{ background:#334155; border:2px solid #94a3b8; color:#f1f5f9;
             box-shadow:0 4px 10px rgba(100,116,139,.35); }
  .badge{ padding:1px 6px; border-radius:9px; font-size:.62rem; font-weight:700; }
  .badge-night{ background:#1d4ed8; color:#dbeafe; }
  .badge-hike{ background:#047857; color:#d1fae5; }
  .badge-long{ background:#475569; color:#e2e8f0; }

  /* Zoom-dependent compact marker: icon only, no text, shown when zoomed out
     past ICON_ZOOM_THRESHOLD so it stays legible at trip-overview scale
     instead of shrinking into unreadable text. Flat single-color vector
     shapes rather than emoji - an emoji is a tiny detailed illustration and
     degrades to mush well before it's small enough to need this treatment.

     A "map pin" teardrop, not a plain circle, and each kind leans a
     different direction (night down-left, hike straight down, long
     down-right - see JS's COMPACT_ANCHOR for the exact tip position each
     produces). Two reasons: a photo-cluster pin is also a circle, so a
     same-shape stop pin at the same coordinate used to be visually and
     spatially indistinguishable from it - the teardrop's body sits beside/
     above the point instead of centered on it, while the photo pin stays
     centered, so the two no longer occupy the same clickable area. Leaning
     each kind a different way does the same, partially, for two DIFFERENT
     stop kinds landing on one exact coordinate (rarer, and only partially
     solved: all three still lean within 45 degrees either side of straight
     down to stay recognizable as pins, so their bodies share the same
     general "above the point" side).

     Built from a rotated rounded square (a well-known CSS-only pin shape -
     border-radius 50% on three corners, square on the fourth, then
     rotated) rather than a real teardrop SVG path, so the shape needs no
     new asset and the existing per-kind glyphs/colors carry over
     unchanged. The icon overlay is a SEPARATE, unrotated element centered
     on the square's own center, so the glyph itself always stays upright
     regardless of which way the teardrop leans. */
  .pin-compact-wrap{ position:relative; width:60px; height:60px; cursor:pointer; }
  .pin-compact{ position:absolute; left:11px; top:11px; width:38px; height:38px;
                border-radius:50% 50% 50% 0; box-sizing:border-box; }
  /* Border thinned from 4px to 3px and the coloured glow replaced with a
     plain drop shadow. The glow was the real source of visual noise: in a
     crowded area a dozen of them merged into one pink-and-blue smear that
     read as far busier than the pin count alone. A neutral shadow still
     lifts the pin off the map without tinting its surroundings. */
  .pin-compact.night{ background:#2563eb; border:3px solid #bfdbfe;
                       box-shadow:0 2px 5px rgba(15,23,42,.4);
                       transform:rotate(-15deg); }
  .pin-compact.hike{ background:#059669; border:3px solid #bbf7d0;
                      box-shadow:0 2px 5px rgba(15,23,42,.4);
                      transform:rotate(-45deg); }
  .pin-compact.long{ background:#475569; border:3px solid #cbd5e1;
                      box-shadow:0 2px 5px rgba(15,23,42,.4);
                      transform:rotate(-75deg); }
  /* Selected photo mark - the one whose photos the column is showing. */
  .pin-photo-mark.selected .photo-chip{ background:#9d174d; border-color:#fff;
                       box-shadow:0 0 0 3px rgba(244,114,182,.4),
                                  0 3px 10px rgba(15,23,42,.5); }
  /* The pin whose photos the column is currently showing. */
  .pin-compact.photo.selected{ background:#be185d; border-color:#fff;
                       box-shadow:0 0 0 3px rgba(244,114,182,.4),
                                  0 3px 10px rgba(15,23,42,.5); }
  .pin-compact-icon{ position:absolute; left:0; top:0; width:60px; height:60px;
                      display:flex; align-items:center; justify-content:center; }
  /* Deliberately NOT scaled with the teardrop: the glyph is the thing that
     says what kind of place this is, so it keeps its full size while the
     surrounding shape grew. */
  .pin-compact-icon svg{ width:26px; height:26px; display:block; }

  /* THE photo mark. One chip - camera plus a count - is the only thing on the
     whole map that ever means "photos", and it is the same element whether it
     is riding on a place pin or standing on its own.

     It used to be two different things: a bare number badge on a place pin,
     and a camera-glyph teardrop where there was no place. That taught the
     reader two encodings for one idea, and the camera pin said "photos" twice
     over - once with its glyph and again with the badge it also carried. */
  .photo-chip{ display:inline-flex; align-items:center; gap:3px; height:20px;
               padding:0 6px 0 4px; border-radius:10px; box-sizing:border-box;
               background:#be185d; border:2px solid #fce7f3; color:#fff;
               font-size:10px; font-weight:800; line-height:1;
               box-shadow:0 1px 4px rgba(15,23,42,.45); }
  .photo-chip svg{ width:11px; height:11px; display:block; }
  /* Riding on a place pin's shoulder. */
  .pin-compact-wrap .photo-chip{ position:absolute; top:0; right:-5px; }

  /* Standing alone, where photos exist but no stop was ever recorded. The
     stem and foot are what keep it a MAP MARK rather than a floating label -
     the foot is the spot, and it is what Leaflet anchors to. */
  .pin-photo-mark{ position:relative; width:64px; height:46px; cursor:pointer; }
  .pin-photo-mark .photo-chip{ position:absolute; left:50%; top:0;
                               transform:translateX(-50%); }
  .pin-photo-mark .stem{ position:absolute; left:50%; top:19px; width:2px; height:16px;
                         background:#be185d; transform:translateX(-50%); }
  .pin-photo-mark .foot{ position:absolute; left:50%; top:34px; width:8px; height:8px;
                         border-radius:50%; background:#be185d; border:2px solid #fce7f3;
                         box-sizing:border-box; transform:translateX(-50%); }

  /* ---- The shape language ----------------------------------------------
     EVERY pin is a teardrop. Nothing on the map is a circle, so there is one
     shape to learn and grouping never changes it.

     GLYPH says what the place is:
       house    slept here        mountain  walked here
       star     stopped a while   camera    only photos, nothing recorded

     MAGENTA BADGE is the only number anywhere on the map, and it always
     counts photos. Never two numbers on one pin.

     When pins merge, they merge SILENTLY - the survivor is whichever glyph
     ranks highest (see PIN_MERGE_PRIORITY), and no count is shown for the
     places folded in. Two hotels becoming one house pin is not information
     worth a number; the reader zooms in to separate them. Photos rank last
     and always disappear into a real place when one is near enough, which
     is why a house pin so often carries a photo count. */

  /* ---------- Photo column ---------- */
  /* Desktop: a permanent right-hand column beside the map. Mobile: the same
     markup promoted to a full-screen overlay (see the media query below). */
  .photo-panel{
    position:absolute; top:0; right:0; bottom:0; width:var(--photo-panel-width);
    z-index:1200; background:#0b1220; border-left:1px solid rgba(255,255,255,.12);
    display:flex; flex-direction:column; overflow:hidden;
  }
  .photo-panel[hidden]{ display:none; }

  /* Desktop-only drag handle, positioned from the viewport's right edge (not
     nested inside .photo-panel, which clips overflow - it would cut off
     everything this handle draws past the panel's own left border). Sits
     with its right edge 8px inside the panel and its left edge 24px out over
     the map, so the hit box fully contains the visible knob below - the
     whole knob is grabbable, not just a hairline border. Hidden together with
     the panel via the adjacent-sibling rule in the mobile query and below. */
  .panel-resize-handle{
    position:absolute; top:0; bottom:0;
    right:calc(var(--photo-panel-width) - 8px); width:32px; z-index:1300;
    cursor:col-resize; background:transparent;
  }
  #photoPanel[hidden] ~ .panel-resize-handle{ display:none; }
  /* The knob itself: a half-oval tab, flat where it meets the panel border
     (right edge, no radius) and rounded into a bulge on the map side (left
     edge, fully rounded) - like a tab growing out of the panel rather than a
     capsule floating over it. Solid (not translucent), visible at rest. */
  .resize-knob{
    position:absolute; top:50%; right:8px; transform:translateY(-50%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:7px;
    width:18px; height:60px;
    border-top-left-radius:999px; border-bottom-left-radius:999px;
    border-top-right-radius:0; border-bottom-right-radius:0;
    background:#0b1220; border:1px solid rgba(255,255,255,.12); border-right:none;
    box-shadow:0 3px 14px rgba(0,0,0,.55);
    pointer-events:none;
  }
  /* Same color as the border, not a standalone accent - the dots are a
     texture on the knob's own outline, not a separate colored feature. */
  .resize-knob span{ width:4px; height:4px; border-radius:50%;
                      background:rgba(255,255,255,.12); flex:none; }
  .panel-resize-handle:hover .resize-knob, .panel-resize-handle.dragging .resize-knob{
    background:#0284c7; border-color:#7dd3fc;
    box-shadow:0 3px 16px rgba(2,132,199,.65), 0 0 0 4px rgba(125,211,252,.25);
  }
  .panel-resize-handle:hover .resize-knob span, .panel-resize-handle.dragging .resize-knob span{
    background:#7dd3fc;
  }

  /* Mobile-only; the desktop column shows position via the "3 / 11" counter
     and the highlighted thumbnail instead. */
  .progress-track{ display:none; }
  .mobile-only{ display:none !important; }
  @media (max-width:767px), (max-height:500px){ .mobile-only{ display:flex !important; } }

  /* Takes whatever the lower block (place name + thumbnails) leaves behind.
     flex-basis 0, not auto: with auto the viewer asks for the photo's own
     full height - hundreds of pixels more than the panel has - and the two
     blocks then shrink against each other in proportion, which squeezed the
     thumbnails below their content height even when the panel had room to
     spare. With a zero basis the viewer claims nothing of its own and simply
     grows into the leftover, so the split is decided by the block below.

     This line and the flex-shrink:0 on .photo-panel-lower are one fix, not
     two: reverting either alone changes nothing, and reverting both brings
     the bug straight back (measured - 157px of a 277px strip shown, in a
     panel where the block was at 31% of its own 50% ceiling). Change them
     together or not at all. viz/test_trip_map_page.py measures this. */
  .viewer{ position:relative; flex:1 1 0; min-height:0; background:#060b14;
           display:flex; align-items:center; justify-content:center; overflow:hidden; }
  /* Default to contain (letterboxed, nothing cropped) - updateImageFit() in
     the script below switches this to cover (full bleed) only when the photo
     and the viewer box are nearly the same shape, so no photo ever loses more
     than a sliver of itself to the crop. */
  .viewer img{ width:100%; height:100%; object-fit:contain; display:block; }
  .viewer-empty{ color:#475569; font-size:.78rem; padding:20px; text-align:center; }
  .viewer-count{ position:absolute; top:10px; left:12px; z-index:2;
                 background:rgba(2,6,23,.72); color:#e2e8f0; font-size:.68rem;
                 font-weight:700; padding:3px 9px; border-radius:20px; }
  /* A scrim, not just a text-shadow: the caption sits on whatever the photo
     happens to be, and shadowed grey on a bright busy image is unreadable. */
  .viewer-caption{ position:absolute; bottom:0; left:0; right:0; z-index:2;
                   padding:18px 12px 8px;
                   background:linear-gradient(transparent, rgba(2,6,23,.85));
                   font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
                   font-size:.66rem; color:#cbd5e1;
                   overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .viewer-caption[hidden]{ display:none; }
  .viewer-nav{ position:absolute; top:10px; right:12px; z-index:2; display:flex;
               gap:8px; align-items:center; }
  /* :not(.place-step) matters - the full-screen copy of the location control
     sits in this bar too, and this rule would otherwise squeeze its label into
     a 38px square and spill it over the buttons beside it. */
  .viewer-nav button:not(.place-step){
    background:rgba(2,6,23,.72); color:#e2e8f0; border:1px solid rgba(255,255,255,.16);
    border-radius:8px; width:38px; height:38px; cursor:pointer; font-size:1.1rem;
    display:flex; align-items:center; justify-content:center; }
  .viewer-nav button:not(.place-step):hover{ background:#1e293b; }
  .viewer-nav button:not(.place-step):disabled{ opacity:.3; cursor:default; }

  /* Moving between LOCATIONS, as against moving between the photos of one.
     Deliberately a different shape from the square photo buttons above: those
     two jobs used to share one style and one pair of arrows, and readers
     could not tell which pair did what. A thin ring with a word in it is
     light enough not to shout and still plainly a control. The back step
     carries no word - the labelled one beside it says what the pair is for. */
  .place-step{
    background:none; border:1px solid rgba(255,255,255,.18); border-radius:999px;
    color:#cbd5e1; height:30px; padding:0 12px; cursor:pointer;
    font-size:.76rem; font-weight:600; white-space:nowrap;
    display:inline-flex; align-items:center; justify-content:center;
    transition:border-color .15s ease, color .15s ease; }
  .place-step.icon{ width:30px; padding:0; font-size:1rem; }
  .place-step:hover:not(:disabled){ border-color:rgba(255,255,255,.45); color:#f1f5f9; }
  .place-step:disabled{ opacity:.32; cursor:default; }
  /* The copy in the bar over the photo. It exists only for full screen, where
     the block holding the real one is hidden, so it stays out of the way
     everywhere else. */
  #nextPlaceMaximized{ display:none; background:rgba(2,6,23,.72); height:38px; }

  /* One-time overlay teaching the swipe gestures, shown over the photo the
     first time the mobile viewer opens (see maybeShowGestureHint). Sits above
     the caption/nav (z-index 2) so it fully covers the photo while shown. */
  .gesture-hint{ position:absolute; inset:0; z-index:3; display:flex;
                 align-items:center; justify-content:center; text-align:center;
                 padding:24px; background:rgba(2,6,23,.78);
                 color:#f1f5f9; font-size:.8rem; line-height:1.7; }
  .gesture-hint[hidden]{ display:none; }

  /* Sizes to its own content (place name + however many thumbnail rows fit)
     rather than claiming a fixed share of the panel, so the viewer above
     gets whatever's left over - but caps at half the panel's height for a
     place with a lot of photos, so the thumbnail strip alone never crowds
     the photo out. Shrinking is off, so the only thing that can hold this
     block below the height its rows need is that 50% ceiling - never the
     photo above competing for the same pixels. Paired with the flex-basis:0
     on .viewer above - see the note there before changing either. */
  .photo-panel-lower{ display:flex; flex-direction:column; flex:0 0 auto;
                       max-height:50%; min-height:0; overflow:hidden; }
  .place-head{ flex:none; padding:12px 14px 11px; border-bottom:1px solid rgba(255,255,255,.08); }
  .place-head-row{ display:flex; align-items:center; justify-content:space-between;
                   gap:10px; margin-top:5px; }
  .place-name{ font-size:1.25rem; font-weight:800; color:#f8fafc;
               overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .place-sub{ font-size:.85rem; color:#94a3b8; min-width:0;
              overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* The date leads the line it shares with the photo count, so it is a shade
     brighter than the count behind it. */
  .place-sub .when{ color:#cbd5e1; font-weight:600; }
  .place-nav{ display:flex; gap:6px; flex:none; }

  /* align-content:start matters here: this grid's implicit rows default to
     'auto' sizing, and a plain grid container taller than its content
     stretches 'auto' rows equally to fill that height (align-content:normal
     computes to stretch for a grid) - without this, each row of thumbnails
     ends up padded with a lot of extra vertical space instead of packing
     tightly against the row above it. */
  .thumb-grid{ flex:1; min-height:0; overflow-y:auto; padding:10px 14px 16px;
               display:grid; grid-template-columns:repeat(auto-fill, minmax(76px, 1fr));
               align-content:start; gap:6px; }
  .thumb-grid img{ width:100%; aspect-ratio:1; object-fit:cover; border-radius:6px;
                   border:2px solid transparent; cursor:pointer; display:block;
                   background:#111c30; }
  .thumb-grid img.current{ border-color:#f472b6; }

  /* "5 of 5 places in view" - the column follows the map, so this says how
     much of the trip the current viewport is actually offering. */
  .in-view-chip{ position:absolute; left:14px; bottom:14px; z-index:1000;
                 background:rgba(15,23,42,.9); border:1px solid rgba(255,255,255,.14);
                 color:#94a3b8; font-size:.68rem; padding:6px 11px; border-radius:20px; }
  .in-view-chip[hidden]{ display:none; }

  /* ---------- Popups ---------- */
  .leaflet-popup-content-wrapper{ background:#1e293b; color:#f8fafc; border-radius:10px;
      box-shadow:0 12px 24px rgba(0,0,0,.5); border:1px solid rgba(255,255,255,.12); }
  .leaflet-popup-content{ margin:12px 14px; font-size:.78rem; line-height:1.5; }
  .leaflet-popup-tip{ background:#1e293b; }
  .leaflet-popup-close-button{ color:#94a3b8 !important; }
  .pop-title{ font-weight:800; font-size:.92rem; margin-bottom:4px; }

  .pop-long{ color:#94a3b8; }  .pop-plain{ color:#38bdf8; }
  .pop-photo{ color:#f472b6; }
  .pop-badge{ display:inline-block; padding:2px 7px; border-radius:5px; font-size:.66rem;
              font-weight:700; margin-bottom:7px; }
  .pop-sub{ color:#94a3b8; font-size:.72rem; margin-bottom:6px; }
  .pop-row{ font-size:.74rem; color:#cbd5e1; }
  .pop-desc{ font-size:.73rem; color:#cbd5e1; border-top:1px solid rgba(255,255,255,.08);
             padding-top:7px; margin-top:7px; }
  .pop-link{ color:#38bdf8; text-decoration:none; font-weight:600;
             display:inline-block; margin-top:5px; }
  .pop-warn{ color:#fca5a5; font-size:.68rem; margin-top:5px; }
  .prov{ color:#475569; font-size:.64rem; margin-top:6px; font-style:italic; }

  .leaflet-control-attribution{ background:rgba(15,23,42,.82) !important; color:#64748b !important;
      font-size:.62rem !important; }
  .leaflet-control-attribution a{ color:#94a3b8 !important; }

  /* ---------- Road-reconstruction notice ---------- */
  /* Shown only when viz/snap_route_gaps.py couldn't reach OSRM (or found no
     route) for at least one recording gap, so it fell back to the straight
     line between the gap's two endpoints - the exact behaviour this notice
     exists to make visible rather than silently indistinguishable from a
     genuine road-routed dashed segment.

     The same sentence has two forms, and exactly one is on screen at a time:
     .gap-note sits inside the control card on a wide screen, where a strip
     floating over the map is easy to read past; .gap-banner floats at the
     foot of a phone screen, where the card is shut by default and anything
     inside it would go unseen. JS fills both and marks both `show`; the
     breakpoint below decides which one that actually displays. */
  .gap-note{
    display:none; flex:none; position:relative; margin:0 16px 13px;
    background:rgba(120,53,15,.9);
    border:1px solid rgba(251,191,36,.55); border-radius:10px;
    padding:11px 34px 11px 13px;  /* room on the right for the close button */
    font-size:.73rem; line-height:1.45; color:#fef3c7;
  }
  .gap-note.show{ display:block; }
  /* The lead sentence gets its own line and a size of its own: in the card
     this notice competes with a title, a stats row and four button groups,
     and a bold run inside a paragraph loses that competition. */
  .gap-note b{ display:block; margin-bottom:4px; color:#fde68a;
               font-size:.82rem; letter-spacing:.01em; }

  .gap-banner{
    display:none; position:absolute; z-index:1000;
    bottom:max(14px, env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    max-width:min(560px, calc(100vw - 28px));
    background:rgba(120,53,15,.92); backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(251,191,36,.5); border-radius:10px;
    padding:9px 14px; font-size:.74rem; line-height:1.4; color:#fef3c7;
    box-shadow:0 10px 24px -6px rgba(0,0,0,.55); text-align:center;
  }
  .gap-banner b{ color:#fde68a; }

  /* One button style for both forms of the notice. Either one dismisses the
     notice for the rest of the page view - see dismissNotice() below. */
  .notice-close{
    position:absolute; top:4px; right:4px;
    /* 30px of tappable box around a 13px glyph: the text runs right up to it,
       so a thumb aimed at the cross must not land on a word instead. */
    width:30px; height:30px; padding:0; border:none; border-radius:8px;
    background:transparent; color:#fcd9a4; font-size:.82rem; line-height:1;
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .notice-close:hover{ background:rgba(251,191,36,.18); color:#fef3c7; }

  /* ---------- Mobile ---------- */
  /* Height as well as width: a phone turned landscape is ~812x375, which is
     "wide" by any width-only test but has nowhere near the vertical room for
     a side-by-side column. Rotating to see a landscape photo bigger is the
     whole point of the full-screen viewer, so it has to survive the turn. */
  @media (max-width:767px), (max-height:500px){
    /* The map keeps the whole window; the photo column stops being a column
       and becomes a full-screen overlay opened by tapping a pin. */
    #map{ right:0; }
    .panel-resize-handle{ display:none; }
    .photo-panel{
      width:100%; border-left:none; z-index:1400;
      /* dvh, not vh: on iOS Safari `vh` is the tallest-possible viewport, so
         a 100vh overlay hides its own bottom controls behind the address bar
         until the reader scrolls. dvh tracks the bar as it shows and hides. */
      height:100dvh;
      padding-top:env(safe-area-inset-top);
      padding-bottom:env(safe-area-inset-bottom);
    }
    /* No .viewer override here: the base rule already gives it everything
       the fixed chrome leaves behind, portrait or landscape, which is what
       makes rotating the phone worth doing. It used to repeat that rule with
       flex-basis:auto, which is the very thing that made the photo and the
       thumbnails fight each other for height. */

    /* No max-height of its own here any more. It used to be capped at 22vh,
       which on a tall phone is about two rows - so a place with a dozen
       photos scrolled even though the panel had plenty of unused height.
       The strip now grows to fit its rows and is limited only by the 50%
       ceiling on the block around it, so on a tall screen it usually needs
       no scrolling at all. */
    .thumb-grid{ grid-template-columns:repeat(auto-fill, minmax(64px, 1fr)); }
    .in-view-chip{ display:none; }

    /* Maximized: hide everything but the photo itself (and its overlaid nav/
       caption), so the flex:1 viewer above takes the whole panel height. */
    .photo-panel.maximized .place-head,
    .photo-panel.maximized .thumb-grid,
    .photo-panel.maximized .progress-track{ display:none; }
    /* ...and the one control that must not go with it reappears up here. */
    .photo-panel.maximized #nextPlaceMaximized{ display:inline-flex; }

    /* Story-style segmented progress: one bar per photo in this place, so
       position within the batch is readable without counting thumbnails. */
    .progress-track{ display:flex; gap:3px; padding:8px 12px 4px; }
    .progress-seg{ flex:1; height:3px; border-radius:2px; background:rgba(255,255,255,.22); }
    .progress-seg.done{ background:#f472b6; }

    .panel{ left:10px; width:calc(100vw - 20px); top:max(10px, env(safe-area-inset-top)); }
    .panel-head{ padding:11px 13px; }
    .title{ font-size:.95rem; }
    .panel-body{ padding:0 13px 13px; }
    .mini{ padding:0 13px 10px; }
    .stat-val{ font-size:.95rem; }
    .btn{ padding:6px 10px; font-size:.72rem; }   /* larger touch targets */
    .segmented .btn{ padding:6px 10px; }          /* ...the segments too */
    .pin{ font-size:.66rem; padding:2px 7px; }
    .pin .pin-name{ max-width:44vw; }

    /* The card is shut on a phone, so the in-card form of the notice would be
       behind a tap. The floating one takes over here instead. */
    .gap-note.show{ display:none; }
    .gap-banner.show{ display:block; }
    /* A fixed width, not the shrink-to-fit the base rule leaves it with: an
       absolutely positioned box with `left:50%` and no `right` may only use
       the half of the screen to the right of that edge, so the notice was
       laid out into half a phone screen and wrapped into a narrow column. */
    .gap-banner{
      /* 88% of the screen on a phone held upright; the cap only bites when a
         phone is turned sideways, where 88% would be a 700px-wide strip of
         one-line text across a 375px-tall screen. */
      width:88vw; max-width:560px;
      padding:9px 34px 10px 14px;   /* room on the right for the close button */
      font-size:.72rem;
      /* Clear of the map's own bottom-right controls. The zoom buttons
         reach 88px up from the foot of the map (a 10px margin, the 14px
         attribution strip, then two 32px buttons); at 88% width the notice
         would otherwise cover them, and the reader would have no way to
         zoom out from under it. */
      bottom:calc(96px + env(safe-area-inset-bottom));
    }
  }

  /* A phone held sideways has only ~375px of height in total. Letting the
     place name and thumbnails take half of that would leave the photo a
     slit - and seeing the photo bigger is the entire reason for turning the
     phone. So the lower block gets a smaller share when there is little
     height to share, and the thumbnails scroll instead. The 50% above still
     applies everywhere with real vertical room. */
  @media (max-height:500px){
    .photo-panel-lower{ max-height:38%; }
  }

  <div class="gap-note" id="gapNote">
    <button class="notice-close" id="gapNoteClose" type="button"
            aria-label="Hide this notice" title="Hide this notice">✕</button>

  <div class="panel-body" id="panelBody">

    <div class="toggle-note" id="hikeNote"></div>

    <div class="section-label">Basemap</div>
    <div class="btn-row segmented" id="baseToggle"></div>

    <!-- Last in the card: two settings for the whole page, kept together on
         one line and out of the labelled sections above, which are all about
         what the map shows rather than how it is shown. -->
    <div class="settings-row">
      <div class="btn-row" id="photoToggle"></div>
      <div class="btn-row segmented unit-row" id="unitToggle"></div>
    </div>
  </div>
</div>

<div id="map"></div>

<div class="in-view-chip" id="inViewChip" hidden></div>

<!-- Present only when the trip was built with --photo-dir; JS leaves it
     hidden and the map full-width otherwise, so a photo-less map is exactly
     the single self-contained file it was before photos existed. -->
<aside class="photo-panel" id="photoPanel" hidden>
  <div class="progress-track" id="progressTrack"></div>

  <div class="viewer" id="viewer">
    <div class="viewer-count" id="viewerCount"></div>
    <div class="viewer-nav">
      <button id="prevPhoto" type="button" title="Previous photo (left arrow)">‹</button>
      <button id="nextPhoto" type="button" title="Next photo (right arrow)">›</button>
      <button id="nextPlaceMaximized" type="button" class="place-step"
              title="Next location">Next location ›</button>
      <button id="maximizeToggle" type="button" class="mobile-only" title="Maximize photo">⤢</button>
      <button id="closeViewer" type="button" title="Close photo panel">✕</button>
    </div>
    <img id="viewerImage" alt="">
    <div class="viewer-caption" id="viewerCaption"></div>
    <!-- The gestures this viewer answers to, one line each. A browser test
         checks every line against the code that implements it, so a gesture
         cannot be changed or dropped without this card being updated too. -->
    <div class="gesture-hint" id="gestureHint" hidden>
      <div><span data-gesture="swipe-sideways">⟵ ⟶&nbsp; swipe sideways for the next photo</span><br>
           <span data-gesture="swipe-up">⇧&nbsp;swipe up for the next location</span><br>
           <span data-gesture="tap-photo">Tap the photo to maximize it</span><br>
           <span style="opacity:.7">(tap anywhere to dismiss)</span></div>
    </div>
  </div>

  <div class="photo-panel-lower">
    <div class="place-head">
      <!-- The name gets a row to itself: the longest real one runs to 42
           characters and is cut even with the whole width. -->
      <div class="place-name" id="placeName"></div>
      <div class="place-head-row">
        <div class="place-sub" id="placeSub"></div>
        <div class="place-nav">
          <button id="prevPlace" type="button" class="place-step icon"
                  title="Previous location">‹</button>
          <button id="nextPlace" type="button" class="place-step"
                  title="Next location">Next location ›</button>
        </div>
      </div>
    </div>

    <div class="thumb-grid" id="thumbGrid"></div>
  </div>
</aside>

<!-- A sibling of the panel, not a child - the panel has overflow:hidden (it
     clips long captions/thumbnails), which would clip this handle wherever it
     protrudes past the panel's own left edge. Hidden together with the panel
     via the adjacent-sibling rule below instead of relying on markup nesting. -->
<div class="panel-resize-handle" id="panelResizeHandle" title="Drag to resize, double-click to maximize">
  <div class="resize-knob" aria-hidden="true">
    <span></span><span></span><span></span>
  </div>
</div>

<div class="gap-banner" id="gapBanner">
  <button class="notice-close" id="gapBannerClose" type="button"

  <span id="gapBannerText"></span>
</div>

/* ------------------------------------------------------------------ utils */
const M = TRIP.meta || {};
const S = TRIP.stats || {};
// Built by viz/extract_photo_trip.py from photos alone: there is no recorded
// track, and no stop, night or hike behind any readout. The page drops the
// controls and figures a photo cannot fill rather than showing them as zeros.
const PHOTOS_ONLY = !!M.photos_only;
// ?debug=1 on the end of the address puts the details that only help when
// working on the page itself back on screen. Today that is one thing: the
// photo's file name and full capture time, under the picture.
const IS_DEBUG = /(^|[?&])debug=1(&|$)/.test(location.search);
// Changed at runtime by the "Distance units" buttons, so these are let, not
// const. The starting value is whatever the page was built with: extract_trip.py
// takes --units and defaults it to km, so a trip built normally opens in km.
// Every distance on the page goes through dist()/distUnit, which is what makes
// one variable enough to switch the whole page over.
let IMPERIAL = M.units === 'mi';
let distUnit = IMPERIAL ? 'mi' : 'km';
const dist = km => IMPERIAL ? (km * 0.621371) : km;
const fmtDist = km => {
  const v = dist(km);
  return (v >= 100 ? Math.round(v) : v.toFixed(1)).toLocaleString();
};
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gmaps = (lat, lng) =>
  `<a class="pin-link pop-link" target="_blank" rel="noopener"
      href="https://www.google.com/maps?q=${lat},${lng}">📍 Open in Google Maps ↗</a>`;

const nameOf = o => o.label || o.db_name || o.place_name || 'Unnamed stop';
const dayColor = d => (TRIP.days.find(x => x.date === d) || {}).color || '#38bdf8';

/* ------------------------------------------------------------------- map */
const map = L.map('map', { zoomControl:false, preferCanvas:true }).setView([43, -74], 7);

// Draw order for map pins, LOWEST first: a pin type listed later always
// covers one listed earlier at the same coordinate, regardless of latitude.
// Before panes existed, Leaflet's default was "whichever marker is further
// south wins" (its z-index is literally the marker's screen y), which
// silently flipped between rebuilds whenever a photo cluster's centroid
// moved. Reorder this array to change the priority; nothing else reads it.
const PIN_DRAW_ORDER = ['photo', 'long', 'hike', 'night'];
// Leaflet's own markerPane is z-index 600 and popupPane 700, so these sit
// strictly between the two - every pin still draws under an open popup.
PIN_DRAW_ORDER.forEach((kind, index) => {
  map.createPane(`pins-${kind}`).style.zIndex = 601 + index;
});

L.control.zoom({ position:'bottomright' }).addTo(map);
// Kept in a variable because L.control.scale fixes its units at construction:
// switching to miles means removing this control and adding a new one, not
// changing an option on it.
let scaleControl = L.control.scale(
  { position:'bottomleft', imperial:IMPERIAL, metric:!IMPERIAL }).addTo(map);

/* Basemaps must work from a file:// page with no Referer, because that is how
   a shared copy gets opened out of an email attachment. CARTO's Voyager tiles
   (used by the design this page follows) fail that test - without an API key
   they come back stamped "API KEY REQUIRED", at 1x as well as @2x - so the
   look is reproduced with key-free providers instead. */
const BASEMAPS = {
  Map: L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:'&copy; OpenStreetMap contributors', maxZoom:19 }),
  Muted: L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
    attribution:'Tiles &copy; Esri, HERE, Garmin, &copy; OpenStreetMap contributors',
    maxZoom:16 }),
  Terrain: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
    attribution:'&copy; OpenStreetMap contributors, SRTM | &copy; OpenTopoMap (CC-BY-SA)',
    maxZoom:17 }),
  Satellite: L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution:'Imagery &copy; Esri, Maxar, Earthstar Geographics', maxZoom:19 })
};
let activeBase = BASEMAPS.Map.addTo(map);

const routeLayer   = L.layerGroup().addTo(map);
const walkLayer    = L.layerGroup().addTo(map);
// Short-stop dots only. They are circleMarkers (vector shapes), which
// Leaflet.markercluster does not group - it handles markers alone. That is
// fine: they are small, low-contrast, and were never the crowding problem.
const markerLayer  = L.layerGroup().addTo(map);

// How close two pins must get, ON SCREEN, before they collapse into one
// bubble. Pixels, not metres, which is the whole point: crowding is a
// screen-space problem, so the fixed 300m clustering done at build time by
// viz/attach_photos.py cannot address it. At whole-trip scale that 300m is
// about a THIRD OF ONE PIXEL - measured - so it never merged anything the
// reader could see. This number does, and it is re-evaluated at every zoom.
const PIN_CLUSTER_RADIUS_PIXELS = 64;
// Zoom at which grouping stops entirely and every pin is drawn on its own.
// Chosen well past the point where pins stop colliding (at "one town" scale
// 54 of 84 pins still overlapped; by a few streets it is 28) so that zooming
// in always ends at real pins rather than a bubble that will not open.
const PIN_CLUSTER_OFF_AT_ZOOM = 14;

// Which glyph survives when pins merge, most important first. A night beats
// a hike beats a long stop, and photos always lose: a camera pin only ever
// appears where there is no recorded place to attach it to. That last rule
// is what stops the map showing a photo pin sitting beside the hotel whose
// photos it holds - they become one house pin wearing a photo count.
const PIN_MERGE_PRIORITY = ['night', 'hike', 'long', 'photo'];

// Everything shares ONE group. Two groups would each tidy themselves and
// then collide with each other, which is the whole bug being fixed.
const pinLayer = L.markerClusterGroup({
  maxClusterRadius: PIN_CLUSTER_RADIUS_PIXELS,
  disableClusteringAtZoom: PIN_CLUSTER_OFF_AT_ZOOM,
  iconCreateFunction: pinClusterIcon,
  showCoverageOnHover: false,   // the stock hover polygon fights the route lines
  spiderfyOnMaxZoom: true,      // pins on one exact spot fan out instead of hiding
  // Off. A click on a merged pin used to throw the whole map away and zoom -
  // see the clusterclick handler below for what happens instead.
  zoomToBoundsOnClick: false
}).addTo(map);

/* Clicking a merged pin fans its pins out where they are, at the zoom the
   reader chose, so the next click can land on the one they actually wanted -
   a photo group opens the photo column, a place opens its card. Zooming to do
   the same job moved the map out from under them to answer "what is under
   here", which is the jarring part; the zoom control is still there for
   anyone who wants a closer look, it is just no longer forced on them.

   Idempotent, so it is safe alongside the plugin's own spiderfy at max zoom:
   spiderfy() returns immediately if this cluster is already fanned out. */
pinLayer.on('clusterclick', event => event.layer.spiderfy());

// Rebuilt wholesale by drawMarkers()/drawPhotoClusters(). Kept apart because
// those two run independently - the day filter redraws stops, the photo
// toggle and panel selection redraw photos - and neither may wipe the other.
let stopPinMarkers = [];
let photoPinMarkers = [];

function refreshPinLayer(){
  pinLayer.clearLayers();
  // addLayers (plural) is the plugin's bulk path: it clusters once for the
  // whole batch instead of re-clustering on every single insertion.
  pinLayer.addLayers(stopPinMarkers.concat(photoPinMarkers));
}

/* The markup for one teardrop, shared by every pin on the map: a lone stop,
   a lone photo group, and a merged pin all use this, so they cannot drift
   apart visually. `photoCount` of 0 means no badge at all. */
// The one photo mark, used in both places it can appear.
function photoChipHTML(count){
  return `<span class="photo-chip">${COMPACT_ICONS.photo}${count}</span>`;
}

function teardropHTML(kind, photoCount, extraClass){
  return `<div class="pin-compact-wrap">
            <div class="pin-compact ${kind}${extraClass ? ' ' + extraClass : ''}"></div>
            <div class="pin-compact-icon">${COMPACT_ICONS[kind]}</div>
            ${photoCount ? photoChipHTML(photoCount) : ''}
          </div>`;
}

function teardropIcon(kind, photoCount, extraClass){
  const box = (PIN_GEOMETRY[kind] || PIN_GEOMETRY.long).box;
  return L.divIcon({
    className:'', html: teardropHTML(kind, photoCount, extraClass),
    iconSize:[box, box], iconAnchor:COMPACT_ANCHOR[kind]
  });
}

/* Photos with no recorded place to ride on: the same chip, on a stem, with a
   foot marking the spot. Deliberately lighter than any place pin - at trip
   scale "someone photographed something here" is true almost everywhere and
   earns less ink than "we slept here". */
const PHOTO_MARK_BOX = [64, 46];
const PHOTO_MARK_ANCHOR = [32, 38];   // the foot's centre

function photoMarkIcon(count, extraClass){
  return L.divIcon({
    className:'',
    html:`<div class="pin-photo-mark${extraClass ? ' ' + extraClass : ''}">
            ${photoChipHTML(count)}<div class="stem"></div><div class="foot"></div>
          </div>`,
    iconSize:PHOTO_MARK_BOX, iconAnchor:PHOTO_MARK_ANCHOR
  });
}

/* Tooltips sit above the pin's TIP, which is where Leaflet anchors them, so
   they need lifting clear of the body that stands above it - by nearly the
   whole icon box for a full-size pin, less for a small one. */
function tooltipOptions(kind){
  // The photo mark is shorter than a teardrop, so its card needs less lift.
  const height = kind === 'photo' ? PHOTO_MARK_ANCHOR[1]
                                  : (PIN_GEOMETRY[kind] || PIN_GEOMETRY.long).box - 12;
  return { direction:'top', className:'pin-tip', opacity:1, offset:[0, -height] };
}

// Full state names eat most of a one-line hover card ("Newport, Oregon
// (Stay)"), so they are abbreviated. US-only on purpose - this project's
// data is US - and anything not on the list passes through untouched rather
// than being mangled by a cleverer rule.
const STATE_ABBREVIATIONS = Object.fromEntries(
  ('Alabama:AL,Alaska:AK,Arizona:AZ,Arkansas:AR,California:CA,Colorado:CO,' +
   'Connecticut:CT,Delaware:DE,Florida:FL,Georgia:GA,Hawaii:HI,Idaho:ID,' +
   'Illinois:IL,Indiana:IN,Iowa:IA,Kansas:KS,Kentucky:KY,Louisiana:LA,' +
   'Maine:ME,Maryland:MD,Massachusetts:MA,Michigan:MI,Minnesota:MN,' +
   'Mississippi:MS,Missouri:MO,Montana:MT,Nebraska:NE,Nevada:NV,' +
   'New Hampshire:NH,New Jersey:NJ,New Mexico:NM,New York:NY,' +
   'North Carolina:NC,North Dakota:ND,Ohio:OH,Oklahoma:OK,Oregon:OR,' +
   'Pennsylvania:PA,Rhode Island:RI,South Carolina:SC,South Dakota:SD,' +
   'Tennessee:TN,Texas:TX,Utah:UT,Vermont:VT,Virginia:VA,Washington:WA,' +
   'West Virginia:WV,Wisconsin:WI,Wyoming:WY,District of Columbia:DC'
  ).split(',').map(pair => pair.split(':')));

const TOOLTIP_NAME_MAX_CHARS = 34;

/* "Newport, Oregon, United States (Stay)" -> "Newport, OR (Stay)".
   Keeps the first two comma-separated parts, abbreviates a part that is
   exactly a state name, and preserves a trailing "(Stay)"/"(Hike)" marker,
   which says what KIND of visit this was and is the last thing worth
   dropping. */
function shortPlaceName(name){
  const raw = String(name || '').trim();
  const suffix = raw.match(/\s*(\([^)]*\))\s*$/);
  const body = suffix ? raw.slice(0, suffix.index) : raw;
  const parts = body.split(',').map(part => part.trim()).filter(Boolean)
    .map(part => STATE_ABBREVIATIONS[part] || part);
  let short = parts.slice(0, 2).join(', ');
  if (short.length > TOOLTIP_NAME_MAX_CHARS) {
    short = short.slice(0, TOOLTIP_NAME_MAX_CHARS - 1).trimEnd() + '…';
  }
  return short + (suffix ? ' ' + suffix[1] : '');
}

// The same little pin the legend uses, so the card names the kind with the
// symbol the reader already met rather than repeating it in words.
function tooltipPin(kind){
  // Photos are shown as the chip, because that is what they look like on the
  // map now - there is no photo teardrop to echo.
  if (kind === 'photo') return `<span class="photo-chip tip-chip">${COMPACT_ICONS.photo}</span>`;
  return `<span class="legend-pin ${kind}"><i></i>${COMPACT_ICONS[kind]}</span>`;
}

/* One line: what this is, how many photos, and what clicking does. */
function pinTooltipHTML(kind, name, extraPlaces, photoCount, hint){
  const photoWord = `${photoCount} photo${photoCount === 1 ? '' : 's'}`;
  const bits = [tooltipPin(kind)];
  bits.push(name ? esc(shortPlaceName(name)) : photoWord);
  if (extraPlaces > 0) bits.push(`<span class="tip-more">+${extraPlaces} more</span>`);
  const tail = [];
  // Skipped when the name IS the photo count, so it is never said twice.
  if (photoCount && name) tail.push(`<span class="tip-photos">${photoWord}</span>`);
  if (hint) tail.push(`<span class="tip-hint">${esc(hint)}</span>`);
  return bits.join(' ') + (tail.length ? ' · ' + tail.join(' · ') : '');
}

/* What several merged pins look like: still one teardrop, wearing the glyph
   of whichever kind ranked highest, plus the photo count if any photos went
   into it. No count for the merged PLACES - see the shape-language note in
   the CSS for why silently is the right way to merge them. */
function pinClusterIcon(cluster){
  const byKind = {};
  let photoCount = 0, placeCount = 0;
  cluster.getAllChildMarkers().forEach(marker => {
    const kind = (marker.options.pane || '').replace('pins-', '');
    (byKind[kind] = byKind[kind] || []).push(marker);
    photoCount += marker.photoCount || 0;
    if (kind !== 'photo') placeCount++;
  });
  const winner = PIN_MERGE_PRIORITY.find(kind => byKind[kind]) || 'long';
  // The card names the leading place rather than counting anonymously:
  // "Newport, OR (Stay) +1 more" says more than "2 places".
  const lead = byKind[winner][0];
  cluster.pinTooltip = pinTooltipHTML(
    winner, lead.placeName || '', Math.max(0, placeCount - 1), photoCount,
    'click to separate');
  cluster.pinKind = winner;
  // Photos-only merges get the standing chip; anything with a real place
  // keeps that place's teardrop and wears the chip on its shoulder.
  return winner === 'photo'
    ? photoMarkIcon(photoCount)
    : teardropIcon(winner, photoCount);
}

/* Cluster icons are made and destroyed by the plugin as the reader zooms, so
   their tooltips are bound on first hover rather than up front. */
pinLayer.on('clustermouseover', event => {
  const cluster = event.layer;
  if (!cluster.getTooltip()) {
    cluster.bindTooltip(cluster.pinTooltip || '', tooltipOptions(cluster.pinKind));
  }
  cluster.openTooltip();
});

// Which day the page opens on, from meta.default_day: 'all' draws every day
// at once, 'none' opens with no route drawn and lets the reader pick one. A
// photos-only trip defaults to 'none' - see viz/extract_photo_trip.py.
let currentDay     = M.default_day === 'none' ? 'none' : 'all';
// 'naive' (every stop of at least min_stop_hours) | 'smart' (only those with a
// walking segment recorded beside them). The page opens on the wider rule and
// offers the stricter one, so nothing is hidden before the reader asks for it.
let hikeRule       = 'naive';
let photosVisible  = true;
// Whether the desktop column is currently expanded. Separate from
// photosVisible (pins are drawn as soon as photosVisible is true) - the
// column itself starts collapsed until the reader opens it, same as the
// mobile overlay starts closed until a pin is tapped.
let desktopPanelOpen = false;

/* --------------------------------------------------------------- rendering */
function visibleDays(){
  if (currentDay === 'none') return [];
  return currentDay === 'all' ? TRIP.days : TRIP.days.filter(d => d.date === currentDay);
}
function isHike(stop){
  return isHikeUnder(stop, hikeRule);
}
function isHikeUnder(stop, rule){
  // A recorded walking segment beside the stop outranks anything the map says
  // is standing there. People park at the petrol station and walk from it: one
  // measured hike of 1.8km over 91 minutes was thrown away because the nearest
  // feature to where the car sat was a fuel pump. Only the weaker rule - any
  // long stop, with no walking recorded at all - can be overruled this way.
  if (rule === 'smart') return !!stop.hike_smart;
  return !!stop.hike_naive && (!isServicePlace(stop) || !!stop.hike_smart);
}

/* Places you stop AT rather than walk FROM. An hour at any of these is a meal,
   a tank of fuel, a gate or a gift shop - never a hike, however long it lasted
   and whatever was recorded beside it.

   The category comes from OpenStreetMap, asked at a fine enough zoom to answer
   "what stands here" rather than "which road is this" (see PLACE_ZOOM in
   viz/enrich_stops.py). Whole categories are listed where every member counts
   - anything airside, any shop - and single types where the category is mixed:
   amenity holds both a drive-through and a picnic table.

   Deliberately NOT here: toilets and parking. Both sit at the trailhead of a
   real hike as often as at a services, so refusing those would throw away the
   walks this is meant to protect. */
const SERVICE_PLACE_CATEGORIES = ['aeroway', 'shop', 'building', 'office', 'railway'];
const SERVICE_PLACE_TYPES = [
  'amenity/restaurant', 'amenity/fast_food', 'amenity/cafe', 'amenity/bar',
  'amenity/pub', 'amenity/fuel', 'amenity/charging_station', 'amenity/bank',
  'amenity/pharmacy', 'amenity/hospital', 'amenity/marketplace',
  'amenity/loading_dock', 'amenity/car_wash', 'amenity/bus_station',
  'tourism/museum', 'tourism/hotel', 'tourism/motel', 'tourism/hostel',
  'leisure/fitness_centre', 'place/house', 'highway/motorway',
  'highway/motorway_link', 'highway/services', 'highway/rest_area',
];
function isServicePlace(stop){
  // Both answers OpenStreetMap gave about this spot: what stands here, and
  // which road it is on. Either can be the one that gives it away - a
  // fast-food stop off a motorway came back as a historic marker at the fine
  // zoom, and as the motorway itself at the coarse one.
  return [stop.osm_place_type, stop.osm_type].some(type =>
    type && (SERVICE_PLACE_CATEGORIES.includes(type.split('/')[0])
             || SERVICE_PLACE_TYPES.includes(type)));
}

function drawRoute(){
  routeLayer.clearLayers();
  const bounds = [];
  visibleDays().forEach(day => {
    day.segments.forEach(seg => {
      const latlngs = seg.map(p => [p[0], p[1]]);
      // Dark casing underneath keeps bright day colours legible on any basemap.
      L.polyline(latlngs, { color:'#0f172a', weight:7, opacity:.35,
                            lineJoin:'round', lineCap:'round' }).addTo(routeLayer);
      L.polyline(latlngs, { color:day.color, weight:4, opacity:.95,
                            lineJoin:'round', lineCap:'round' })
        .addTo(routeLayer)
        .bindPopup(`<div class="pop-title pop-plain">${esc(day.label)}</div>
                    <div class="pop-row">${fmtDist(day.distance_km)} ${distUnit} travelled</div>`);
      latlngs.forEach(p => bounds.push(p));
    });

    // Recorded track with no car or bus journey behind it: a ski lift, a
    // subway ride, a walk round a viewpoint. Drawn as the same black track as
    // a hike, because the one thing it must not look like is a drive - the
    // day-coloured road line would put a road up a mountainside.
    (day.not_driven_segments || []).forEach(seg => {
      const latlngs = seg.map(p => [p[0], p[1]]);
      L.polyline(latlngs, { color:'#0f172a', weight:8, opacity:.4 }).addTo(routeLayer);
      L.polyline(latlngs, { color:'#000000', weight:4, opacity:1, dashArray:'8,4,2,4',
                            lineCap:'round' })
        .addTo(routeLayer)
        .bindPopup(`<div class="pop-title pop-plain">${esc(day.label)}</div>
                    <div class="pop-row">No drive was recorded here</div>
                    <div class="pop-desc">Movement the phone recorded while no car
                      or bus journey was logged — on foot, on a lift, on the water
                      or underground. The line is where you were, not a road.</div>`);
      latlngs.forEach(p => bounds.push(p));
    });

    // Stretches the phone never recorded, rebuilt over the real road network
    // (viz/snap_route_gaps.py). Dashed, and thinner than the recorded track,
    // so a reconstructed road is never mistaken for a GPS trace.
    (day.inferred_segments || []).forEach(seg => {
      const latlngs = seg.points.map(p => [p[0], p[1]]);
      L.polyline(latlngs, { color:'#0f172a', weight:6, opacity:.3,
                            lineJoin:'round', lineCap:'round' }).addTo(routeLayer);
      L.polyline(latlngs, { color:day.color, weight:3, opacity:.9, dashArray:'6,7',
                            lineJoin:'round', lineCap:'round' })
        .addTo(routeLayer)
        .bindPopup(`<div class="pop-title pop-plain">${esc(day.label)}</div>
                    <div class="pop-row">No GPS recorded here</div>
                    <div class="pop-row">${seg.is_routed
                      ? `${fmtDist(seg.road_km)} ${distUnit} along roads (reconstructed)`
                      : `${fmtDist(seg.straight_km)} ${distUnit} straight line - no route found`}</div>`);
      latlngs.forEach(p => bounds.push(p));
    });
  });
  return bounds;
}

function drawFlights(){
  // Air legs get a dashed great-circle arc so a flight never looks like a road.
  (TRIP.flights || []).forEach(f => {
    if (currentDay !== 'all' && f.local_date !== currentDay) return;
    const arc = greatCircle([f.from_lat, f.from_lng], [f.to_lat, f.to_lng]);
    L.polyline(arc, { color:'#38bdf8', weight:2.5, opacity:.9, dashArray:'8,7' })
      .addTo(routeLayer)
      .bindPopup(`<div class="pop-title pop-plain">✈️ ${esc(f.from_name)} → ${esc(f.to_name)}</div>
                  <div class="pop-row">${esc(f.start_label)} → ${esc(f.end_label)}</div>
                  <div class="pop-row">${fmtDist(f.km)} ${distUnit}</div>`);
  });
}
function greatCircle(a, b, n = 64){
  const [φ1, λ1] = [a[0]*Math.PI/180, a[1]*Math.PI/180];
  const [φ2, λ2] = [b[0]*Math.PI/180, b[1]*Math.PI/180];
  const d = 2*Math.asin(Math.sqrt(Math.sin((φ2-φ1)/2)**2 +
            Math.cos(φ1)*Math.cos(φ2)*Math.sin((λ2-λ1)/2)**2));
  if (!d) return [a, b];
  const out = [];
  for (let i = 0; i <= n; i++){
    const f = i/n, A = Math.sin((1-f)*d)/Math.sin(d), B = Math.sin(f*d)/Math.sin(d);
    const x = A*Math.cos(φ1)*Math.cos(λ1) + B*Math.cos(φ2)*Math.cos(λ2);
    const y = A*Math.cos(φ1)*Math.sin(λ1) + B*Math.cos(φ2)*Math.sin(λ2);
    const z = A*Math.sin(φ1) + B*Math.sin(φ2);
    out.push([Math.atan2(z, Math.hypot(x,y))*180/Math.PI, Math.atan2(y,x)*180/Math.PI]);
  }
  return out;
}

function drawWalks(){
  walkLayer.clearLayers();
  (TRIP.walks || []).forEach(w => {
    const fromPhotos = w.source === 'photos';
    if (!w.is_hike && !fromPhotos) return;
    if (currentDay !== 'all' && w.local_date !== currentDay) return;
    if (!w.pts || w.pts.length < 2) return;
    L.polyline(w.pts, { color:'#0f172a', weight:8, opacity:.4 }).addTo(walkLayer);
    // A walk rebuilt from photos is dotted rather than dashed, for the same
    // reason a rebuilt road is dashed and a recorded one is not: the reader
    // has to be able to tell what the map recorded from what it worked out.
    L.polyline(w.pts, { color:'#000000', weight:4, opacity:1,
                        dashArray: fromPhotos ? '1,7' : '8,4,2,4',
                        lineCap:'round' })
      .addTo(walkLayer)
      .bindPopup(`
        <div class="pop-title pop-hike">🥾 ${esc(nameOf(w))}</div>
        ${w.sublabel ? `<div class="pop-sub">${esc(w.sublabel)}</div>` : ''}
        <div class="pop-badge badge-hike">On foot · ${fmtDist(w.km)} ${distUnit} · ${w.minutes} min</div>
        <div class="pop-row">${esc(w.day_label)}, ${esc(w.start_label)} – ${esc(w.end_label)}</div>
        <div class="pop-desc">${fromPhotos
          ? `No GPS was recorded here. This line joins ${w.photo_count} photos in the
             order they were taken — too slow and too short to have been driven,
             so it is drawn as a walk rather than sent to a road router.`
          : `Recorded as a walking segment, which is why this
             reads as a hike rather than a rest stop.`}${gmaps(w.pts[0][0], w.pts[0][1])}</div>`);
  });
}

function nightsAt(lat, lng){
  return (TRIP.nights || []).filter(n =>
    Math.abs(n.lat - lat) < 0.005 && Math.abs(n.lng - lng) < 0.005).length;
}

function drawMarkers(){
  markerLayer.clearLayers();
  stopPinMarkers = [];
  const bounds = [];

  (TRIP.stops || []).forEach(stop => {
    if (currentDay !== 'all' && stop.local_date !== currentDay) return;
    bounds.push([stop.lat, stop.lng]);

    const low   = Number(stop.confidence) < 0.5;
    const hike  = isHike(stop);
    const night = stop.is_overnight;
    const long  = !night && !hike && Number(stop.hours) >= (M.min_stop_hours || 1);

    if (night){
      const n = nightsAt(stop.lat, stop.lng) || 1;
      addPin(stop, 'pin-night', 'badge-night', '🏨', `🌙 ${n} night${n>1?'s':''}`,
             'pop-night', `${stop.hours} h`, low);
    } else if (hike){
      addPin(stop, 'pin-hike', 'badge-hike', '🥾', `${stop.hours} h`,
             'pop-hike', `${stop.hours} h stop`, low);
    } else if (long){
      addPin(stop, 'pin-long', 'badge-long', '⏱', `${stop.hours} h`,
             'pop-long', `${stop.hours} h stop`, low);
    } else {
      // Short stops stay as unobtrusive dots so the map does not turn into soup.
      L.circleMarker([stop.lat, stop.lng], {
        radius:4, color:'#0f172a', weight:1.5,
        fillColor:dayColor(stop.local_date), fillOpacity:.95
      }).addTo(markerLayer).bindPopup(popupHTML(stop, 'pop-plain', null, null, low));
    }
  });

  hikeWalksNeedingOwnPin().forEach(w => {
    if (currentDay !== 'all' && w.local_date !== currentDay) return;
    const middle = w.pts[Math.floor(w.pts.length / 2)];
    bounds.push(middle);
    addPin(
      { lat:middle[0], lng:middle[1], db_name:walkPinName(w),
        day_label:w.day_label, start_label:w.start_label, end_label:w.end_label },
      'pin-hike', 'badge-hike', '🥾',
      `${fmtDist(w.km)} ${distUnit}`, 'pop-hike',
      `On foot · ${fmtDist(w.km)} ${distUnit} · ${w.minutes} min`, false
    );
  });
  refreshPinLayer();
  return bounds;
}

/* A hike the phone recorded no stop for has nothing to hang its icon on, so it
   gets one of its own at the middle of the walk. That is the whole reason a
   walk in a place with no reception drew a line and no icon, while a walk
   beside a recorded stop drew both.

   A walk near a stop already flagged as a hike is skipped, so one hike cannot
   sprout a second icon a few hundred metres from the first. */
const WALK_PIN_STOP_RADIUS_METERS = 250;
function hikeWalksNeedingOwnPin(rule){
  const activeRule = rule || hikeRule;
  return (TRIP.walks || []).filter(w => {
    if (!w.is_hike || !w.pts || w.pts.length < 2) return false;
    const middle = w.pts[Math.floor(w.pts.length / 2)];
    // Walking round a terminal or a shopping street is not a hike either, and
    // a walk has no category of its own - so it takes the nearest stop's,
    // within the same range a photo pin borrows a name from.
    const nearest = nearestStop(middle[0], middle[1]);
    if (nearest.stop && nearest.meters <= PHOTO_PLACE_NAME_RADIUS_METERS
        && isServicePlace(nearest.stop)) return false;
    return !(TRIP.stops || []).some(stop =>
      isHikeUnder(stop, activeRule) &&
      metersBetween(middle[0], middle[1], stop.lat, stop.lng) <= WALK_PIN_STOP_RADIUS_METERS);
  });
}

function nearestStop(lat, lng){
  let stop = null, meters = Infinity;
  (TRIP.stops || []).forEach(candidate => {
    const d = metersBetween(lat, lng, candidate.lat, candidate.lng);
    if (d < meters){ stop = candidate; meters = d; }
  });
  return { stop, meters };
}

/* A walk carries no name of its own, so it borrows the nearest stop's the way
   a photo pin does, and falls back to saying what it is. */
function walkPinName(w){
  const middle = w.pts[Math.floor(w.pts.length / 2)];
  const { stop, meters } = nearestStop(middle[0], middle[1]);
  return (stop && meters <= PHOTO_PLACE_NAME_RADIUS_METERS) ? nameOf(stop) : 'Walk';
}


// Below this zoom, labeled pills collapse to icon-only badges so an overview
// of the whole trip doesn't turn into unreadable text; zooming into a single
// day or a cluster reveals full names again.
//
// Raised from 10: the pills are wide, and a row of them appearing while the
// map still covers a whole region put back the crowding the icons had just
// solved. Names now wait until the view is down to roughly a single town.
const ICON_ZOOM_THRESHOLD = 13;

// Flat single-color vector glyphs, not emoji. An emoji is a tiny detailed
// illustration - at badge size it just turns to mud (an early hiking-boot
// emoji attempt here read as "a shark"). A shape built from 1-2 strokes has
// nothing to lose at small sizes, so it stays crisp instead of degrading.
const COMPACT_ICONS = {
  night: '<svg viewBox="0 0 24 24"><path fill="#fff" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>',
  hike: '<svg viewBox="0 0 24 24"><path fill="#fff" d="M2 20h20L15 6l-3.5 6.5L9 8.5 2 20z"/></svg>',
  // A star, not the clock this used to be. The clock said "time passed
  // here", which is true of every pin on the map; a star says "worth
  // stopping at", which is what a long stop actually marks.
  long: '<svg viewBox="0 0 24 24"><path fill="#fff" d="M12 2.6l2.9 5.9 6.5.95-4.7 4.58 1.11 6.47L12 17.44 6.19 20.5l1.11-6.47-4.7-4.58 6.5-.95z"/></svg>',
  // Photos with no recorded place to attach them to. A camera pin only
  // survives where nothing else was near enough to swallow it.
  photo: '<svg viewBox="0 0 24 24"><path fill="#fff" d="M9 3l-1.5 2H4a2 2 0 00-2 2v11a2 2 0 002 2h16a2 2 0 002-2V7a2 2 0 00-2-2h-3.5L15 3H9zm3 5.2a4.8 4.8 0 110 9.6 4.8 4.8 0 010-9.6z"/></svg>'
};

// Where each compact teardrop's tip actually sits within its 60x60 icon box
// (see the CSS ".pin-compact" comment for why they lean different ways).
// Computed from each kind's rotation angle, not eyeballed: the square's own
// center sits at (30,30), the tip is its one unrounded corner at distance
// 38/sqrt(2) =~ 26.9px from that center, and rotate(-45deg) is the known-
// good "points straight down" case (a common CSS map-pin recipe) - the other
// two just rotate 30deg further each way from that. Get this wrong and every
// compact pin points at the wrong spot on the map, not just at a slight tilt.
// Recomputed when the teardrop grew from 34px to 38px - these numbers do not
// survive a size change untouched.
const COMPACT_ANCHOR = { night:[17, 53], hike:[30, 57], long:[43, 53] };

/* Icon box size and whether the pin uses the shrunk styling, per kind. The
   photo pin's 44px box and [22,42] tip come from the same arithmetic as the
   others, just with the smaller square: centre (22,22), tip 28/sqrt(2) =~
   19.8px below it at a -45deg lean. Change a size in the CSS and these have
   to change with it, or every photo pin points at the wrong spot. */
const PIN_GEOMETRY = {
  night: { box:60 },
  hike:  { box:60 },
  long:  { box:60 }
};

function addPin(stop, pinCls, badgeCls, icon, badgeText, titleCls, durText, low){
  const compact = map.getZoom() < ICON_ZOOM_THRESHOLD;
  const kind = pinCls.replace('pin-', '');
  const glyph = COMPACT_ICONS[kind] || icon;
  const html = compact
    ? teardropHTML(kind, 0)
    : `<div class="pin ${pinCls}">
         <span class="pin-name">${glyph}${esc(nameOf(stop))}</span>
         <span class="badge ${badgeCls}">${esc(badgeText)}</span>
       </div>`;
  const marker = L.marker([stop.lat, stop.lng], {
    icon: L.divIcon({
      className:'', html,
      iconSize: compact ? [PIN_GEOMETRY[kind].box, PIN_GEOMETRY[kind].box] : null,
      iconAnchor: compact ? COMPACT_ANCHOR[kind] : [0, 14]
    }),
    riseOnHover:true,
    // Doubles as this pin's kind, read back by pinClusterIcon() to decide
    // which glyph wins when pins merge. Also still sets draw-order priority
    // (see PIN_DRAW_ORDER) for pins drawn on their own.
    pane: `pins-${kind}`
  }).bindPopup(popupHTML(stop, titleCls, badgeCls, durText, low));
  marker.photoCount = 0;   // a stop carries no photos of its own; merging adds them
  marker.placeName = nameOf(stop);   // read back when this pin leads a merge
  // Only while the pin is an icon. Once it is a labelled pill the name is
  // already on screen and a card repeating it is just in the way.
  if (compact) {
    marker.bindTooltip(pinTooltipHTML(kind, marker.placeName, 0, 0, ''),
                       tooltipOptions(kind));
  }
  stopPinMarkers.push(marker);
}

function popupHTML(stop, titleCls, badgeCls, durText, low){
  const warn = low
    ? `<div class="pop-warn">⚠ Low confidence: ${esc(stop.confidence_reason)}</div>` : '';
  const prov = (stop.label && stop.db_name && stop.label !== stop.db_name)
    ? `<div class="prov">Database record: ${esc(stop.db_name)}</div>` : '';
  return `
    <div class="pop-title ${titleCls}">${esc(nameOf(stop))}</div>
    ${stop.sublabel ? `<div class="pop-sub">${esc(stop.sublabel)}</div>` : ''}
    ${durText && badgeCls ? `<div class="pop-badge ${badgeCls}">${esc(durText)}</div>` : ''}
    <div class="pop-row"><b>${esc(stop.day_label)}</b> · ${esc(stop.start_label)} – ${esc(stop.end_label)}</div>
    <div class="pop-desc">${gmaps(stop.lat, stop.lng)}</div>
    ${warn}${prov}`;
}

/* ------------------------------------------------------------ photo column */
/* Clicking a photo pin does NOT open a Leaflet popup: the photos live in the
   right-hand column instead, which is what lets one place's photos be browsed
   at a readable size and stepped through with the keyboard. Photo pins are
   also not filtered by currentDay (unlike drawMarkers()) - one cluster's
   members can span more than one day of the trip (the same lodge at check-in
   and at checkout), so there is no single day to filter it by. */
const PHOTO_CLUSTERS = TRIP.photo_clusters || [];
const HAS_PHOTOS = PHOTO_CLUSTERS.length > 0;
let selectedClusterIndex = 0;
let selectedPhotoIndex = 0;
let visibleClusterIndexes = PHOTO_CLUSTERS.map((_, i) => i);

// Must agree with the mobile media query above, height clause included - a
// landscape phone is wide but short, and gets the full-screen viewer too.
const isMobile = () => window.innerWidth < 768 || window.innerHeight < 500;

function metersBetween(aLat, aLng, bLat, bLng){
  const r = 6371008.8, rad = Math.PI / 180;
  const p1 = aLat * rad, p2 = bLat * rad;
  const dp = (bLat - aLat) * rad, dl = (bLng - aLng) * rad;
  const h = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 2 * r * Math.asin(Math.sqrt(h));
}

/* A photo location has no name of its own, so it borrows one from the trip -
   from the nearest recorded stop, or from a named walk that passes it. The
   names those carry are the Nominatim-enriched ones ("Castle Rock Trail"),
   not the generic database labels.

   Three radii rather than one, because the honest wording differs with the
   distance. Against this database, one 800m radius left roughly half of all
   photo locations with no name at all: the phone records a visit where you
   stayed, and a great many photographs are taken where you did not - a layby,
   a beach, a viewpoint on the way past. Widening a single radius instead
   would have the page assert you were somewhere you were not.

   Distances at which each rule stops being true:
   - 800m   you were, to all intents, at that stop.
   - 150m   you were on that walk. Tight, because a trail 500m off is a
            different trail.
   - 3000m  you were near that stop and nothing else. Past 3km coverage stops
            improving anyway - a quarter of photo locations have no recorded
            stop within TEN kilometres, and only a name from outside this
            database can reach those. */
const PHOTO_PLACE_NAME_RADIUS_METERS  = 800;
const PHOTO_WALK_NAME_RADIUS_METERS   = 150;
const PHOTO_NEARBY_NAME_RADIUS_METERS = 3000;

// 'Unnamed stop' is what nameOf() returns when a record carries no name at
// all. Borrowing that would say less than saying nothing.
function borrowableName(record){
  const name = nameOf(record);
  return name && name !== 'Unnamed stop' ? name : '';
}

function nearestStopTo(cluster){
  let stop = null, meters = Infinity;
  (TRIP.stops || []).forEach(candidate => {
    const d = metersBetween(cluster.latitude, cluster.longitude,
                            candidate.lat, candidate.lng);
    if (d < meters && borrowableName(candidate)){ stop = candidate; meters = d; }
  });
  return { stop, meters };
}

// Nearest approach of any NAMED walk, measured to its recorded points. A walk
// is a line, so the distance that matters is to the nearest point on it, not
// to wherever it happens to start.
function nearestNamedWalkTo(cluster){
  let walk = null, meters = Infinity;
  (TRIP.walks || []).forEach(candidate => {
    if (!borrowableName(candidate) || !candidate.pts) return;
    candidate.pts.forEach(point => {
      const d = metersBetween(cluster.latitude, cluster.longitude, point[0], point[1]);
      if (d < meters){ walk = candidate; meters = d; }
    });
  });
  return { walk, meters };
}

// Scanning every walk point for every location is cheap once and wasteful on
// every map pan, and a location's name never changes once the page is built.
const placeNameCache = new Map();
function clusterPlaceName(cluster){
  if (placeNameCache.has(cluster)) return placeNameCache.get(cluster);
  const stop = nearestStopTo(cluster);
  const walk = nearestNamedWalkTo(cluster);
  let name;
  if (stop.meters <= PHOTO_PLACE_NAME_RADIUS_METERS) name = borrowableName(stop.stop);
  else if (walk.meters <= PHOTO_WALK_NAME_RADIUS_METERS) name = borrowableName(walk.walk);
