  // What OpenStreetMap says is at these exact coordinates, filled in at build
  // time by viz/enrich_photo_places.py and absent when that step did not run.
  // Ahead of the "near" rule below because it describes this spot rather than
  // a stop up to three kilometres from it.
  else if (cluster.osm_name) name = cluster.osm_name;
  // "near" is doing real work here: it claims the photographs were taken
  // close to that stop, not at it.
  else if (stop.meters <= PHOTO_NEARBY_NAME_RADIUS_METERS)
    name = `near ${borrowableName(stop.stop)}`;
  else name = 'Photos';
  placeNameCache.set(cluster, name);
  return name;
}

/* When a location was photographed, as one short label.

   Almost always a single day: of the photo locations across the two trips
   built from this database, all but five sit inside one day, and most inside
   a quarter of an hour. The five that do not are overnight stays photographed
   at dusk and again the next morning, so the range form has to exist - it is
   just rare. Same month collapses to "Jun 28 - 29"; a month boundary keeps
   both names.

   Read off local_timestamp rather than timestamp_utc on purpose: that is the
   photo's own local time, which is the date the reader remembers. The UTC one
   would put a late evening photo on the following day. */
function clusterDateLabel(cluster){
  const photos = cluster.photos || [];
  if (!photos.length) return '';
  // "Aug 31, 4:54 PM" -> "Aug 31". A photo whose camera recorded no offset is
  // stamped "Aug 29, 2:17 PM UTC", and that tail sits after the comma too.
  const dayOf = photo => String(photo.local_timestamp || '').split(',')[0].trim();
  const first = dayOf(photos[0]);
  const last = dayOf(photos[photos.length - 1]);
  if (!first || !last || first === last) return first || last;
  const [firstMonth] = first.split(' ');
  const [lastMonth, lastDay] = last.split(' ');
  return firstMonth === lastMonth ? `${first} – ${lastDay}` : `${first} – ${last}`;
}

function drawPhotoClusters(){
  photoPinMarkers = [];
  if (!photosVisible){ refreshPinLayer(); return []; }
  const bounds = [];
  PHOTO_CLUSTERS.forEach((cluster, index) => {
    bounds.push([cluster.latitude, cluster.longitude]);
    const isSelected = HAS_PHOTOS && index === selectedClusterIndex;
    const marker = L.marker([cluster.latitude, cluster.longitude], {
      icon: photoMarkIcon(cluster.photo_count, isSelected ? 'selected' : ''),
      riseOnHover:true,
      pane:'pins-photo' // Draw-order priority (see PIN_DRAW_ORDER).
    }).on('click', () => selectCluster(index, 0, { openPanel:true }))
      .bindTooltip(pinTooltipHTML('photo', '', 0, cluster.photo_count, 'click to browse'),
                   tooltipOptions('photo'));
    // Read back by pinClusterIcon(): a merged pin reports how many PHOTOS it
    // holds, not how many pins, so it needs each pin's own tally.
    marker.photoCount = cluster.photo_count;
    photoPinMarkers.push(marker);
  });
  refreshPinLayer();
  return bounds;
}

function selectCluster(clusterIndex, photoIndex, options){
  const opts = options || {};
  selectedClusterIndex = Math.max(0, Math.min(clusterIndex, PHOTO_CLUSTERS.length - 1));
  selectedPhotoIndex = photoIndex || 0;
  // Tapping a pin opens the panel on both mobile (full-screen overlay) and
  // desktop (expands the collapsed column) - openPhotoPanel() itself branches
  // on isMobile() to do the right thing for each.
  if (opts.openPanel) openPhotoPanel();
  if (opts.follow) followSelectedCluster();
  drawPhotoClusters();          // repaint so the selected pin highlight moves
  renderPhotoPanel();
}

// "the map follows": keep the pin being browsed on screen, but never change
// zoom - the reader chose that, and yanking it is disorienting.
function followSelectedCluster(){
  const cluster = PHOTO_CLUSTERS[selectedClusterIndex];
  if (!cluster) return;
  const point = L.latLng(cluster.latitude, cluster.longitude);
  if (!map.getBounds().pad(-0.12).contains(point)) map.panTo(point, { animate:true });
}

// Full bleed (object-fit:cover) is worth having only when the photo and the
// viewer box are nearly the same shape, because cover fills the box by
// cutting the photo down on whichever axis is too long.
//
// The test used to be "both landscape, or both portrait", which is far too
// coarse. A 2:3 portrait photo in a viewer that measures 559x624 counts as
// two portraits and passes - and then loses a quarter of its height off the
// top and bottom. Comparing the two aspect ratios directly is exact: the
// smaller divided by the larger IS the share of the photo that survives
// cover, so the rule becomes "go full bleed only if almost all of it does".
//
// Two thresholds rather than one because the reader drags the panel's edge
// and the viewer's shape changes continuously while they do. A single
// cut-off makes the photo snap between letterboxed and full bleed on every
// small movement near it. Instead, full bleed starts once 90% of the photo
// would survive and holds until it would drop below 84% - so the picture
// settles instead of flickering mid-drag.
const COVER_START_VISIBLE_SHARE = 0.90;
const COVER_KEEP_VISIBLE_SHARE  = 0.84;

function updateImageFit(){
  const img = document.getElementById('viewerImage');
  if (!img.naturalWidth || !img.naturalHeight) return;
  const rect = document.getElementById('viewer').getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  const imageAspect = img.naturalWidth / img.naturalHeight;
  const viewerAspect = rect.width / rect.height;
  const visibleShare = Math.min(imageAspect, viewerAspect)
                     / Math.max(imageAspect, viewerAspect);
  const alreadyFullBleed = img.style.objectFit === 'cover';
  const threshold = alreadyFullBleed
    ? COVER_KEEP_VISIBLE_SHARE
    : COVER_START_VISIBLE_SHARE;
  img.style.objectFit = visibleShare >= threshold ? 'cover' : 'contain';
}

function renderPhotoPanel(){
  if (!HAS_PHOTOS) return;
  const cluster = PHOTO_CLUSTERS[selectedClusterIndex];
  const photos = cluster.photos;
  selectedPhotoIndex = Math.max(0, Math.min(selectedPhotoIndex, photos.length - 1));
  const photo = photos[selectedPhotoIndex];

  const image = document.getElementById('viewerImage');
  image.src = photo.display_url || photo.thumbnail_url || '';
  image.alt = photo.file_name;
  // Clear the fit first so the new photo is judged from scratch: the two
  // thresholds in updateImageFit() read the current value to decide whether
  // full bleed is already running, and a fresh photo should have to meet the
  // strict one rather than inherit the previous photo's slack.
  image.style.objectFit = '';
  image.onload = updateImageFit;
  updateImageFit();   // in case this exact image is already cached/loaded
  document.getElementById('viewerCount').textContent =
    `${selectedPhotoIndex + 1} / ${photos.length}`;
  // The file name only ever helped when working on the page itself, and the
  // date it used to carry now sits under the location name instead. Add
  // ?debug=1 to the address to bring both back.
  const caption = document.getElementById('viewerCaption');
  caption.hidden = !IS_DEBUG;
  caption.textContent = IS_DEBUG ? `${photo.file_name} · ${photo.local_timestamp}` : '';

  document.getElementById('placeName').textContent = clusterPlaceName(cluster);
  document.getElementById('placeSub').innerHTML =
    `<span class="when">${esc(clusterDateLabel(cluster))}</span> · ` +
    `${photos.length} photo${photos.length > 1 ? 's' : ''}`;

  const track = document.getElementById('progressTrack');
  track.innerHTML = photos
    .map((_, i) => `<div class="progress-seg${i <= selectedPhotoIndex ? ' done' : ''}"></div>`)
    .join('');

  const grid = document.getElementById('thumbGrid');
  grid.innerHTML = photos.map((p, i) =>
    `<img src="${p.thumbnail_url || ''}" loading="lazy" data-photo-index="${i}"
          class="${i === selectedPhotoIndex ? 'current' : ''}"
          alt="${esc(p.file_name)}" title="${esc(p.file_name)} · ${esc(p.local_timestamp)}">`
  ).join('');

  // Nothing wraps any more, so an arrow is dead only at the end it points at:
  // the photo arrows at the very first and very last photo of the trip, the
  // place arrows at the first and last place.
  const order = browseOrder();
  const here = order.indexOf(selectedClusterIndex);
  const isFirstPlace = here <= 0;
  const isLastPlace = here === order.length - 1;
  document.getElementById('prevPlace').disabled = isFirstPlace;
  // Two buttons, one job: the second is the full-screen copy, which is the
  // only one on screen once the place block is hidden.
  document.getElementById('nextPlace').disabled = isLastPlace;
  document.getElementById('nextPlaceMaximized').disabled = isLastPlace;
  document.getElementById('prevPhoto').disabled =
    isFirstPlace && selectedPhotoIndex === 0;
  document.getElementById('nextPhoto').disabled =
    isLastPlace && selectedPhotoIndex === photos.length - 1;
  preloadNeighbourImages(photos);
}

// Fetch the next/previous full-size image before it's asked for, so stepping
// with the arrow keys doesn't flash an empty frame on each press.
function preloadNeighbourImages(photos){
  [selectedPhotoIndex - 1, selectedPhotoIndex + 1].forEach(i => {
    const neighbour = photos[i];
    if (neighbour && neighbour.display_url) new Image().src = neighbour.display_url;
  });
}

/* Every place, earliest photo first, so stepping forward walks the trip in
   the order it happened. Photo groups arrive grouped by LOCATION, and the
   order they arrive in is not time order at all.

   Two places CAN overlap in time - the same lodge photographed at check-in
   and again at checkout, with a viewpoint in between. A place is still kept
   whole and placed by its first photo, so one of the lodge's two visits ends
   up out of order. Interleaving them photo by photo would fix that and cost
   far more: the reader would be thrown between two places and back for every
   picture. Whole places, first photo wins. */
const CHRONOLOGICAL_CLUSTERS = PHOTO_CLUSTERS
  .map((cluster, index) => ({
    index,
    // Photos inside a place are already earliest-first (attach_photos.py sorts
    // them), so the first one dates the place. Missing times sort first and
    // keep their original order rather than shuffling.
    time: ((cluster.photos || [])[0] || {}).timestamp_utc || ''
  }))
  .sort((a, b) => (a.time < b.time ? -1 : a.time > b.time ? 1 : a.index - b.index))
  .map(entry => entry.index);

/* The places the arrows walk through, in time order.

   On desktop the map sits beside the panel, so the arrows offer what the
   reader can actually see - pan somewhere else and the list changes with it.
   On a phone the viewer covers the map completely, so that scoping would be
   invisible; worse, with a single place on screen "next" led straight back
   into the place already open, which is the wrap this fixes. The fallback
   below catches the same trap on desktop. */
function browseOrder(){
  if (isMobile()) return CHRONOLOGICAL_CLUSTERS;
  const inView = new Set(visibleClusterIndexes);
  const scoped = CHRONOLOGICAL_CLUSTERS.filter(index => inView.has(index));
  return (scoped.length > 1 && scoped.includes(selectedClusterIndex))
    ? scoped : CHRONOLOGICAL_CLUSTERS;
}

// Stepping past either end of a place carries on into the next place in time
// order, so the whole trip's photos are reachable with one key held down.
// The two ends of the trip are ends: nothing wraps back round to the start.
function stepPhoto(delta){
  if (!HAS_PHOTOS) return;
  const photos = PHOTO_CLUSTERS[selectedClusterIndex].photos;
  const next = selectedPhotoIndex + delta;
  if (next >= 0 && next < photos.length){
    selectCluster(selectedClusterIndex, next, {});
    return;
  }
  stepPlace(delta, delta > 0 ? 'first' : 'last');
}

function stepPlace(delta, landOn){
  if (!HAS_PHOTOS) return;
  const order = browseOrder();
  const next = order.indexOf(selectedClusterIndex) + delta;
  if (next < 0 || next >= order.length) return;
  const target = order[next];
  const photoCount = PHOTO_CLUSTERS[target].photos.length;
  selectCluster(target, landOn === 'last' ? photoCount - 1 : 0, { follow:true });
}

// The column offers what the map is currently showing, so panning somewhere
// else changes which places the place-arrows walk through.
function updateVisibleClusters(){
  if (!HAS_PHOTOS) return;
  const bounds = map.getBounds();
  visibleClusterIndexes = PHOTO_CLUSTERS
    .map((cluster, index) => ({ cluster, index }))
    .filter(entry => bounds.contains(
      L.latLng(entry.cluster.latitude, entry.cluster.longitude)))
    .map(entry => entry.index);
  if (visibleClusterIndexes.length === 0) visibleClusterIndexes = PHOTO_CLUSTERS.map((_, i) => i);

  const chip = document.getElementById('inViewChip');
  chip.hidden = !photosVisible || isMobile() || !desktopPanelOpen;
  chip.textContent =
    `${visibleClusterIndexes.length} of ${PHOTO_CLUSTERS.length} photo places in view`;
  renderPhotoPanel();
}

function openPhotoPanel(){
  document.getElementById('photoPanel').hidden = false;
  if (isMobile()){
    maybeShowGestureHint();
  } else {
    desktopPanelOpen = true;
    layoutPhotoPanel();
    updateVisibleClusters();   // the in-view chip only shows once the panel is open
  }
}
// On mobile this just hides the full-screen overlay. On desktop there's no
// overlay to hide - it collapses the column back to zero width instead,
// same end state as unchecking "Show photos", but leaves photosVisible (and
// the pins on the map) alone so a pin click reopens it.
function closePhotoPanel(){
  if (isMobile()){
    document.getElementById('photoPanel').hidden = true;
  } else {
    desktopPanelOpen = false;
    layoutPhotoPanel();
    updateVisibleClusters();   // recompute the in-view chip's hidden state now, not on next pan
  }
  setMaximized(false);
}

// Mobile-only: hides the place header and thumbnail strip so the photo fills
// the whole panel (see the .photo-panel.maximized rule in the mobile media
// query). Toggled by the ⤢ button and by tapping the photo itself.
function setMaximized(maximized){
  document.getElementById('photoPanel').classList.toggle('maximized', maximized);
  const btn = document.getElementById('maximizeToggle');
  btn.textContent = maximized ? '⤡' : '⤢';
  btn.title = maximized ? 'Restore photo view' : 'Maximize photo';
}
function toggleMaximize(){
  setMaximized(!document.getElementById('photoPanel').classList.contains('maximized'));
}

// Shown once ever, the first time a reader opens the mobile photo viewer, so
// the swipe/tap gestures aren't undiscoverable. Marked "seen" the moment it's
// shown rather than only once dismissed, so it never comes back even if the
// reader ignores it. Wrapped in try/catch: some browsers (Safari private
// mode, a page opened straight from disk) throw on localStorage access
// instead of just returning null - if so, this fails open and shows the hint
// rather than silently never showing it.
const GESTURE_HINT_KEY = 'lochis-photo-gesture-hint-seen';
/* Once per VISIT, not once per browser. sessionStorage empties when the tab
   closes; localStorage does not, and it is keyed by web address rather than by
   trip or version - so one viewing, on any trip, at any time in the past, used
   to silence this card for good on that phone. Three gestures are more than
   anyone learns from a single showing. */
function maybeShowGestureHint(){
  if (!isMobile()) return;
  let seen = false;
  try { seen = !!sessionStorage.getItem(GESTURE_HINT_KEY); } catch (e) { /* show it */ }
  if (seen) return;
  document.getElementById('gestureHint').hidden = false;
  try { sessionStorage.setItem(GESTURE_HINT_KEY, '1'); } catch (e) { /* best-effort only */ }
}
function dismissGestureHint(){
  document.getElementById('gestureHint').hidden = true;
}

// On desktop the column is collapsed until the reader opens it (a pin click
// or the "Show photos" toggle - see openPhotoPanel()), same as mobile starts
// closed until a pin is tapped. Once open, the map is narrowed to sit beside
// it; while closed, the map keeps the whole window, same as when there are no
// photos at all.
function layoutPhotoPanel(){
  const panel = document.getElementById('photoPanel');
  if (!HAS_PHOTOS || !photosVisible){
    document.documentElement.style.setProperty('--photo-panel-width', '0px');
    panel.hidden = true;
    document.getElementById('inViewChip').hidden = true;
    map.invalidateSize();
    return;
  }
  if (isMobile()){
    document.documentElement.style.setProperty('--photo-panel-width', '0px');
  } else if (!desktopPanelOpen){
    document.documentElement.style.setProperty('--photo-panel-width', '0px');
    panel.hidden = true;
    map.invalidateSize();
    return;
  } else {
    // Once the reader has dragged the handle, that width sticks (re-clamped
    // to the current window each time) instead of reverting to the default.
    const width = customPhotoPanelWidthPx != null
      ? `${clampPhotoPanelWidth(customPhotoPanelWidthPx)}px`
      : 'min(42%, 560px)';
    document.documentElement.style.setProperty('--photo-panel-width', width);
    panel.hidden = false;
  }
  map.invalidateSize();
  updateImageFit();   // the viewer's own aspect ratio just changed with the width
}

// Drag-to-resize the photo panel (desktop only - on mobile it's a full-screen
// overlay with nothing beside it to resize against).
const PHOTO_PANEL_MIN_WIDTH_PX = 280;
const PHOTO_PANEL_MAX_WIDTH_RATIO = 0.75;  // never swallow more than 3/4 of the window
const MAP_MIN_VISIBLE_WIDTH_PX = 240;      // the map always keeps at least this much room
let customPhotoPanelWidthPx = null;        // null = use the default responsive width
let preMaximizeWidthPx = null;             // width to restore to when un-maximizing

function clampPhotoPanelWidth(px){
  const max = Math.min(
    window.innerWidth * PHOTO_PANEL_MAX_WIDTH_RATIO,
    window.innerWidth - MAP_MIN_VISIBLE_WIDTH_PX
  );
  return Math.max(PHOTO_PANEL_MIN_WIDTH_PX, Math.min(px, max));
}

// Double-click the handle toggles between the current width and the max -
// dragging still works normally afterwards, since both just set the same
// customPhotoPanelWidthPx variable that layoutPhotoPanel() reads.
function isPanelMaximized(){
  const current = document.getElementById('photoPanel').getBoundingClientRect().width;
  return current >= clampPhotoPanelWidth(Infinity) - 1;
}
function toggleMaximizePanel(){
  if (isPanelMaximized()){
    customPhotoPanelWidthPx = preMaximizeWidthPx;
    preMaximizeWidthPx = null;
  } else {
    preMaximizeWidthPx = customPhotoPanelWidthPx != null
      ? customPhotoPanelWidthPx
      : document.getElementById('photoPanel').getBoundingClientRect().width;
    customPhotoPanelWidthPx = clampPhotoPanelWidth(Infinity);
  }
  layoutPhotoPanel();
}

function wirePanelResize(){
  if (!HAS_PHOTOS) return;
  const handle = document.getElementById('panelResizeHandle');
  let dragging = false, startX = 0, startWidth = 0, pendingFrame = null;

  handle.addEventListener('mousedown', event => {
    if (isMobile()) return;
    dragging = true;
    startX = event.clientX;
    startWidth = document.getElementById('photoPanel').getBoundingClientRect().width;
    handle.classList.add('dragging');
    document.body.style.userSelect = 'none';
    document.body.style.cursor = 'col-resize';
    event.preventDefault();
  });

  window.addEventListener('mousemove', event => {
    if (!dragging) return;
    const deltaX = startX - event.clientX;   // dragging left grows the panel
    customPhotoPanelWidthPx = clampPhotoPanelWidth(startWidth + deltaX);
    document.documentElement.style.setProperty(
      '--photo-panel-width', `${customPhotoPanelWidthPx}px`);
    // invalidateSize forces a Leaflet layout pass - batch it to one per frame
    // instead of once per mousemove, which fires far more often than that.
    if (pendingFrame) return;
    pendingFrame = requestAnimationFrame(() => {
      map.invalidateSize();
      updateImageFit();   // the viewer's aspect ratio changes as it's dragged
      pendingFrame = null;
    });
  });

  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    document.body.style.userSelect = '';
    document.body.style.cursor = '';
  });

  handle.addEventListener('dblclick', event => {
    if (isMobile()) return;
    event.preventDefault();
    toggleMaximizePanel();
  });
}

function wirePhotoPanel(){
  if (!HAS_PHOTOS) return;

  document.getElementById('prevPhoto').addEventListener('click', () => stepPhoto(-1));
  document.getElementById('nextPhoto').addEventListener('click', () => stepPhoto(1));
  document.getElementById('prevPlace').addEventListener('click', () => stepPlace(-1));
  document.getElementById('nextPlace').addEventListener('click', () => stepPlace(1));
  document.getElementById('nextPlaceMaximized').addEventListener('click', () => stepPlace(1));
  document.getElementById('closeViewer').addEventListener('click', closePhotoPanel);
  document.getElementById('maximizeToggle').addEventListener('click', toggleMaximize);
  document.getElementById('viewerImage').addEventListener('click', () => {
    if (isMobile()) toggleMaximize();
  });
  document.getElementById('gestureHint').addEventListener('click', dismissGestureHint);

  document.getElementById('thumbGrid').addEventListener('click', event => {
    const index = event.target.dataset && event.target.dataset.photoIndex;
    if (index !== undefined) selectCluster(selectedClusterIndex, Number(index), {});
  });

  document.addEventListener('keydown', event => {
    if (document.getElementById('photoPanel').hidden) return;
    if (event.key === 'ArrowLeft'){ event.preventDefault(); stepPhoto(-1); }
    else if (event.key === 'ArrowRight'){ event.preventDefault(); stepPhoto(1); }
    else if (event.key === 'Escape') closePhotoPanel();
  });

  // Swipe: sideways steps photos, up moves to the next place - the two
  // gestures the phone layout offers instead of the desktop arrows.
  const viewer = document.getElementById('viewer');
  let touchStartX = 0, touchStartY = 0;
  const SWIPE_THRESHOLD_PIXELS = 45;
  viewer.addEventListener('touchstart', event => {
    touchStartX = event.changedTouches[0].clientX;
    touchStartY = event.changedTouches[0].clientY;
  }, { passive:true });
  viewer.addEventListener('touchend', event => {
    dismissGestureHint();
    const deltaX = event.changedTouches[0].clientX - touchStartX;
    const deltaY = event.changedTouches[0].clientY - touchStartY;
    if (Math.abs(deltaX) > Math.abs(deltaY)){
      if (Math.abs(deltaX) > SWIPE_THRESHOLD_PIXELS) stepPhoto(deltaX < 0 ? 1 : -1);
    } else if (deltaY < -SWIPE_THRESHOLD_PIXELS){
      stepPlace(1);
    }
  }, { passive:true });

  map.on('moveend', updateVisibleClusters);
  L.DomEvent.disableClickPropagation(document.getElementById('photoPanel'));
  L.DomEvent.disableScrollPropagation(document.getElementById('photoPanel'));
}

function render(fit){
  const b1 = drawRoute();
  drawFlights();
  drawWalks();
  const b2 = drawMarkers();
  const b3 = drawPhotoClusters();
  const all = b1.concat(b2).concat(b3);
  if (fit && all.length) fitTo(L.latLngBounds(all));
}

// Our own fitBounds fires zoomstart too, so flag it and ignore those events -
// otherwise the map would immediately think the reader had taken control.
let programmatic = false;
function fitTo(bounds){
  programmatic = true;
  map.fitBounds(bounds, fitOpts());
  setTimeout(() => { programmatic = false; }, 500);
}

function fitOpts(){
  // Asymmetric padding: the open panel covers the left edge, so the route is
  // centred in the space that is actually visible rather than behind the card.
  const small = window.innerWidth < 768;
  const panelEl = document.getElementById('panel');
  if (small) return { padding:[28, 28] };
  const open = !panelEl.classList.contains('collapsed');
  // Cap the panel-clearance pad at a share of the viewport. Uncapped, a wide
  // screen showing a tall narrow route spends most of its width on padding and
  // the trip ends up as a thin strip pinned to the right edge.
  const wanted = (open ? panelEl.offsetWidth : 0) + 40;
  const left = Math.min(wanted, map.getSize().x * 0.28);
  return { paddingTopLeft:[left, 40], paddingBottomRight:[50, 50] };
}

/* --------------------------------------------------------------- controls */
function buildChrome(){
  document.getElementById('tripTitle').textContent = M.title || 'Trip';
  document.getElementById('tripSubtitle').textContent =
    M.subtitle || `${M.start_date} – ${M.end_date}`;
  document.title = M.title || 'Trip';

  renderStatReadouts();

  // A gap counts as "unrouted" when viz/snap_route_gaps.py couldn't reach
  // OSRM (or it found no route) and fell back to the straight line between
  // the gap's two endpoints. That segment renders identically to a real
  // road route otherwise (same dashed style), so without this banner
  // there'd be no way to notice from the map alone that reconstruction
  // silently didn't happen for some stretches.
  const unroutedGaps = (TRIP.days || []).reduce((n, d) =>
    n + (d.inferred_segments || []).filter(seg => !seg.is_routed).length, 0);
  // One sentence, shown in the card on a wide screen and over the map on a
  // phone. Both copies are filled and marked `show`; the CSS breakpoint is
  // what picks the one the reader actually gets.
  const gapBanner = document.getElementById('gapBanner');
  const gapNote   = document.getElementById('gapNote');
  const showNotice = html => {
    document.getElementById('gapBannerText').innerHTML = html;
    document.getElementById('gapNoteText').innerHTML = html;
    gapBanner.classList.add('show');
    gapNote.classList.add('show');
  };
  if (PHOTOS_ONLY){
    // Every line on this map is drawn between two photo locations, so the
    // "some stretches could not be routed" warning below would be the whole
    // map. Say what the map actually is instead - including how the distance
    // was arrived at, which is the one figure a reader could mistake for a
    // measurement of the journey.
    const totalSegments = (TRIP.days || []).reduce(
      (n, d) => n + (d.inferred_segments || []).length, 0);
    const routedSegments = totalSegments - unroutedGaps;
    const howMeasured =
      routedSegments === 0        ? 'in straight lines between those places' :
      unroutedGaps === 0          ? 'along the roads between those places' :
      'along the roads between those places where a route was found, and in ' +
      'straight lines where it was not';
    showNotice(
      '<b>Estimated from photo locations only.</b> The lines join the places ' +
      'photos were taken, in the order they were taken, and the distance is ' +
      'measured ' + howMeasured + '. Nothing here was recorded by a phone, ' +
      'so both the route and the distance are estimates.');
  } else if (unroutedGaps > 0){
    showNotice(
      `<b>${unroutedGaps} unrecorded stretch${unroutedGaps === 1 ? '' : 'es'}</b> ` +
      `could not be matched to ${unroutedGaps === 1 ? 'a road' : 'roads'} — shown as ` +
      `${unroutedGaps === 1 ? 'a straight line' : 'straight lines'} instead.`);
  }

  // Dismissed for this page view only: nothing is written down, so a reload
  // brings it back.
  //
  // Both forms go at once, from either button. Only one of them is on screen
  // at a time, but a window dragged across the breakpoint - or a phone turned
  // sideways - swaps which one that is, and a notice the reader has already
  // dismissed must not reappear because of it.
  const dismissNotice = () => {
    gapBanner.classList.remove('show');
    gapNote.classList.remove('show');
  };
  document.getElementById('gapBannerClose').addEventListener('click', dismissNotice);
  document.getElementById('gapNoteClose').addEventListener('click', dismissNotice);

  // Every entry is the actual pin the reader will meet on the map, at a
  // smaller size, so there is nothing to translate between the two.
  const legendPin = kind => `<div class="legend-pin ${kind}"><i></i>${COMPACT_ICONS[kind]}</div>`;
  // A photos-only trip has no overnight, hike or long-stop pin and no
  // recorded track, so naming them here describes a map the reader is not
  // looking at. Its one line type is named for what it actually is.
  document.getElementById('legend').innerHTML = (PHOTOS_ONLY ? '' : `
    <div class="legend-item">${legendPin('night')}Overnight</div>
    <div class="legend-item">${legendPin('hike')}Likely hike</div>
    <div class="legend-item">${legendPin('long')}Long stop</div>`) +
    (HAS_PHOTOS ? `
    <div class="legend-item">${photoChipHTML(12)}Photos here</div>` : '') +
    (PHOTOS_ONLY ? `
    <div class="legend-item"><div class="dash dash-inferred"></div>Between photo places</div>` : `
    <div class="legend-item"><div class="dash"></div>On foot · no drive</div>
    <div class="legend-item"><div class="dash dash-photo-walk"></div>Photos only · walk estimate</div>
    <div class="legend-item"><div class="dash dash-inferred"></div>No GPS · road estimate</div>`);

  // Day filter
  const df = document.getElementById('dayFilter');
  df.appendChild(mkBtn('All days', currentDay === 'all', ev => setDay('all', ev)));
  // "None" is the way back to a clean map: every day at once can be a tangle
  // of crossing lines, and this leaves the pins with no route under them.
  // It clears the day-scoped markers too - a day filter on no day shows none.
  df.appendChild(mkBtn('None', currentDay === 'none', ev => setDay('none', ev)));
  TRIP.days.forEach(d => {
    df.appendChild(mkBtn(
      `<span class="swatch" style="background:${d.color}"></span>${esc(d.label)}
       <span class="km">${fmtDist(d.distance_km)}${distUnit}</span>`,
      currentDay === d.date, ev => setDay(d.date, ev)));
  });

  // Hike rule switch. "or more" rather than "≥ 1h": the maths symbol put a
  // number straight after a duration, and "≥ 1h (15)" was being read as one
  // hour and fifteen minutes.
  const ht = document.getElementById('hikeToggle');
  if (PHOTOS_ONLY){
    // The rule picks between two ways of reading stops, and a photos-only
    // trip has no stops to read.
    document.getElementById('hikeSectionLabel').hidden = true;
    ht.hidden = true;
    document.getElementById('hikeNote').hidden = true;
  } else {
    ht.appendChild(mkBtn(
      `Any stop of ${M.min_stop_hours}h or more (${S.hikes_naive + hikeWalksNeedingOwnPin('naive').length})`,
      hikeRule === 'naive', ev => setRule('naive', ev)));
    ht.appendChild(mkBtn(
      `Walk-confirmed (${S.hikes_smart + hikeWalksNeedingOwnPin('smart').length})`,
      hikeRule === 'smart', ev => setRule('smart', ev)));
    updateHikeNote();
  }

  // Photos - hide the switch when this trip has none, rather than showing a
  // toggle that controls nothing. Turning photos off also gives back the
  // full-width map, i.e. the plain trip map this page has always been.
  const pt = document.getElementById('photoToggle');
  const photoCount = PHOTO_CLUSTERS.reduce((sum, c) => sum + c.photo_count, 0);
  if (photoCount){
    const photoBtn = mkBtn(`Show photos (${photoCount})`, true, () => {
      photosVisible = !photosVisible;
      // Mirrors photosVisible: turning photos on also opens the (otherwise
      // collapsed) desktop column, turning them off closes it along with the
      // pins - one toggle, no separate "now also expand the column" step.
      desktopPanelOpen = photosVisible;
      photoBtn.classList.toggle('active', photosVisible);
      layoutPhotoPanel();
      render(false);
      updateVisibleClusters();
    });
    pt.appendChild(photoBtn);
  } else {
    pt.style.display = 'none';
  }

  // Distance units. Abbreviated, because the switch sits directly above the
  // stat that spells the unit out in full.
  const ut = document.getElementById('unitToggle');
  ut.appendChild(mkBtn('km', !IMPERIAL, ev => setUnits(false, ev)));
  ut.appendChild(mkBtn('mi', IMPERIAL, ev => setUnits(true, ev)));

  // Basemap
  const bt = document.getElementById('baseToggle');
  Object.keys(BASEMAPS).forEach((k, i) => {
    bt.appendChild(mkBtn(k, i === 0, ev => {
      map.removeLayer(activeBase);
      activeBase = BASEMAPS[k].addTo(map);
      activeBase.bringToBack();
      setActive(ev);
    }));
  });
}

// How many hikes the page is currently claiming. Reads the live rule rather
// than one fixed statistic: the two rules count different things, so a card
// that always showed one of them would contradict the pins on the map as soon
// as the reader picked the other.
function hikeCount(){
  const flaggedStops = hikeRule === 'smart' ? S.hikes_smart : S.hikes_naive;
  return flaggedStops + hikeWalksNeedingOwnPin().length;
}

// The two blocks of numbers at the top of the card: the four big stats and the
// one-line summary shown when the card is shut. Both are pure output - no
// buttons, no state - so switching units just rebuilds them from scratch.
function renderStatReadouts(){
  // A photos-only trip has no nights and no hikes - those need location
  // history, and showing them as zeros would pass a gap off as a measurement.
  // The distance IS shown: it is the length of the drawn path, which is a real
  // number about a real estimate. The banner is what says so.
  const photoTotal = PHOTO_CLUSTERS.reduce((sum, c) => sum + c.photo_count, 0);
  const placeTotal = PHOTO_CLUSTERS.length || S.places || 0;
  const dayTotal = (TRIP.days || []).length;
  const stats = PHOTOS_ONLY ? [
    [`${fmtDist(S.total_km)}`, distUnit === 'km' ? 'Kilometres' : 'Miles'],
    [photoTotal, photoTotal === 1 ? 'Photo' : 'Photos'],
    [placeTotal, placeTotal === 1 ? 'Place' : 'Places'],
    [dayTotal, dayTotal === 1 ? 'Day' : 'Days']
  ] : [
    [`${fmtDist(S.total_km)}`, distUnit === 'km' ? 'Kilometres' : 'Miles'],
    [S.nights_away, S.nights_away === 1 ? 'Night away' : 'Nights away'],
    [S.distinct_stay_places, S.distinct_stay_places === 1 ? 'Place stayed' : 'Places stayed'],
    [hikeCount(), hikeCount() === 1 ? 'Likely hike' : 'Likely hikes']
  ];
  document.getElementById('statsGrid').innerHTML = stats.map(([v, l]) =>
    `<div class="stat"><div class="stat-val">${esc(v)}</div>
     <div class="stat-lbl">${esc(l)}</div></div>`).join('');

  document.getElementById('miniStats').innerHTML = (PHOTOS_ONLY ? [
    `${fmtDist(S.total_km)} ${distUnit}`,
    `${photoTotal} photo${photoTotal === 1 ? '' : 's'}`,
    `${placeTotal} place${placeTotal === 1 ? '' : 's'}`
  ] : [
    `${fmtDist(S.total_km)} ${distUnit}`,
    `${S.nights_away} night${S.nights_away === 1 ? '' : 's'}`,
    `${hikeCount()} hike${hikeCount() === 1 ? '' : 's'}`
  ]).map(t => `<span>${esc(t)}</span>`).join('');
}

// Switch the whole page between kilometres and miles. Nothing is recomputed
// from the data: every distance on the page is stored in km and converted for
// display by dist(), so this flips one variable and redraws whatever shows a
// distance.
function setUnits(imperial, ev){
  if (ev) setActive(ev);
  if (imperial === IMPERIAL) return;
  IMPERIAL = imperial;
  distUnit = IMPERIAL ? 'mi' : 'km';

  renderStatReadouts();

  // The day chips are left in place rather than rebuilt, so the day the
  // reader has selected stays selected. One .km span per day, in the same
  // order as TRIP.days - the "All days" chip has no distance and so no span.
  document.querySelectorAll('#dayFilter .km').forEach((span, i) => {
    const day = TRIP.days[i];
    if (day) span.textContent = `${fmtDist(day.distance_km)}${distUnit}`;
  });

  map.removeControl(scaleControl);
  scaleControl = L.control.scale(
    { position:'bottomleft', imperial:IMPERIAL, metric:!IMPERIAL }).addTo(map);

  // Last, because it is the one step that touches every layer on the map:
  // anything that threw here would otherwise leave the readouts above already
  // switched and the scale bar still in the old units. Distances also appear
  // inside popups (day routes, road-reconstructed gaps, flights, walks) and
  // those strings are built while drawing, so a redraw is what refreshes
  // them. false means "don't move the map".
  render(false);
}

function mkBtn(html, active, fn){
  const b = document.createElement('button');
  b.className = 'btn' + (active ? ' active' : '');
  b.type = 'button';
  b.innerHTML = html;
  b.addEventListener('click', fn);
  return b;
}
function setActive(ev){
  const btn = ev.currentTarget;
  btn.parentElement.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}
function setDay(date, ev){
  currentDay = date;
  setActive(ev);
  render(true);
}
function setRule(rule, ev){
  hikeRule = rule;
  setActive(ev);
  updateHikeNote();
  renderStatReadouts();   // the "Likely hikes" figure is this rule's count
  render(false);
}
function updateHikeNote(){
  document.getElementById('hikeNote').textContent = hikeRule === 'smart'
    ? 'A long stop counts as a hike only when a walking segment was recorded beside it — this rejects highway rest stops.'
    : `Every stop of ${M.min_stop_hours}h or more, overnight stays excluded. Includes rest stops where no walking was recorded.`;
}

/* --------------------------------------------------------------- panel UX */
const panel = document.getElementById('panel');
const head  = document.getElementById('panelHead');
// Once the reader opens or shuts the card themselves, stop second-guessing them
// on resize; until then the card follows the breakpoint (including rotation).
let userToggled = false;
const chev = document.getElementById('chev');
const chevLabel = document.getElementById('chevLabel');
function setCollapsed(state){
  panel.classList.toggle('collapsed', state);
  head.setAttribute('aria-expanded', String(!state));
  chevLabel.textContent = state ? 'Details' : 'Hide';
}
function autoCollapse(){
  if (!userToggled) setCollapsed(isMobile());
}
head.addEventListener('click', () => {
  userToggled = true;
  chev.classList.remove('attn');
  setCollapsed(!panel.classList.contains('collapsed'));
});
head.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); head.click(); }
});
// Keep map gestures from being hijacked by the panel.
L.DomEvent.disableClickPropagation(panel);
L.DomEvent.disableScrollPropagation(panel);

/* ------------------------------------------------------------------- boot */
// Track whether the reader has taken control, so a resize never yanks the map
// back from where they panned to.
let userMoved = false;
map.on('dragstart zoomstart', () => { if (!programmatic) userMoved = true; });
// Markers swap between compact and labeled form as zoom crosses
// ICON_ZOOM_THRESHOLD. Only markers are redrawn - route/walks don't change.
//
// Gated on the form ACTUALLY changing, not on every zoomend: rebuilding the
// markers empties and refills the cluster group, which makes the plugin throw
// away the grouping it just animated into place. Between two zooms on the
// same side of the threshold there is nothing to redraw anyway - the plugin
// re-groups by itself.
let lastCompactForm = null;
map.on('zoomend', () => {
  const compact = map.getZoom() < ICON_ZOOM_THRESHOLD;
  if (compact === lastCompactForm) return;
  lastCompactForm = compact;
  drawMarkers();
});

function boot(){
  buildChrome();
  autoCollapse();            // start out of the way on phones
  // Photo column before the first fit: it narrows the map, and fitting to a
  // box that's about to shrink leaves the route pushed under the column.
  wirePhotoPanel();
  wirePanelResize();
  layoutPhotoPanel();
  map.invalidateSize();      // fit must not run on a zero-size box
  render(true);
  if (HAS_PHOTOS){
    updateVisibleClusters();
    // The trip's first photos, not whichever place happens to be first in the
    // data - the panel opens where the arrows would walk from.
    selectCluster(CHRONOLOGICAL_CLUSTERS[0], 0, {});
  }
  userMoved = false;
  // A shut panel with nothing moving reads as a dead end, so draw the eye to
  // the one control that reopens it - a few pulses, then leave it alone.
  if (panel.classList.contains('collapsed')){
    chev.classList.add('attn');
    chev.addEventListener('animationend', () => chev.classList.remove('attn'), { once:true });
  }
}

// Deliberately not requestAnimationFrame: rAF is paused in a hidden or
// background tab, so a page opened into one would sit blank until focused -
// a very real case for a file arriving as an email attachment. setTimeout
// keeps running regardless of visibility. `started` keeps it idempotent.
let started = false;
function start(){
  if (started) return;
  started = true;
  boot();
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => setTimeout(start, 0));
} else {
  setTimeout(start, 0);
}
window.addEventListener('load', start);   // safety net

let resizeTimer;
function reflow(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    autoCollapse();
    // Rotating a phone, or dragging a window across the 768px breakpoint,
    // switches the photo column between overlay and side-by-side.
    layoutPhotoPanel();
    map.invalidateSize();
    if (!userMoved) render(true);          // re-fit only an untouched map
  }, 180);
}
window.addEventListener('resize', reflow);

/* A tab that is hidden at load time has a zero-size map container, and
   fitBounds on a zero-size box collapses to maximum zoom. Watching the
   container itself catches the moment it gains real dimensions - whether from
   the tab being revealed, the window resizing, or the phone being rotated -
   and re-fits then. This is what makes the page correct when it is opened
   into a background tab rather than a focused one. */
if (window.ResizeObserver){
  let lastW = 0, lastH = 0;
  new ResizeObserver(entries => {
    const { width, height } = entries[0].contentRect;
    if (!width || !height) return;
    if (Math.abs(width - lastW) < 2 && Math.abs(height - lastH) < 2) return;
    lastW = width; lastH = height;
    reflow();
  }).observe(document.getElementById('map'));
}
</script>
</body>
</html>
